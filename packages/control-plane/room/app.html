/* The ONE thing that is allowed to restart on the 4-second push, because that is
   precisely and only what it means. */
.beatdot { display: inline-block; width: 6px; height: 6px; background: var(--hot); vertical-align: 0.02em; }
.beatdot.push { animation: pushblip var(--dur-event) var(--ease-out) 1; }
@keyframes pushblip { 0% { transform: scale(2.1); opacity: 1; } 100% { transform: scale(1); opacity: 0.55; } }

/* ── OVERLAYS ──────────────────────────────────────────────────────
   The palette is the keyboard surface of everything on the deck; the digest is
   the answer to "what happened while I slept"; shortcuts is the map. */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.42); display: flex; align-items: flex-start; justify-content: center; padding: 8vh 1rem 1rem; }
.palette {
  width: min(560px, 96vw); max-height: 74vh; display: flex; flex-direction: column;
  background: var(--surface); border: var(--ink-bold) solid var(--line); box-shadow: var(--shadow);
}
.palette input {
  font-family: var(--font-mono); font-size: 0.9rem; padding: 0.55rem 0.7rem;
  border: 0; border-bottom: var(--ink-medium) solid var(--line);
  background: var(--surface-alt); color: var(--text); outline: none; width: 100%;
}
.palette ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 0; }
.palette li { display: flex; gap: 0.5rem; align-items: baseline; padding: 0.3rem 0.7rem; cursor: pointer; border-bottom: 1px dashed var(--hairline); min-width: 0; }
.palette li[aria-selected="true"] { background: var(--fill-solid); color: var(--page); }
.palette li[aria-selected="true"] .pgroup { color: var(--page); opacity: 0.8; }
.palette .pgroup { font-family: var(--font-mono); font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); flex: 0 0 4.6rem; }
.palette .plabel { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.85rem; }
.palette .pempty { padding: 0.7rem; font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-dim); }

.bigsheet {
  position: fixed; inset: 0; z-index: 42; background: var(--page); overflow-y: auto;
  padding: 1.2rem var(--gutter) 3rem;
}
.digest-lede { font-family: var(--font-display); font-size: clamp(1.6rem, 3.6vw, 2.6rem); line-height: 1.05; letter-spacing: 0.03em; }
.digest-sec { margin-top: 1.3rem; }
.digest-sec > h3 { font-size: 1.15rem; border-bottom: var(--ink-medium) solid var(--line); padding-bottom: 0.2rem; margin-bottom: 0.5rem; }
.digest-cov {
  margin-top: 1.4rem; font-family: var(--font-mono); font-size: 0.72rem; line-height: 1.5;
  border-left: var(--ink-bold) solid var(--flame); background: var(--surface-alt); padding: 0.5rem 0.7rem;
}
.handover {
  border: var(--ink-thick) solid var(--shatta); box-shadow: var(--shadow-red);
  background: var(--surface); padding: 0.5rem 0.7rem; margin: 0.5rem var(--pane-pad);
  display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap;
}
.handover .hl { font-family: var(--font-display); font-size: 1.15rem; letter-spacing: 0.04em; }

.shortcuts { columns: 2; column-gap: 1.4rem; font-family: var(--font-mono); font-size: 0.76rem; }
.shortcuts div { break-inside: avoid; padding: 0.15rem 0; display: flex; gap: 0.5rem; }
.shortcuts kbd {
  font-family: var(--font-mono); font-size: 0.68rem; border: 1px solid var(--line);
  background: var(--surface-alt); padding: 0 0.28rem; flex: 0 0 auto;
}

/* Notification rules — every one has a TEST button, because a silently broken
   alerter is strictly worse than no alerter. */
.rulerow { display: flex; align-items: center; gap: 0.5rem; padding: 0.22rem 0; border-bottom: 1px dashed var(--hairline); min-width: 0; }
.rulerow .rl { flex: 1 1 auto; min-width: 0; font-size: 0.82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rulerow .rc { font-family: var(--font-mono); font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-dim); flex: 0 0 auto; }
.offline-bar {
  background: var(--shatta); color: var(--on-fill); font-family: var(--font-mono);
  font-size: 0.7rem; font-weight: 700; padding: 0.25rem 0.6rem; text-align: center;
}

/* Directive 3 is linework and hard offsets — neither needs motion to read, and the founder
   watches this page for hours. Everything ambient stops; nothing moves or disappears. */
@media (prefers-reduced-motion: reduce) {
  .marquee-dot.on, .marquee-dot.off, .marquee-dot.on::after,
  .marquee-rule.idle::after, .strip-dots i.hot, .runbar.live > i { animation: none !important; }
  .marquee-dot.on::after { opacity: 0.35; }
  .marquee-rule.idle::after { opacity: 0.25; transform: translateX(0); }
  .runbar.live > i { background: repeating-linear-gradient(45deg, var(--flame-soft) 0 5px, transparent 5px 10px); }
  .marquee-state.swap { animation: none !important; }
  .disclose { transition: none; }
  .gauge > i, .minibar > i, .chev { transition: none; }
  /* THE DECK. Motion becomes an instant state change, never a removal of information:
     the annunciator keeps its fill, the cadence bars keep their heights, the beat dot
     keeps its colour — only the movement stops. */
  .ann.caution.blink, .ann.alarm.blink { animation: none !important; }
  .beatdot.push { animation: none !important; }
  .cadence > i, .rwy-track > i.fill, .rwy-track > i.now, .rung > i.fill { transition: none !important; }
  * { will-change: auto !important; }
}

/* Directive 3 is linework and hard offsets — neither needs motion to read. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<div id="root"><div class="nojs"><strong>Loading the control room…</strong><br>If this persists, React could not be fetched. The terminal dashboard always works: <code>pnpm my-spec</code></div></div>

<!-- React is VENDORED, not fetched from a CDN. This page can start and kill processes
     through an unauthenticated local API, so a third-party script tag would be a
     supply-chain path straight into process control. Pinning an SRI hash would help; not
     loading remote code at all is better, and it works offline. -->
<meta name="loop-token" content="__LOOP_TOKEN__">
<script src="/react.production.min.js"></script>
<script src="/react-dom.production.min.js"></script>
<script>
const { useState, useEffect, useCallback, useRef, useMemo, createElement: h } = React;

// Per-server-start control token, injected into this HTML as it was served. A cross-origin
// page cannot read this document, so it cannot replay it — that is what makes the POST
// routes CSRF-resistant rather than merely loopback-bound.
const TOKEN = document.querySelector('meta[name="loop-token"]').content;

/* ── theme ─────────────────────────────────────────────────────────────
   Three modes: auto, light, dark. The resolved answer is written to
   data-theme on <html>, always explicitly, by the pre-paint script in
   <head> and then by this hook. The CSS carries no prefers-color-scheme
   block on purpose — one source of truth cannot disagree with itself.
   -------------------------------------------------------------------- */
/* ── management ────────────────────────────────────────────────────────
   Three roles, each a Claude Code session held open across turns. The loop had
   one overseer and nothing audited it, which is how 006 came to be marked built
   when it had never been started — so the manager exists to disagree with the
   supervisor, and the special agent exists for whatever you need that is neither.

   Replies stream. Each tool call a role makes arrives as it happens, so you watch
   it read the ledger rather than watching a spinner.
   -------------------------------------------------------------------- */

const roleAgo = (iso) => {
  if (!iso) return 'never';
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return Math.round(s) + 's ago';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
};

const money = (n) => '$' + (Number(n) || 0).toFixed(2);

const RoleCard = ({ role, live, selected, onOpen }) =>
  h('button', {
    className: 'role' + (role.busy || live?.length > 0 ? ' working' : ''),
    'aria-current': selected ? 'true' : 'false',
    onClick: () => onOpen(role.id),
  },
    h('div', { className: 'role-name' }, role.name),
    h('div', { className: 'role-tag' }, role.tagline),
    h('div', { className: 'role-chips' },
      (role.busy || live?.length > 0)
        ? h('span', { className: 'chip live' }, 'working now')
        : h('span', { className: 'chip ro' }, role.started ? 'idle' : 'not started yet'),
      // The permission mode is shown, not assumed. An auditor that could edit what it audits
      // would not be an auditor, and you should be able to see that rather than trust it.
      h('span', { className: 'chip ro' }, role.permissionMode === 'plan' ? 'read-only' : role.permissionMode),
      role.openTasks > 0 && h('span', { className: 'chip warn' }, role.openTasks + ' task' + (role.openTasks > 1 ? 's' : '')),
      role.id === 'special' && !role.hasMandate && h('span', { className: 'chip ro' }, 'no mandate yet')),
    role.lastSaid
      ? h('div', { className: 'role-said' }, role.lastSaid)
      : h('div', { className: 'role-said', style: { fontStyle: 'italic' } },
          'Nothing said yet. Open it and ask something — it reads the loop’s own state files to answer.'),
    live?.length > 0 && h('div', { className: 'role-doing' },
      live.slice(-2).map((st, i) => h('div', { key: i }, st.tool + '  ' + st.detail))),
    h('div', { className: 'role-foot' },
      h('span', null, role.turns + ' turn' + (role.turns === 1 ? '' : 's')),
      h('span', null, money(role.costUsd)),
      h('span', null, roleAgo(role.lastAt))));

const ChatSheet = ({ role, detail, liveSteps, partial, draft, onDraft, onSend, onClose, onTask, onMandate, busy }) => {
  if (!role) return null;
  const msgs = detail?.messages ?? [];
  const tasks = detail?.tasks ?? [];
  const working = role.busy || liveSteps.length > 0;

  return h('div', { className: 'sheet', role: 'dialog', 'aria-label': 'Chat with ' + role.name },
    h('div', { className: 'sheet-head' },

      h('div', { className: 'prov', style: { marginBottom: '0.5rem' } },
        role.tagline + ' · ' + (role.permissionMode === 'plan' ? 'read-only: it can read this repo, not change it' : 'mode ' + role.permissionMode) +

/* ── the founder brief ─────────────────────────────────────────────────
   Everything on this sheet is read out of the repo by lib/founder-brief.mjs:
   the checks are the spec's own Given/When/Then acceptance scenarios, the
   setup steps are docs/dev-setup.md, the decisions are PARKED.md. Each one
   prints the file and line it came from, because a checklist a founder cannot
   audit is worth no more than the claim that the work is already done.
   -------------------------------------------------------------------- */

/** file:line, or a file plus a note when the source is a document without one. */
const provenance = (src) => {
  if (!src) return null;
  const base = String(src.file).replace(/\\/g, '/');
  return base + (src.line ? ':' + src.line : '') + (src.note ? ' (' + src.note + ')' : '');
};

const CheckRow = ({ check, sectionKey, isDone, isNext, note, onToggle, onNote, busy }) => {
  const [draft, setDraft] = useState(note ?? '');
  const [editing, setEditing] = useState(false);
  useEffect(() => { setDraft(note ?? ''); }, [note]);
  const gwt = check.given;
  const showNote = editing || Boolean(note) || isNext;

  return h('div', {
    className: 'check' + (isDone ? ' done' : '') + (isNext ? ' next' : ''),
    'data-next': isNext ? 'true' : undefined,
  },
    h('input', {
      type: 'checkbox', checked: isDone, disabled: busy,
      'aria-label': check.title + (isDone ? ' (done)' : ''),
      onChange: (e) => onToggle(check.key, e.target.checked),
    }),
    h('div', { className: 'body' },
      h('div', { className: 'ct' },
        h('span', null, check.title),
        isNext && h('span', { className: 'tag' }, 'do this next')),
      // A Given/When/Then reads as a test when it is laid out as one, and as a wall of
      // italics when it is not.
      gwt && (gwt.given || gwt.when || gwt.then)
        ? h('div', { className: 'gwt' },
            gwt.given && h('div', null, h('b', null, 'GIVEN'), h('span', null, gwt.given)),
            gwt.when && h('div', null, h('b', null, 'WHEN'), h('span', null, gwt.when)),
            gwt.then && h('div', null, h('b', null, 'THEN'), h('span', null, gwt.then)))
        : check.detail && h('div', { className: 'cd' }, check.detail),
      check.commands?.length > 0 && h('div', { className: 'cmds' },
        check.commands.map((cmd, i) => h('code', { key: i }, cmd))),
      provenance(check.source) && h('div', { className: 'prov' }, 'from ' + provenance(check.source)),
      showNote && h('div', { className: 'notebox' },
        h('textarea', {
          value: draft, placeholder: 'What did you actually see? (optional, saved with the sign-off)',
          onChange: (e) => { setDraft(e.target.value); setEditing(true); },
          onBlur: () => { if (draft !== (note ?? '')) onNote(check.key, draft); setEditing(false); },
        })),
      !showNote && h('button', { className: 'linkish', onClick: () => setEditing(true) }, 'add a note')));
};

const BriefSheet = ({ brief, busy, onToggle, onNote, onSignoff, onClose }) => {
  if (!brief) return null;
  if (brief.error) {
    return h('div', { className: 'sheet', role: 'dialog' },
      h('div', { className: 'sheet-head' },
        h('span', { className: 'display', style: { fontSize: '1.2rem', flex: 1 } }, 'Could not build the brief'),
        h('button', { onClick: onClose }, 'Close')),
      h('div', { className: 'sheet-body' }, h('pre', null, brief.error)));
  }

  const pg = brief.progress || { blockingDone: 0, blockingTotal: 0, checked: {}, notes: {} };
  const checked = pg.checked || {};
  const notes = pg.notes || {};

  // "One by one" is this line: the first unticked BLOCKING check is the only step marked, so
  // there is never a question about where to resume.
  let nextKey = null;
  for (const section of brief.sections) {
    if (NON_BLOCKING.has(section.key)) continue;
    for (const c of section.checks) { if (!checked[c.key] && !nextKey) nextKey = c.key; }
  }

  const frac = pg.blockingTotal ? pg.blockingDone / pg.blockingTotal : 0;
  const ready = pg.blockingTotal > 0 && pg.blockingDone === pg.blockingTotal;
  const signedOff = brief.signedOffInGit || Boolean(pg.signedOffAt);

  const jumpToNext = () => {
    const el = document.querySelector('.check[data-next="true"]');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  return h('div', { className: 'sheet', role: 'dialog', 'aria-label': 'Founder brief: ' + brief.title },
    h('div', { className: 'sheet-head' },
      h('span', { className: 'display', style: { fontSize: '1.25rem', flex: 1, minWidth: 0 } }, brief.title),
      h('button', { onClick: onClose }, 'Close')),

    h('div', { className: 'sheet-body' },
      h('div', { className: 'stepnav' },
        h('div', { className: 'row' },
          h('span', { className: 'count' }, pg.blockingDone + ' / ' + pg.blockingTotal),
          h('span', { style: { flex: 1, minWidth: '6rem' } },
            h('div', { className: 'bigbar' }, h('i', { className: ready ? 'full' : '', style: { width: Math.round(frac * 100) + '%' } }))),
          nextKey
            ? h('button', { onClick: jumpToNext }, 'Next step')
            : h('span', { className: 'mono', style: { fontSize: '0.68rem', color: 'var(--hot)', fontWeight: 700 } }, 'all checks walked'))),

      h('p', { style: { fontSize: '0.9rem', lineHeight: 1.5, marginTop: 0 } }, brief.headline),
      brief.why && h('p', { style: { fontSize: '0.84rem', lineHeight: 1.5, color: 'var(--text-soft)' } }, brief.why),
      brief.specDir && h('div', { className: 'prov' }, 'spec: ' + String(brief.specDir).replace(/\\/g, '/')),
      brief.affectsSpec && h('div', { className: 'prov' }, 'affects spec ' + brief.affectsSpec),

      brief.sections.map((section) => h('div', { className: 'sect', key: section.key },
        h('h5', null,
          section.title,
          section.priority && h('span', { className: 'pri' }, section.priority),
          NON_BLOCKING.has(section.key) &&
            h('span', { className: 'opt' }, 'does not gate sign-off')),
        section.note && h('p', { className: 'note' }, section.note),
        section.independentTest && h('p', { className: 'note' },
          h('b', null, 'How it is proved automatically: '), section.independentTest),
        section.checks.map((check) => h(CheckRow, {
          key: check.key, check, sectionKey: section.key,
          isDone: Boolean(checked[check.key]), isNext: check.key === nextKey,
          note: notes[check.key], onToggle, onNote, busy,
        })))),

      // Honest about its own gaps. A brief that quietly emits fewer checks because a document
      // did not parse is indistinguishable from a feature with less to test.
      brief.problems?.length > 0 && h('div', { className: 'problems' },
        h('div', { className: 'mono', style: { fontSize: '0.66rem', fontWeight: 700, marginBottom: '0.3rem' } },
          brief.problems.length + ' thing(s) this brief could not read — checks may be missing:'),
        h('ul', { style: { margin: 0, paddingLeft: '1rem' } },
          brief.problems.map((pr, i) => h('li', { key: i }, pr)))),

      brief.kind === 'spec' && h('div', { className: 'signoff' + (ready && !signedOff ? ' ready' : '') },
        h('h5', null, signedOff ? 'Signed off' : 'Sign off spec ' + brief.id),
        h('p', null,
          signedOff
            ? 'A signed-off/' + brief.id + ' tag exists in git. The driver frees the review slot at its next tick boundary, and the loop opens the next spec.'
            : ready
              ? 'Every blocking check is ticked. Signing off creates an annotated git tag, which is what the driver reads — it is not a dashboard flag, and it survives this machine.'
              : (pg.blockingTotal - pg.blockingDone) + ' check(s) still unticked. Sign-off is refused until then: a button that works regardless of the checklist is just a faster way to make the same unverified claim the loop is already forbidden from making.'),
        h('button', {
          className: ready && !signedOff ? 'danger' : '',
          disabled: busy || signedOff || !ready,
          onClick: () => onSignoff(brief.id),
        }, signedOff ? 'Already signed off' : 'Sign off ' + brief.id))));
};

/** Sections that inform but do not gate — mirrors NON_BLOCKING_SECTIONS in founder-checks.mjs. */
const NON_BLOCKING = new Set(['setup', 'routes']);


const THEME_KEY = (window.__loopTheme && window.__loopTheme.key) || 'loop-theme';
const prefersDark = () => window.matchMedia('(prefers-color-scheme: dark)').matches;
const resolveTheme = (mode) => mode === 'dark' || (mode === 'auto' && prefersDark());

/** The tab icon is part of the drawing: a cream stamp beside dark tabs reads as a mistake. */
function paintFavicon(dark) {
  const page = dark ? '%231A1A1A' : '%23EDE4CC';
  const line = dark ? '%23EDE4CC' : '%231A1A1A';
  const svg = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E" +
    "%3Crect width='32' height='32' fill='" + page + "'/%3E" +
    "%3Crect x='3' y='3' width='26' height='26' fill='none' stroke='" + line + "' stroke-width='3'/%3E" +
    "%3Ccircle cx='16' cy='16' r='6' fill='%23D62828'/%3E%3C/svg%3E";
  let el = document.querySelector('link[rel="icon"]');
  if (!el) { el = document.createElement('link'); el.rel = 'icon'; document.head.appendChild(el); }
  el.href = svg;
}

function useTheme() {
  const [mode, setMode] = useState(() => (window.__loopTheme && window.__loopTheme.mode) || 'auto');
  useEffect(() => {
    const apply = (dark) => {
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      paintFavicon(dark);
    };
    apply(resolveTheme(mode));
    try { localStorage.setItem(THEME_KEY, mode); } catch { /* private mode — the choice just will not survive a reload */ }
    if (mode !== 'auto') return undefined;
    // Only AUTO tracks the machine, and it tracks it LIVE — a system flip at dusk should
    // land on an open dashboard, which is the whole reason auto is a distinct position.
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => apply(mq.matches);
    mq.addEventListener('change', onChange);
    return () => mq.removeEventListener('change', onChange);
  }, [mode]);
  return [mode, setMode];
}

const THEME_MODES = [
  ['auto', 'Auto', 'Follow the system setting'],
  ['light', 'Paper', 'Cream paper, black ink'],
  ['dark', 'Night', 'The same drawing reversed out — white ink on a night panel'],
];

/* The three positions survive; the SEGMENTED CONTROL does not. On a 40px annunciator
   bar, three buttons for one setting is three slots stolen from eight that carry alarms,
   so the bar cycles and the palette names all three explicitly — AUTO is still its own
   position, which is the whole reason it exists. */
const THEME_ORDER = THEME_MODES.map((m) => m[0]);
const isMac = /Mac|iPhone|iPad/.test((navigator.platform || '') + ' ' + navigator.userAgent);

/* ── the live feed ─────────────────────────────────────────────────────
   One EventSource for the whole page. It carries four kinds of message:

     hello   the full agent tree as it stands, so arriving mid-tick shows the
             whole tick rather than only what happens after you looked
     agents  changed agents plus the activity lines appended since the last frame
     where   the derived narrative
     state   the same payload /api/state returns, pushed instead of polled

   EventSource reconnects by itself, which is most of why the transport is SSE.
   A slow poll stays as a backstop: if the stream dies in a way the browser does
   not notice, the page must go stale-and-visibly-so, never silently frozen.
   -------------------------------------------------------------------- */
function useLive() {
  const [agents, setAgents] = useState([]);
  const [counts, setCounts] = useState({});
  const [meta, setMeta] = useState(null);
  const [where, setWhere] = useState(null);
  const [state, setState] = useState(null);
  const [link, setLink] = useState('connecting');
  const [lastAt, setLastAt] = useState(null);
  const [roleEvent, setRoleEvent] = useState(null);
  // Activity is kept outside React state and mirrored through a counter: appending to a
  // per-agent log 150 lines at a time would otherwise re-render the whole grid each frame.
  const trace = useRef(new Map());
  const [traceTick, setTraceTick] = useState(0);

  useEffect(() => {
    const es = new EventSource('/api/live');
    const stamp = () => setLastAt(Date.now());

    es.onopen = () => { setLink('live'); stamp(); };
    es.onerror = () => setLink('reconnecting');

    es.addEventListener('hello', (e) => {
      const d = JSON.parse(e.data);
      setAgents(d.agents); setCounts(d.counts || {}); setMeta(d.meta); setWhere(d.where);
      setLink('live'); stamp();
    });

    es.addEventListener('tick', (e) => {
      // A new run STARTED IN ONE LANE. Only that lane's agents reset — clearing all three
      // lanes because one rotated made two healthy sessions vanish from the grid.
      const d = JSON.parse(e.data);
      const prefix = d.lane ? d.lane + '\u00b7' : null;
      if (prefix) {
        for (const k of [...trace.current.keys()]) if (String(k).startsWith(prefix)) trace.current.delete(k);
        setAgents((prev) => prev.filter((a) => !String(a.id).startsWith(prefix)));
      } else {
        trace.current = new Map();
        setAgents([]); setCounts({});
      }
      setMeta(d.meta); setTraceTick((n) => n + 1); stamp();
    });

    es.addEventListener('agents', (e) => {
      const d = JSON.parse(e.data);
      setCounts(d.counts || {});
      if (d.meta) setMeta(d.meta);
      setAgents((prev) => {
        const byId = new Map(prev.map((a) => [a.id, a]));
        for (const a of d.agents) byId.set(a.id, { ...(byId.get(a.id) || {}), ...a });
        // Spawn order, which is also the order the founder saw them appear.
        return [...byId.values()];
      });
      if (d.activity?.length) {
        for (const { id, entry } of d.activity) {
          const log = trace.current.get(id) || [];
          log.push(entry);
          if (log.length > 400) log.splice(0, log.length - 400);
          trace.current.set(id, log);
        }
        setTraceTick((n) => n + 1);
      }
      stamp();
    });

    // Sent when the tick's identity is resolved after the fact: the directory appears about
    // half a second before the driver logs which tick it is, so the first read can be missing
    // the spec, the stage and the start time.
    es.addEventListener('meta', (e) => { setMeta(JSON.parse(e.data).meta); stamp(); });
    // Role turns stream: every tool call as it happens, then the finished reply. The point is
    // being able to see it open the wrong file WHILE it happens, not afterwards.
    es.addEventListener('role', (e) => { setRoleEvent(JSON.parse(e.data)); stamp(); });
    es.addEventListener('where', (e) => { setWhere(JSON.parse(e.data)); stamp(); });
    es.addEventListener('state', (e) => { setState(JSON.parse(e.data)); stamp(); });

    return () => es.close();
  }, []);

  return { agents, counts, meta, where, state, link, lastAt, trace: trace.current, traceTick, roleEvent };
}

/** A command is not an agent and the worker is not a subagent; say so in the label. */
const agentLabel = (a) =>
  a.kind === 'session' ? a.name + ' (the worker)' : a.kind === 'local_bash' ? 'command' : a.name;

/**
 * A parked heading, as a founder-readable line.
 *
 * PARKED.md headings are not written to one format. Most are "2026-08-22 · reason", one is
 * "2026-08-22T03:58:14.061Z · reason", and one uses a hyphen — which the old single-separator
 * strip did not match, so that entry rendered with its date still attached while the others
 * did not. And one entry's whole reason is the placeholder "blocked item", which as a bullet
 * in a red panel tells the founder there is a blocker and nothing about it; keeping the date
 * at least lets them find it in PARKED.md.
 */
const parkedLabel = (raw) => {
  const m = String(raw).match(/^(\d{4}-\d{2}-\d{2}(?:T[\d:.]+Z)?)\s*[·\-—]\s*([\s\S]*)$/);
  const when = m ? m[1].slice(0, 10) : null;
  const text = (m ? m[2] : String(raw)).trim();
  if (when && /^(blocked item|blocked|parked)$/i.test(text)) {
    return text + ' — no reason was recorded (' + when + ', see PARKED.md)';
  }
  return text;
};

const AGENT_STAT = (a) => {
  const bits = [];
  if (a.toolUses) bits.push(a.toolUses + ' tools');
  // A subagent gets an authoritative total from the runtime. The worker gets none, so its
  // context size stands in — the quantity that actually ends its tick — labelled differently
  // so the two are never read as the same measurement.
  if (a.tokens) bits.push(Math.round(a.tokens / 1000) + 'k tok');
  else if (a.contextTokens) bits.push('ctx ' + Math.round(a.contextTokens / 1000) + 'k');
  if (a.durationMs) bits.push(a.durationMs < 60000 ? Math.round(a.durationMs / 1000) + 's' : Math.round(a.durationMs / 60000) + 'm');
  return bits;
};

/**
 * What the Agents tab badge says.
 *
 * Three states, because one count cannot express them. Agents out right now is the number
 * worth a glance. With none out but the worker running, "solo" reports a fact rather than an
 * absence. Only a genuinely idle loop gets a plain number.
 */
const agentBadge = (liveCount, total, workerBusy) => {
  if (liveCount > 0) return liveCount + ' live';
  if (workerBusy) return 'solo';
  return String(total);
};

const barClass = (status) =>
  status === 'running' ? 'runbar live' : status === 'failed' ? 'runbar bad' : status === 'stopped' ? 'runbar cold' : 'runbar done';

const AgentCard = ({ a, parent, index, selected, onOpen }) =>
  h('button', {
    className: 'agent ' + a.status + (a.kind === 'local_bash' ? ' cmd' : ''),
    'aria-current': selected ? 'true' : 'false',

  },
    h('div', { className: 'agent-top' },
      h('i', { className: 'sdot ' + a.status }),
      h('span', { className: 'agent-name' }, agentLabel(a)),

    a.depth > 1 && parent && h('div', { className: 'agent-under' }, 'under ' + agentLabel(parent)),
    h('div', { className: 'agent-desc' }, a.description),
    h('div', { className: barClass(a.status) }, h('i', null)),
    h('div', { className: 'agent-meta' }, AGENT_STAT(a).map((b, i) => h('span', { key: i }, b)),
      a.status === 'running' && h('span', { style: { color: 'var(--hot)' } }, 'working')),

    // makes a card look like it has news when it does not.

      h('div', { className: 'agent-last' }, a.lastActivity));

const AgentSheet = ({ a, parent, children, log, onClose }) => {
  if (!a) return null;

    h('div', { className: 'sheet-head' },

      h('span', { className: 'display', style: { fontSize: '1.3rem', flex: 1, minWidth: 0 } }, agentLabel(a)),
      h('button', { onClick: onClose }, 'Close')),
    h('div', { className: 'sheet-body' },
      h('h4', null, 'What it was asked to do'),
      h('div', { style: { fontSize: '0.9rem' } }, a.description),
      h('div', { className: 'agent-meta', style: { marginTop: '0.5rem' } },
        h('span', null, a.status),

        h('span', null, 'depth ' + a.depth)),

      children.length > 0 && h('div', null,
        h('h4', null, 'It dispatched ' + children.length + ' of its own'),

            a.status === 'running'

      a.outputFile && h('div', null, h('h4', null, 'Full output on disk'), h('pre', null, a.outputFile))));
};

const WherePanel = ({ where }) => {

  return h('div', null,
    h('div', { className: 'where-head' }, where.headline),

    h('ul', { className: 'where-list' },
      where.blockers.map((b, i) => h('li', { key: 'b' + i, className: 'block' },

    // Stated outright, because a summary that looks model-written invites more trust than

const pct = (n) => Math.round(n * 100);
const fmtMin = (m) => (m == null ? '—' : m < 60 ? m + 'm' : Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0'));
const ago = (iso) => {
  if (!iso) return '—';
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  return s < 90 ? Math.round(s) + 's ago' : s < 5400 ? Math.round(s / 60) + 'm ago' : (s / 3600).toFixed(1) + 'h ago';
};
const clock = (ms) => (ms ? new Date(ms).toTimeString().slice(0, 5) : '—');

const BAD = ['stalled', 'hung', 'timed-out', 'errored', 'no-progress', 'no-attempt', 'account-refused'];
const WARN = ['rate-limited', 'aborted', 'awaiting-founder'];

function Panel({ title, sub, alert, children }) {
  return h('section', { className: 'panel' + (alert ? ' alert' : '') },
    title && h('div', { className: 'panel-title' }, h('span', null, title), sub && h('span', { className: 'sub' }, sub)),

}

function Stat({ n, l }) {
  return h('div', { className: 'stat' }, h('span', { className: 'n' }, n), h('span', { className: 'l' }, l));
}

function Progress({ done, built, total }) {

    h('div', { className: 'bar', role: 'img', 'aria-label': done + ' done, ' + built + ' built, of ' + total },

      built > 0.05 && h('span', null, h('b', null, built.toFixed ? built.toFixed(1) : built), ' built, unsigned'),
      h('span', null, 'of ', h('b', null, total))));
}

function Accounts({ accounts, events }) {
  const feed = events || [];
  const line = (e, i) => h('li', { key: String(e) + '#' + i }, h('span', { className: 'hint' }, e));
  return h(Panel, { title: 'Accounts', sub: 'the API reports a % only past ~90%' },
    // auto-fit rather than a stack: two or three accounts side by side are one 128px row
    // instead of a 549px column, and the cards themselves are unchanged.
    h('div', { className: 'acctgrid' }, accounts.map((a) => {
      const u = a.utilization;
      const cls = u == null ? '' : u >= 0.9 ? 'crit' : u >= 0.7 ? 'warn' : '';
      return h('div', { key: a.id, className: 'acct' + (a.cold ? ' cold' : '') },
        h('div', { className: 'acct-top' },
          h('span', { className: 'acct-name' }, a.id),
          a.refused ? h('span', { className: 'tag hot' }, 'refused ' + a.coldMinutes + 'm')
            : a.cold ? h('span', { className: 'tag hot' }, 'cold ' + a.coldMinutes + 'm')
            : h('span', { className: 'tag' + (u != null && u >= 0.9 ? ' warm' : '') }, a.rateStatus || 'warm')),
        h('div', { className: 'gauge', title: u == null ? 'under the reporting threshold' : pct(u) + '% used' },
          h('i', { className: cls, style: { transform: 'scaleX(' + (u == null ? 0.08 : Math.max(0.04, u)) + ')' } })),
        h('div', { className: 'acct-meta' },
          h('span', null, u == null ? '<90%' : pct(u) + '% used'),
          h('span', null, a.ticks + ' ticks'),
          h('span', null, '~$' + a.cost.toFixed(2)),
          a.windowEndsAt && h('span', null, 'window ' + clock(a.windowEndsAt)),
          a.overageStatus === 'allowed' && h('span', { style: { color: 'var(--hot)', fontWeight: 700 } }, 'OVERAGE ON')),
        a.refusedReason && a.cold && h('div', { className: 'acct-meta', style: { color: 'var(--hot-deep)' } }, a.refusedReason.slice(0, 110)));
    })),
    // The switch narration the prototype logged on every tick start: "account X is cold —
    // leased Y". Derived from the run rows, so it is the same fact the tick table shows.
    // Four lines, then the rest behind a disclosure — the whole list is still in the DOM.
    feed.length > 0 && h('ul', { className: 'feed', style: { marginTop: '0.7rem' } }, feed.slice(0, 4).map(line)),
    feed.length > 4 && h('details', { className: 'morebox' },
      h('summary', null, 'show all ' + feed.length + ' account events'),

/* Supervisor status word → the tag class that colours it. Base tag is neutral (ok), warm is
   an amber caution (repaired / blocked), hot is the red the page reserves for a real break. */
const HEALTH_TAG = { ok: '', repaired: ' warm', failed: ' hot', blocked: ' warm', unknown: ' mute' };

/* ── pure helpers ──────────────────────────────────────────────────────
   Derivations with no hooks, no DOM and no closure over anything outside this
   block, so room-server.spec.ts can slice them out of this file and test them
   directly. A formatter that is only exercised through a screenshot is a
   formatter nobody has tested.
   -------------------------------------------------------------------- */

/**
 * A live elapsed clock: mm:ss under an hour, h:mm:ss over it.
 *
 * Seconds rather than the old whole-minute `fmtMin`, because the marquee's whole claim is
 * that the loop is moving RIGHT NOW — a figure that sits on "7m" for sixty seconds is
 * indistinguishable from a frozen page, which is the exact lie this room exists to stop.
 */
const laneElapsed = (startedAt, now) => {
  if (!startedAt) return '—';
  const total = Math.max(0, Math.floor((((now == null) ? Date.now() : now) - startedAt) / 1000));
  const hh = Math.floor(total / 3600);
  const mm = Math.floor((total % 3600) / 60);
  const ss = total % 60;
  const p2 = (n) => String(n).padStart(2, '0');
  return hh > 0 ? hh + ':' + p2(mm) + ':' + p2(ss) : p2(mm) + ':' + p2(ss);
};

/**
 * Owed items in the order a founder can actually clear them.
 *
 * Ready-to-sign-off first (one click finishes it), then most-progressed (the shortest walk
 * to the next sign-off), then oldest by the day it was recorded, and already-signed-off last
 * — those are receipts, not debts, and they are kept because a debt that vanishes the moment
 * it is paid gives the founder no way to check that it was. An item with no recorded date
 * sorts after ones that have one rather than pretending to be the oldest.
 */
const sortOwed = (items) => {
  const rank = (it) => (it && it.signedOff ? 3 : (it && it.progress && it.progress.complete) ? 0 : 1);
  const frac = (it) => (it && it.progress && it.progress.total ? it.progress.done / it.progress.total : 0);
  const when = (it) => String((it && it.recordedOn) || '￿');
  return (items || []).slice().sort((a, b) => {
    const r = rank(a) - rank(b);
    if (r !== 0) return r;
    const f = frac(b) - frac(a);
    if (f !== 0) return f;
    return when(a).localeCompare(when(b));
  });
};

/**
 * The one sentence the COLLAPSED self-healing strip shows.
 *
 * It has to be the worst thing on the roster, never a summary that averages a break away:
 * this panel exists because of the night the loop was dead for eight hours behind a header
 * that said RUNNING. "5 of 6 ok" is that header wearing a new font.
 */
const healthWorst = (rows) => {
  const list = rows || [];
  if (!list.length) return 'no checks on the roster';
  const failed = list.filter((r) => r.status === 'failed');
  if (failed.length) {
    return failed.length + ' check' + (failed.length > 1 ? 's' : '') + ' FAILING — ' +
      failed.map((r) => r.label).join(', ');
  }
  const warm = list.filter((r) => r.status === 'repaired' || r.status === 'blocked');
  if (warm.length) return warm.map((r) => r.label + ' ' + r.status).join(' · ');
  const quiet = list.filter((r) => r.status === 'unknown' || !r.reported);
  if (quiet.length === list.length) return 'nothing reported yet — ' + list.length + ' checks on the roster';
  if (quiet.length) return quiet.length + ' of ' + list.length + ' checks have never reported';
  return 'all ' + list.length + ' checks ok';
};

/**
 * Which shell the deck can honestly draw.
 *
 * The fixed instrument grid needs both axes: below 760px the three console columns
 * stack into a scroll anyway, and below 700px tall the PFD alone eats the viewport
 * and the console grid gets nothing. Either miss and the page falls back to the
 * document flow rather than drawing a deck it cannot fit — a cramped instrument is
 * worse than an honest page.
 */
const shellFor = (w, hgt) => (w >= 760 && hgt >= 700 ? 'deck' : 'doc');

/** '6s' / '4m 12s' / '2h 06m' — the elapsed form the cadence readout and the wire use. */
const spanShort = (ms) => {
  if (ms == null || !isFinite(ms)) return '—';
  const s = Math.max(0, Math.floor(ms / 1000));
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's';
  return Math.floor(s / 3600) + 'h ' + String(Math.floor((s % 3600) / 60)).padStart(2, '0') + 'm';
};

/**
 * R3 — a freshness budget, evaluated.
 *
 * Every metric on the deck declares how old it is allowed to get before it stops
 * being a statement about now. Over budget it does NOT disappear and it does NOT
 * keep a clean face: it hatches itself and says how old it is, because a stale
 * number wearing a fresh face is the exact failure this room was built after.
 * A missing timestamp is UNKNOWN freshness, never fresh.
 */
const freshness = (at, budgetMs, now) => {
  const t = now == null ? Date.now() : now;
  const stamp = at == null ? null : (typeof at === 'number' ? at : new Date(at).getTime());
  if (stamp == null || !isFinite(stamp)) return { known: false, stale: false, ageMs: null, label: null };
  const ageMs = Math.max(0, t - stamp);
  const stale = budgetMs != null && ageMs > budgetMs;
  return { known: true, stale, ageMs, label: stale ? 'as of ' + spanShort(ageMs) + ' ago' : null };
};

/**
 * R2 — which of the four provenance classes a fact wears, when the instruments
 * module has not supplied one.
 *
 * An absent value is UNKNOWN and nothing else; a value the page has not watched
 * land is REPORTED. The page never upgrades a fact on its own — only the journal,
 * which actually witnessed the transition, can say `observed`.
 */
const factClass = (value, declared) => {
  if (value == null || value === '') return 'unknown';
  if (declared === 'observed' || declared === 'reported' || declared === 'reconstructed' || declared === 'unknown') return declared;
  return 'reported';
};

/** The four classes, as the class token the stylesheet uses. */
const PROV_CLASS = { observed: 'obs', reported: 'rep', reconstructed: 'rec', unknown: 'unk' };

/**
 * Fuzzy subsequence match for the command palette. Returns a score (lower is better)
 * or -1 for no match. Contiguous runs and word-start hits win, so 'kil' finds
 * "Kill now" ahead of "Spec 011 — checklist".
 */
const paletteScore = (query, label) => {
  const q = String(query || '').toLowerCase().trim();
  const s = String(label || '').toLowerCase();
  if (!q) return 0;
  let i = 0, score = 0, last = -1;
  for (const ch of q) {
    const at = s.indexOf(ch, i);
    if (at < 0) return -1;
    score += at - last - 1;                         // characters skipped
    if (at > 0 && /[\s\-·/]/.test(s[at - 1])) score -= 2;   // word start
    last = at; i = at + 1;
  }
  return score;
};

/** Palette rows, filtered and ranked. Ties keep authored order, which is the order of use. */
const rankPalette = (items, query) => {
  const out = [];
  (items || []).forEach((it, ix) => {
    const sc = paletteScore(query, (it && it.label) || '');
    if (sc >= 0) out.push({ it, sc, ix });
  });
  out.sort((a, b) => (a.sc - b.sc) || (a.ix - b.ix));
  return out.map((r) => r.it);
};

/**
 * How much clearing one owed item unblocks — the question six equal tiles never
 * answered. Ready-to-sign is one click from freeing a review slot, so it leads;
 * after that, weight by how many specs the item says it affects, then by how far
 * through its checklist it already is. `sortOwed` stays the tiebreak, and stays
 * exported, because recency is still the right answer when nothing else separates two.
 */
const unblockWeight = (it) => {
  if (!it) return 0;
  const affects = String((it && it.affectsSpec) || '');
  const downstream = affects ? affects.split(/[,\s]+/).filter((x) => /\d/.test(x)).length : 0;
  const ready = it.progress && it.progress.complete && !it.signedOff ? 6 : 0;
  const walked = it.progress && it.progress.total ? (it.progress.done / it.progress.total) * 2 : 0;
  const paid = it.signedOff ? -10 : 0;
  return ready + downstream * 1.5 + walked + paid;
};

/** Owed, ranked by what clearing it unblocks, with sortOwed's recency as the tiebreak. */
const rankOwed = (items) => {
  const base = sortOwed(items);
  const ix = new Map(base.map((it, i) => [it, i]));
  return base.slice().sort((a, b) => (unblockWeight(b) - unblockWeight(a)) || (ix.get(a) - ix.get(b)));
};

/** One line for the top owed tile: why THIS one first, in words, never a score. */
const unblockWhy = (it) => {
  if (!it) return null;
  if (it.signedOff) return 'already signed off — kept as the receipt';
  if (it.progress && it.progress.complete) return 'every check ticked — one click frees a review slot';
  const affects = String((it && it.affectsSpec) || '').trim();
  if (affects) return 'blocks ' + affects;
  if (it.progress && it.progress.total) return it.progress.total - it.progress.done + ' checks left to walk';
  return 'nothing else is waiting on a founder right now';
};

/**
 * The freshness budgets, in one place, in milliseconds. `health` is deliberately
 * absent: the supervisor reports its own staleAfterMs and reading a hardcoded number
 * over the top of it would be the room second-guessing the only thing that knows.
 */
const BUDGET = { state: 12000, heartbeat: 30000, ticks: 600000, gates: 3600000 };

/** The newest tool call anywhere, for the ticker. Null when nothing is in flight. */
const newestAction = (lanes) => {
  for (const lane of lanes || []) {
    const acts = (lane && lane.actions) || [];
    if (acts.length) return { tool: acts[acts.length - 1].tool, hint: acts[acts.length - 1].hint, lane: lane.spec || lane.id };
  }
  return null;
};

/**
 * A ledger figure with its own denominator.
 *
 * Every money number on the deck has to carry the n it was computed over and what
 * it left out, because `$1,742.10` over 40 rows where 24 have no cost is not a
 * total, it is a floor wearing a total's clothes.
 */
const overRows = (rows, pick) => {
  const list = rows || [];
  let n = 0, sum = 0;
  for (const r of list) {
    const v = pick(r);
    if (typeof v === 'number' && isFinite(v)) { n += 1; sum += v; }
  }
  return { n, sum, total: list.length, missing: list.length - n };
};

/** '16 of 40 rows carry a cost' — the exclusion line, spelt out, never implied. */
const exclusionLine = (n, total, noun) =>
  total === 0 ? 'no rows on the ledger yet'
    : n === total ? 'all ' + total + ' rows carry ' + noun
      : n + ' of ' + total + ' rows carry ' + noun;

/**
 * C1 — THE CADENCE METER, reduced from the frame ring.
 *
 * This is the only instrument on the page that DEMONSTRATES motion rather than
 * asserting it: it compares state.live.tools between consecutive 4-second frames,
 * so it can only report movement that actually happened between two things the
 * page watched. A chip that is always on cannot survive next to it, and neither
 * can a feed frozen at "starting up" — 502 tools unchanged for four minutes reads
 * as 502 tools unchanged for four minutes.
 *
 * Fewer than two samples is UNKNOWN, never zero: one frame proves nothing about
 * motion, and '0 tools/min' from a page that has been open for four seconds is a
 * fabricated accusation.
 */
const cadenceOf = (samples, now) => {
  const list = (samples || []).filter((x) => x && typeof x.tools === 'number' && typeof x.at === 'number');
  const t = now == null ? Date.now() : now;
  if (list.length < 2) {
    return { known: false, bars: [], perMin: null, lastMovementMs: null, spanMs: 0,
      tools: list.length ? list[list.length - 1].tools : null, verdict: 'unknown' };
  }
  const bars = [];
  for (let i = 1; i < list.length; i += 1) {
    // A frame gap wider than three missed pushes is a hole in the record, not a
    // quiet moment. It is drawn as a hole.
    bars.push({ at: list[i].at, d: Math.max(0, list[i].tools - list[i - 1].tools), gap: list[i].at - list[i - 1].at > 12000 });
  }
  const spanMs = list[list.length - 1].at - list[0].at;
  const moved = list[list.length - 1].tools - list[0].tools;
  const perMin = spanMs >= 20000 ? moved / (spanMs / 60000) : null;
  let lastMovementMs = null;
  for (let i = list.length - 1; i > 0; i -= 1) {
    if (list[i].tools > list[i - 1].tools) { lastMovementMs = t - list[i].at; break; }
  }
  if (lastMovementMs == null) lastMovementMs = t - list[0].at;
  const verdict = lastMovementMs > 120000 ? 'stalled' : moved > 0 ? 'moving' : 'quiet';
  return { known: true, bars, perMin, lastMovementMs, spanMs, tools: list[list.length - 1].tools, verdict };
};

/**
 * A polyline through n values, normalised into a w×hgt box. Drawing, not fact:
 * the instruments module owns the numbers, the page owns the ink. Returns null
 * for anything it cannot honestly draw, and null renders as a hatch.
 */
const sparkPathOf = (values, w, hgt) => {
  const v = (values || []).filter((n) => typeof n === 'number' && isFinite(n));
  if (v.length < 2) return null;
  const lo = Math.min(...v), hi = Math.max(...v);
  const span = hi - lo || 1;
  const step = w / (v.length - 1);
  return v.map((n, i) => (i === 0 ? 'M' : 'L') + (i * step).toFixed(1) + ' ' + (hgt - ((n - lo) / span) * hgt).toFixed(1)).join(' ');
};

/* ── end pure helpers ─────────────────────────────────────────────── */

/**
 * One row per supervised check — what was checked, when, and the last repair with its time.
 *
 * This panel exists because of the night the loop was dead for eight hours behind a header
 * that said RUNNING / LIVE FEED. Nothing on the page watched the processes, and nothing on
 * the page could have said so. A self-healer nobody can see is the same class of lie as a
 * frozen feed, so an absent or silent supervisor is stated in the panel's loudest words —
 * together with the one command that installs it.
 *
 * It collapses VISUALLY, never conditionally. The roster and the event feed are always
 * rendered and always in the DOM; `open` only changes whether the wrapper is 0fr or 1fr.
 * Hiding a break behind a conditional would be this panel telling the original lie itself.

    // the roster uses, each titled with its label and its reported word.
    h('div', { className: 'striphead' },
      h('div', { className: 'strip-dots' }, rows.map((r) => h('i', {
        key: r.check,

        title: r.label + ' — ' + (r.reported || 'not reported'),

    h('div', { className: 'disclose' + (open ? ' open' : '') }, h('div', null,
      // Bounded, not truncated: six roster cards plus a full event log is ~980px, which is

      h('div', { className: 'scrollcap', style: { paddingTop: '0.7rem' } },
        rows.map((r) => h('div', { key: r.check, className: 'acct' + (r.status === 'failed' ? ' cold' : '') },
          h('div', { className: 'acct-top' },
            h('span', { className: 'acct-name' }, r.label),
            h('span', { className: 'tag' + (HEALTH_TAG[r.status] || '') }, r.reported || 'not reported')),
