            h('div', { className: 'acct-meta', style: { color: 'var(--hot-deep)' } }, 'last repair: ' + r.lastRepairDetail.slice(0, 120)))),
        // 12 lines, then the rest behind a native disclosure. `details` rather than React
        // state because this component must stay callable as a plain function of props.
        events.length > 0 && h('ul', { className: 'feed', style: { marginTop: '0.7rem' } },
          ordered.slice(0, 12).map(eventLine)),
        ordered.length > 12 && h('details', { className: 'morebox' },
          h('summary', null, 'show all ' + ordered.length + ' events'),
          h('ul', { className: 'feed' }, ordered.slice(12).map(eventLine)))))));
}

/* ── progressive disclosure primitives ─────────────────────────────────
   Every list on this page was uncapped, which is how the Overview reached 4105px.
   None of them may DROP anything, so each caps at a readable default and says, in
   the count, exactly what it is holding back. "show all n" is not decoration: a
   silent cap reads as "this is everything", which is the one thing a record must
   never claim.
   -------------------------------------------------------------------- */

/** The action feed of one lane. Keys are content-derived, or every row would look new
    on every 4-second push and any enter animation would fire on all of them forever. */
function FeedList({ items, cap, prefix }) {
  const [all, setAll] = useState(false);
  const list = items || [];
  const start = all ? 0 : Math.max(0, list.length - cap);
  return h('div', null,
    h('ul', { className: 'feed' }, list.slice(start).map((a, i) =>
      h('li', { key: prefix + '|' + a.tool + '|' + a.hint + '#' + (start + i) },
        h('span', { className: 'tool' }, a.tool),
        h('span', { className: 'hint' }, a.hint)))),
    !all && list.length > cap && h('button', {
      className: 'linkish showall', type: 'button', onClick: () => setAll(true),
    }, 'show all ' + list.length + ' actions'));
}

/** The worker's last say-line. Three lines, then the rest in place — a quote that runs to
    fourteen lines pushes everything under it off the screen for one sentence of prose. */
function Say({ text }) {
  const [all, setAll] = useState(false);
  const long = String(text).length > 220;
  return h('div', null,
    h('div', { className: 'quote' + (all || !long ? '' : ' clamp') }, '“' + text + '”'),
    long && h('button', {
      className: 'linkish showall', type: 'button', onClick: () => setAll(!all),
    }, all ? 'clamp it' : 'show all of it'));
}

/* The body of one lane: the four figures, the action feed, the last thing it said. Shared so
   the single-lane panel is literally the prototype's Current tick (app.html:1244-1257) and the
   multi-lane one is the same body under a per-lane headline. */
function laneBody(lane) {
  const mins = lane.startedAt ? Math.round((Date.now() - lane.startedAt) / 60000) : null;
  return [
    h('div', { key: 'stats', className: 'statrow', style: { marginBottom: '0.6rem' } },
      h(Stat, { n: fmtMin(mins), l: 'elapsed' }),
      h(Stat, { n: lane.tools ?? 0, l: 'tool calls' }),
      h(Stat, { n: lane.verification ?? 0, l: 'verify cmds' }),
      h(Stat, { n: lane.subagents ?? 0, l: 'subagents' })),
    h(FeedList, { key: 'feed', items: lane.actions || [], cap: 8, prefix: String(lane.id || lane.spec || 'lane') }),
    lane.say && h(Say, { key: 'say', text: lane.say }),
  ];
}

function LaneBlock({ lane, divider }) {
  return h('div', { style: divider ? { borderTop: '2px solid var(--line)', marginTop: '0.9rem', paddingTop: '0.8rem' } : null },
    h('div', { className: 'panel-title', style: { border: 0, margin: 0, paddingBottom: '0.4rem' } },
      h('span', null, 'Spec ' + lane.spec + ' · ' + lane.stage),
      h('span', { className: 'sub' }, lane.account)),
    laneBody(lane));
}

function Live({ live, lanes, running }) {
  if (!running) return h(Panel, { title: 'Current tick' }, h('p', { className: 'mono' }, 'The loop is not running. Press START — it spawns detached and outlives this page.'));
  const all = (lanes && lanes.length) ? lanes : (live ? [live] : []);
  if (!all.length) return h(Panel, { title: 'Current tick' }, h('p', { className: 'mono' }, 'starting up…'));
  // One active spec is the normal case, and there it must LOOK like the prototype: the run id
  // in the sub, the figures straight underneath. '1 lane' plus a 'Spec X · stage' headline was
  // the multi-lane frame worn by a single lane — two extra lines of chrome saying what the
  // Catalog already says. Multi-lane rendering is kept for the >1 case only.
  if (all.length === 1) return h(Panel, { title: 'Current tick', sub: 'tick ' + all[0].id }, laneBody(all[0]));
  return h(Panel, { title: 'Current tick', sub: all.length + ' lanes' },
    all.map((lane, i) => h(LaneBlock, { key: lane.spec || i, lane, divider: i > 0 })));
}

/* ── ZONE 2: the marquee ───────────────────────────────────────────────
   The founder's four questions — is it working, on what, for how long, at what cost —
   were spread across a 9px header dot, the Current tick panel, a statrow, and Run totals
   2055px down the page. Nothing here is new data; every field already existed in
   buildRoomState. What is new is that they are read together, at a size that survives a
   glance up from a terminal.
   -------------------------------------------------------------------- */

/**
 * M4 — the elapsed clock. A leaf that owns its own 1s interval, so the tick re-renders
 * roughly forty characters and never the page. It deliberately does not animate: a digit
 * that fades in is a digit you cannot read at the moment it changes, and the motion that
 * carries "time is passing" is the crawl bar beside it.
 */
function Elapsed({ since }) {
  const [, bump] = useState(0);
  useEffect(() => {
    const id = setInterval(() => bump((n) => (n + 1) % 60), 1000);
    return () => clearInterval(id);
  }, []);
  return h('span', { className: 'mq-clock', title: 'since this lane started' }, laneElapsed(since, Date.now()));
}

/**
 * M7 — a figure that ADVANCES to its new value rather than teleporting.
 *
 * Keyed to the VALUE, never to a render: an identical 4-second push finds `target ===
 * from.current` and does nothing at all. The rAF lives in a leaf so the ~38 frames it
 * produces re-render one number, not the marquee.
 */
function Counter({ value, prefix, digits }) {
  const target = Number(value) || 0;
  const [shown, setShown] = useState(target);
  const from = useRef(target);
  useEffect(() => {
    if (target === from.current) return undefined;
    const a = from.current;
    from.current = target;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { setShown(target); return undefined; }
    const t0 = performance.now();
    let raf = 0;
    const step = (t) => {
      const k = Math.min(1, (t - t0) / 640);
      setShown(a + (target - a) * (1 - Math.pow(1 - k, 3)));
      if (k < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return h('span', { className: 'n', style: { fontVariantNumeric: 'tabular-nums' } },
    (prefix || '') + shown.toFixed(digits == null ? 0 : digits));
}

/**
 * M1 — the state word swap.
 *
 * Triggered from a useEffect comparing the STRING to a ref of its previous value, so a
 * WORKING → WORKING push is completely silent; the class is dropped on `animationend`, so a
 * re-render mid-flight cannot restart it. This is the only fact on the page that changes
 * meaning rather than magnitude, and a founder glancing up needs to catch that it moved.
 */
function StateWord({ state }) {
  const el = useRef(null);
  const prev = useRef(state);
  useEffect(() => {
    if (prev.current === state) return undefined;
    prev.current = state;
    const node = el.current;
    if (!node) return undefined;
    node.classList.remove('swap');
    void node.offsetWidth;           // one forced reflow, only ever on a real state change
    node.classList.add('swap');
    const done = () => node.classList.remove('swap');
    node.addEventListener('animationend', done, { once: true });
    return () => node.removeEventListener('animationend', done);
  }, [state]);
  return h('div', { className: 'marquee-state', ref: el }, state);
}

/* ── ZONE 4/5: the panels that report rather than block ────────────────
   Each keeps its name, its title and every field it had. What changed is that a
   reference strip is 110px collapsed instead of 1029px expanded by default.
   -------------------------------------------------------------------- */

/** The lanes' own task progress. Two blocks, then the rest in place. */
function CatalogLanes({ lanes }) {
  const [all, setAll] = useState(false);
  const shown = all ? lanes : lanes.slice(0, 2);
  return h(React.Fragment, null,
    shown.map((lane) => {
      const lp = lane.progress;
      return h('div', { key: lane.id, style: { marginTop: '1rem', borderTop: '2px solid var(--line)', paddingTop: '0.8rem' } },
        h('div', { className: 'panel-title', style: { border: 0, margin: 0, paddingBottom: '0.3rem' } },
          h('span', null, 'Spec ' + lane.id + (lane.stage ? ' · ' + lane.stage : '')), h('span', { className: 'sub' }, lane.slug)),
        !lp && h('p', { className: 'mono', style: { fontSize: '0.78rem', margin: '0.2rem 0 0', color: 'var(--text-soft)' } },
          'SHAPING — no tasks.md yet. This lane is writing spec.md, plan.md and tasks.md from the catalog entry, then the DESIGN gate rules on all three together.'),
        lp && h(Progress, { done: lp.done, built: lp.held, total: lp.total }),
        lp && h('div', { className: 'bar-legend' },
          h('span', null, h('b', null, lp.done), ' done'),
          h('span', null, h('b', null, lp.open), ' open'),
          lp.held > 0 && h('span', null, h('b', null, lp.held), ' held (reason stated)'),
          lp.unmarked > 0 && h('span', { style: { color: 'var(--hot)', fontWeight: 700 } }, lp.unmarked + ' UNMARKED'),
          lp.currentWave && h('span', null, lp.currentWave.slice(0, 46))));
    }),
    lanes.length > shown.length && h('button', {
      className: 'linkish showall', type: 'button', onClick: () => setAll(true),
    }, '+' + (lanes.length - shown.length) + ' more lane(s)'));
}

/** Tree — and, at last, the dirty paths the server has always sent and the page never showed. */
function TreeStrip({ git, open, onToggle }) {
  const paths = git.dirtyPaths || [];
  return h(Panel, { title: 'Tree', sub: git.branch },
    h('div', { className: 'striphead' },
      h('span', { className: 'stripone', title: git.head + ' ' + git.subject },
        h('b', null, git.head), ' ' + git.subject)),
    h('div', { className: 'acct-meta', style: { marginTop: '0.35rem' } },
      h('span', null, 'branch ' + git.branch),
      h('span', { style: git.dirty ? { color: 'var(--warn-text)', fontWeight: 700 } : null },
        git.dirty ? git.dirty + ' dirty' : 'clean'),
      paths.length > 0 && h('button', { className: 'linkish', type: 'button', onClick: onToggle },
        h('span', { className: 'chev' + (open ? ' open' : '') }, '▸'), open ? ' hide files' : ' which files')),
    h('div', { className: 'disclose' + (open ? ' open' : '') }, h('div', null,
      h('ul', { className: 'feed', style: { marginTop: '0.5rem' } },
        paths.map((p, i) => h('li', { key: p + '#' + i }, h('span', { className: 'hint', title: p }, p)))),
      // The server sends the first eight. Saying so beats a list that silently stops.
      git.dirty > paths.length && h('div', { className: 'where-src' },
        (git.dirty - paths.length) + ' further dirty path(s) — the state feed carries the first ' + paths.length))));
}

/**
 * Red-first leaves the tree deliberately broken to prove a test fails before it passes. A
 * run that ENDS with residue left a break behind, which is the only thing worth a column;
 * an empty list is clean and a missing field is unknown, never clean.
 */
const redFirstCell = (r) => {
  if (r == null) return '—';
  const n = Array.isArray(r) ? r.length : Number(r) || 0;
  if (!n) return h('span', { className: 'pill clean' }, 'clean');
  return h('span', { className: 'pill bad' }, n);
};
const redFirstTitle = (r) =>
  Array.isArray(r) && r.length
    ? r.map((x) => (typeof x === 'string' ? x : [x.file, x.marker].filter(Boolean).join(' '))).join('\n')
    : r == null
      ? 'no red-first residue was recorded for this run — unknown, not clean'
      : '';

/**
 * ZONE 6 — the record.
 *
 * Three density changes, no columns lost and no rows dropped: twelve of the server's forty
 * by default with the rest one click away; the note clamped to one line with the full text
 * and the red-first file list behind a per-row expand; and a sticky `thead` inside a bounded
 * scroller, because column heads that scroll away turn a wide table into a guessing game.
 * A real virtualizer at n=40 would be a lie about the cost.
 */
function Ticks({ ticks }) {
  const [limit, setLimit] = useState(12);
  const [open, setOpen] = useState(null);
  const shown = ticks.slice(0, limit);
  const cols = ['#', 'exit', 'acct', 'dur', 'closed', '$', 'spec', 'tracker', 'red', 'note'];
  return h(Panel, {
      title: 'Tick history',
      sub: shown.length + ' of ' + ticks.length + ' most recent',
    },
    h('div', { className: 'tablewrap tickscroll' },
      h('table', null,
        h('thead', null, h('tr', null, cols.map((c) => h('th', { key: c }, c)))),
        h('tbody', null, shown.map((t, i) => {
          const bad = BAD.includes(t.exit), warn = WARN.includes(t.exit);
          const key = 'tick-' + t.tick + '-' + (t.attempt || '') + '#' + i;
          const files = Array.isArray(t.redFirst) ? t.redFirst : [];
          const isOpen = open === key;
          const row = h('tr', { key, className: bad ? 'bad' : warn ? 'warnrow' : '' },
            h('td', null, t.tick, t.attempt ? h('span', { className: 'tag', style: { marginLeft: 4 } }, 'retry') : null),
            h('td', null, h('span', { className: 'pill ' + (bad ? 'bad' : warn ? 'warn' : 'clean') }, t.exit)),
            h('td', null, t.account || '—'),
            h('td', null, fmtMin(t.minutes)),
            h('td', null, t.closed || '—'),
            h('td', null, t.cost == null ? h('span', { title: 'no result envelope — unknown, not zero' }, '?') : '$' + t.cost.toFixed(2)),
            h('td', null, t.spec || '—'),
            h('td', null, t.tracker || '—'),
            // Red-first residue: files this run left carrying a deliberate break. A count,
            // because the file list is long and the point is whether the tree was restored.
            h('td', { title: redFirstTitle(t.redFirst) }, redFirstCell(t.redFirst)),
            h('td', { className: 'note', title: t.note || '' },
              h('button', {
                className: 'notebtn', type: 'button',
                onClick: () => setOpen(isOpen ? null : key),
                'aria-expanded': isOpen ? 'true' : 'false',
              },
                h('span', { className: 'chev' + (isOpen ? ' open' : '') }, '▸'),
                h('span', { className: 'nt' }, (t.note || '').slice(0, 150) || 'no note'))));
          if (!isOpen) return row;
          return h(React.Fragment, { key: key + '-w' }, row,
            h('tr', { className: 'detail' }, h('td', { colSpan: cols.length },
              h('div', null, h('b', null, 'note '), t.note || 'none recorded'),
              t.head && h('div', null, h('b', null, 'head '), t.head),
              t.startedAt && h('div', null, h('b', null, 'started '), t.startedAt),
              h('div', null, h('b', null, 'red-first '),
                t.redFirst == null
                  ? 'not recorded — unknown, not clean'
                  : files.length === 0
                    ? 'clean — the tree was restored'
                    : files.map((x) => (typeof x === 'string' ? x : [x.file, x.marker].filter(Boolean).join(' '))).join(' · ')))));
        })))),
    ticks.length > shown.length && h('button', {
      className: 'linkish showall', type: 'button', onClick: () => setLimit(ticks.length),
    }, 'show all ' + ticks.length + ' ticks'));
}

/* ══════════════════════════════════════════════════════════════════
   THE DECK — instruments, zones and overlays.

   Everything below renders from state the server already sends, from a frame
   ring this file keeps, or from two sibling modules loaded at boot:

     ./instruments.mjs   the derivations — cadence, annunciators, burn, anomalies,
                         wireRows, ledgerSeries, digestDiff, sparkPath, provenance
     ./journal.mjs       the durable transition log — open(), record(), range(),
                         seed(), since()

   THE MISSING-MODULE RULE, which is the whole honesty spine in one sentence:
   a FACT the page cannot source renders UNKNOWN — '—' over a hatch band with a
   title naming the field that is absent — and never falls back to a guess. Only
   three things carry a local fallback, and each has a stated reason:

     · sparkPathOf   drawing, not fact. The module owns the numbers; the page
                     owns the ink, and a polyline cannot be wrong about the world.
     · cadenceOf     the reduction of a ring buffer that lives in THIS file. C1
                     is the antidote to the always-on chip and the frozen feed;
                     losing proof-of-life to a module that has not shipped would
                     reintroduce the exact failure the deck exists to end.
     · annunciators  eight direct field reads with no derivation between the
                     state and the lamp. This is the primary glance surface; a
                     dark bar is worse than a duplicated `if`.

   Everything else — rulings, ledger small multiples, anomaly ranking, the
   digest, the watch rail — says so out loud when its source is not there.
   ══════════════════════════════════════════════════════════════════ */

/** Any module call, made safe. A module that throws must degrade to UNKNOWN, never to a blank page. */
const callMod = (mod, name, args, fallback) => {
  try {
    if (mod && typeof mod[name] === 'function') return mod[name].apply(mod, args);
  } catch (e) { /* a broken instrument reads unknown, exactly like an absent one */ }
  return fallback === undefined ? null : fallback;
};

/**
 * The two sibling modules, loaded once at boot.
 *
 * A dynamic import rather than a <script type="module">: the React tree is a plain
 * script with no build step, and a static module graph would mean the page cannot
 * render at all until both files parse. Here a missing module costs the instruments
 * that depend on it and nothing else — and the bar and the bus both say which one.
 */
function useModules() {
  const [mods, setMods] = useState({ inst: null, jnl: null, errors: [], settled: false });
  useEffect(() => {
    let alive = true;
    const errs = [];
    const grab = (spec) => import(spec).then((m) => m).catch((e) => { errs.push(spec + ': ' + (e && e.message ? e.message : 'did not load')); return null; });
    Promise.all([grab('./instruments.mjs'), grab('./journal.mjs')]).then(([inst, jnl]) => {
      if (alive) setMods({ inst, jnl, errors: errs, settled: true });
    });
    return () => { alive = false; };
  }, []);
  return mods;
}

/* ── R1 + R2 + R3 — the Fact primitive ─────────────────────────────
   Every number, word and timestamp on this deck goes through here. It is the
   only thing on the page allowed to render a metric, and it cannot render one
   without also rendering how it is known and how old it is.

   `value` null → '—' over a hatch, with `field` named in the title. Never '0'.
   `at` + `budget` over → the value keeps its face AND wears the hatch, plus
   'as of Xm ago', because a stale figure that hides is a figure assumed current.
   ------------------------------------------------------------------ */
function Fact({ value, prov, field, source, at, budget, title, className, glyph }) {
  const cls = factClass(value, prov);
  const f = freshness(at, budget);
  const known = cls !== 'unknown';
  const bits = [];
  if (source) bits.push('source: ' + source);
  if (field) bits.push(known ? 'field: ' + field : 'missing field: ' + field);
  bits.push('provenance: ' + cls);
  if (f.known) bits.push('stamped ' + spanShort(f.ageMs) + ' ago' + (budget ? ' · budget ' + spanShort(budget) : ''));
  else if (budget) bits.push('no timestamp — freshness unknown');
  return h('span', {
    className: 'fact ' + PROV_CLASS[cls] + (f.stale ? ' stale' : '') + (className ? ' ' + className : ''),
    title: (title ? title + ' — ' : '') + bits.join(' · '),
  },
    known ? value : (glyph || '—'),
    f.stale && h('span', { className: 'asof' }, f.label));
}

/** A hand-rolled sparkline. No chart library exists offline and none is wanted. */
function Spark({ values, inst, label }) {
  const w = 100, hh = 16;
  const d = callMod(inst, 'sparkPath', [values, w, hh], undefined);
  const path = d === undefined || d === null ? sparkPathOf(values, w, hh) : d;
  if (!path) {
    return h('span', {
      className: 'spark unknown', role: 'img',
      title: (label || 'series') + ' — fewer than two samples on record, so there is no shape to draw',
      style: { display: 'block', height: hh + 'px' },
    });
  }
  return h('svg', { className: 'spark', viewBox: '0 0 ' + w + ' ' + hh, preserveAspectRatio: 'none', role: 'img', 'aria-label': label || 'trend' },
    h('path', { d: path }));
}

/* ── C1 — THE CADENCE STRIP ────────────────────────────────────────
   Sixty bars, one per 4-second frame: the last four minutes of Δ tool calls.
   It is drawn from what the page WATCHED, so an empty ring is empty, never zero.
   ------------------------------------------------------------------ */
function Cadence({ samples, inst, working }) {
  const now = Date.now();
  const c = callMod(inst, 'cadence', [samples, now], undefined);
  const cad = c && typeof c === 'object' && 'verdict' in c ? c : cadenceOf(samples, now);
  const stalled = working && cad.known && cad.lastMovementMs != null && cad.lastMovementMs > 120000;
  const bars = cad.bars || [];
  const peak = bars.reduce((m, b) => Math.max(m, b.d || 0), 0) || 1;
  const pad = Math.max(0, 60 - bars.length);
  return h('div', null,
    h('div', {
      className: 'cadence' + (stalled ? ' stalled' : '') + (cad.known ? '' : ' unknown'),
      role: 'img',
      'aria-label': cad.known
        ? 'tool calls per frame over the last ' + spanShort(cad.spanMs)
        : 'not enough frames watched yet to show cadence',
      title: cad.known
        ? 'Δ state.live.tools per 4s frame, over ' + bars.length + ' watched frames'
        : 'the page has watched fewer than two frames — cadence is unknown, not zero',
    },
      Array.from({ length: pad }, (unused, i) => h('i', { key: 'p' + i, className: 'gap', style: { transform: 'scaleY(0.06)' }, title: 'before this page was open' })),
      bars.map((b, i) => h('i', {
        key: 'b' + i,
        className: b.gap ? 'gap' : b.d > 0 ? 'moved' : '',
        style: { transform: 'scaleY(' + (b.gap ? 1 : Math.max(0.06, (b.d || 0) / peak)).toFixed(3) + ')' },
        title: b.gap ? 'a frame gap — the page was not watching' : b.d + ' tool call(s) in this frame',
      }))),
    h('div', { className: 'cadence-read' + (stalled ? ' stalled' : '') },
      !cad.known
        ? h(Fact, { value: null, field: 'state.live.tools over 2+ frames', source: 'the SSE state frames this page has watched', title: 'cadence' })
        : stalled
          // The literal number, because "stalled" alone is an adjective and the founder
          // has been lied to by adjectives. This says what did not move, and for how long.
          ? h('span', null, cad.tools + ' tools, unchanged for ' + spanShort(cad.lastMovementMs))
          : h('span', null,
              cad.perMin == null
                ? h(Fact, { value: null, field: 'a span ≥ 20s of watched frames', source: 'frame ring', title: 'tools per minute' })
                : Math.round(cad.perMin) + ' tools/min',
              ' · last movement ', spanShort(cad.lastMovementMs), ' ago')));
}

/* ── Z0 — THE ANNUNCIATOR BAR ──────────────────────────────────────
   Eight slots, fixed order, position is meaning. Every slot carries a SIGNATURE
   of what is wrong; the ack is keyed to that signature, so acknowledging a known
   failure silences that failure and nothing else — a NEW failure of the same slot
   re-alarms, which is the difference between an annunciator and a dismiss button.
   ------------------------------------------------------------------ */
const ANN_ORDER = ['LOOP', 'FEED', 'SUPV', 'STOP', 'RATE', 'OWED', 'PARK', 'GATE'];

/** Direct field reads — see THE MISSING-MODULE RULE above for why these have a local path. */
const annunciatorsOf = (s, ctx) => {
  const acc = s.accounts || [];
  const maxU = acc.reduce((m, a) => (typeof a.utilization === 'number' ? Math.max(m, a.utilization) : m), -1);
  const anyCold = acc.some((a) => a.cold);
  const gates = (s.catalog && s.catalog.entries || []).filter((e) => e.closingGateWarning);
  const feedAge = ctx.lastFrameAt == null ? null : Date.now() - ctx.lastFrameAt;
  const stalled = ctx.cadenceVerdict === 'stalled' && s.activity && s.activity.state === 'WORKING';
  const supBad = Boolean(s.health && s.health.supervisor && !s.health.supervisor.reporting);
  const armed = s.stopArmed || s.killArmed;
  const armedBy = (s.killFlag && s.killFlag.armedBy) || (s.stopFlag && s.stopFlag.armedBy) || null;
  const tone = (s.activity && s.activity.tone) || 'off';
  return [
    { id: 'LOOP',
      level: stalled ? 'caution' : tone === 'on' ? 'nominal' : tone === 'warn' ? 'caution' : 'caution',
      label: (s.activity && s.activity.state) || 'UNKNOWN',
      sig: (s.activity && s.activity.state || '?') + (stalled ? '/stalled' : ''),
      title: stalled ? 'the loop reports WORKING but no tool call has landed in over two minutes' : (s.activity && s.activity.reason) || 'a lane is in flight' },
    { id: 'FEED',
      level: ctx.link === 'live' && (feedAge == null || feedAge < BUDGET.state) ? 'nominal' : ctx.link === 'live' ? 'caution' : 'alarm',
      label: 'FEED', sig: ctx.link + '/' + (feedAge != null && feedAge >= BUDGET.state ? 'stale' : 'fresh'),
      title: 'EventSource ' + ctx.link + (feedAge == null ? ' · no frame yet' : ' · last frame ' + spanShort(feedAge) + ' ago, budget ' + spanShort(BUDGET.state)) },
    // The word, not the abbreviation, when it is true: an unwatched loop and a watched one
    // look identical on a page that only ever shows the loop, and this slot is the difference.
    { id: 'SUPV', level: supBad ? 'alarm' : 'nominal', label: supBad ? 'unsupervised' : 'SUPV', sig: supBad ? 'silent' : 'ok',
      title: supBad ? ((s.health.supervisor.advice) || 'the supervisor is not reporting') : 'the supervisor reported within its own staleAfterMs' },
    { id: 'STOP', level: armed ? 'caution' : 'nominal', label: armed ? (s.killArmed ? 'KILL' : 'STOP') : 'STOP',
      sig: armed ? (s.killArmed ? 'kill' : 'stop') + '/' + (armedBy || '?') : 'clear',
      title: armed ? (s.killArmed ? 'kill' : 'stop') + ' armed by ' + (armedBy || 'an unknown author') : 'no stop or kill flag is armed' },
    { id: 'RATE', level: anyCold ? 'alarm' : maxU >= 0.85 ? 'caution' : 'nominal', label: 'RATE',
      sig: anyCold ? 'cold:' + acc.filter((a) => a.cold).map((a) => a.id).join(',') : maxU >= 0.85 ? 'hot' : 'ok',
      title: anyCold ? acc.filter((a) => a.cold).map((a) => a.id + ' cold ' + a.coldMinutes + 'm').join(' · ')
        : maxU < 0 ? 'no account is over the ~90% reporting threshold' : Math.round(maxU * 100) + '% used on the busiest account' },
    { id: 'OWED', level: ctx.owedCount > 0 ? 'caution' : 'nominal', label: 'OWED ' + (ctx.owedCount || 0),
      sig: 'owed:' + (ctx.owedCount || 0), title: ctx.owedCount ? ctx.owedCount + ' thing(s) only you can clear' : 'nothing is waiting on a founder' },
    { id: 'PARK', level: (s.parked || []).length > 0 ? 'alarm' : 'nominal', label: 'PARK ' + (s.parked || []).length,
      sig: 'park:' + (s.parked || []).length, title: (s.parked || [])[0] || 'nothing parked' },
    { id: 'GATE', level: gates.length > 0 ? 'caution' : 'nominal', label: 'GATE ' + gates.length,
      sig: 'gate:' + gates.map((e) => e.id).join(','),
      title: gates.length ? 'retired without a closing-gate record: ' + gates.map((e) => e.id).join(', ') : 'every retired spec carries a closing-gate record' },
  ];
};

/** The eight slots as the bar will draw them — module first, direct field reads as the floor. */
const annSlots = (s, ctx, inst) => {
  const fromMod = callMod(inst, 'annunciators', [s, ctx], undefined);
  return Array.isArray(fromMod) && fromMod.length ? fromMod : annunciatorsOf(s, ctx);
};

function Annunciators({ s, ctx, inst, acks, onAck, onSlot }) {
  const slots = annSlots(s, ctx, inst);
  const byId = new Map(slots.map((x) => [x.id, x]));
  const now = Date.now();
  // When each slot's CURRENT signature first went live, so escalation counts from the
  // moment the failure appeared rather than from the moment the page happened to open.
  const firstSeen = useRef(new Map());
  for (const sl of slots) {
    const key = sl.id + '|' + sl.sig;
    const live = sl.level === 'caution' || sl.level === 'alarm';
    if (live && !firstSeen.current.has(key)) firstSeen.current.set(key, now);
    if (!live) firstSeen.current.delete(key);
  }
  return h('div', { className: 'annslots', role: 'group', 'aria-label': 'Annunciator panel' },
    ANN_ORDER.map((id) => {
      const a = byId.get(id) || { id, level: 'nominal', label: id, sig: 'unknown', title: 'this slot reported nothing' };
      const live = a.level === 'caution' || a.level === 'alarm';
      const ack = acks[id];
      const acked = Boolean(ack && ack.sig === a.sig);
      const since = firstSeen.current.get(a.id + '|' + a.sig) || null;
      const escalated = live && !acked && since != null && now - since > 300000;
      return h('button', {
        key: id, type: 'button',
        className: 'ann ' + a.level + (live && !acked ? ' blink' : '') + (escalated ? ' escalated' : ''),
        title: a.title + (acked ? ' · acknowledged' : ''),
        onClick: () => { onAck(id, a.sig); if (onSlot) onSlot(id); },
      },
        h('i', { className: 'lamp' }),
        a.label || id,
        acked && live && h('span', { className: 'acked' }, 'ack ' + new Date(ack.at).toTimeString().slice(0, 5)));
    }));
}

/* ── Z1 — THE PFD ──────────────────────────────────────────────────
   Four cells at four fixed positions: is it working, on what, at what cost, how
   much runway. Read together, from across the room, without a scroll.
   ------------------------------------------------------------------ */
function PfdState({ s, top, samples, inst }) {
  return h('div', { className: 'pfd-cell' },
    h('div', { className: 'mq-head' },
      h('i', {
        className: 'marquee-dot ' + (top.tone === 'on' ? 'on' : top.tone === 'warn' ? 'warn' : 'off'),
        title: top.reason || 'a lane is in flight',
      }),
      h(StateWord, { state: top.state })),
    // Never truncated, never conditional. This is the "always say why when idle" clause.
    h('div', { className: 'pfd-reason' }, top.reason || 'a lane is in flight — the loop is doing the work'),
    h(Cadence, { samples, inst, working: top.state === 'WORKING' }));
}

function PfdLane({ s, samples, inst }) {
  const lanes = (s.lanes && s.lanes.length) ? s.lanes : (s.live ? [s.live] : []);
  const lane = lanes[0] || null;
  const entry = lane ? (s.catalog.entries || []).find((e) => e.id === lane.spec) : null;
  const lp = entry && entry.progress;
  const series = (key) => samples.map((x) => x[key]).filter((n) => typeof n === 'number');
  if (!lane) {
    return h('div', { className: 'pfd-cell' },
      h('div', { className: 'pfd-label' }, 'on what'),
      h('div', { className: 'where-head', style: { fontSize: '1.1rem' } }, 'nothing in flight'),
      h('div', { className: 'burnexcl' },
        s.catalog.pending + ' pending · ' + s.catalog.parked.length + ' parked · ' + s.catalog.awaitingFounder.length + ' awaiting you'));
  }
  const verifyPct = lane.tools ? Math.round(((lane.verification || 0) / lane.tools) * 100) : null;
  return h('div', { className: 'pfd-cell' },
    h('div', { className: 'pfd-label' }, 'on what' + (lanes.length > 1 ? ' · ' + lanes.length + ' lanes' : '')),
    h('div', { className: 'mq-lane-top' },
      h('span', { className: 'mq-lane-name' }, 'Spec ' + lane.spec + ' · ' + lane.stage),
      h(Elapsed, { since: lane.startedAt })),
    h('div', { className: 'acct-meta', style: { marginTop: '0.1rem' } },
      h('span', { className: 'tag' }, lane.account || 'account not reported')),
    h('div', { className: 'sparkrow' },
      h('div', { className: 'sparkcell' },
        h('span', { className: 'n' }, h(Fact, { value: lane.tools == null ? null : String(lane.tools), field: 'state.live.tools', source: '/api/state', prov: 'reported' })),
        h('span', { className: 'l' }, 'tool calls'),
        h(Spark, { values: series('tools'), inst, label: 'tool calls per watched frame' })),
      h('div', { className: 'sparkcell' },
        h('span', { className: 'n' },
          h(Fact, { value: lane.verification == null ? null : String(lane.verification), field: 'state.live.verification', source: '/api/state', prov: 'reported' }),
          verifyPct != null && h('sub', { title: 'share of this lane\'s tool calls that were verification commands' }, ' ' + verifyPct + '%')),
        h('span', { className: 'l' }, 'verify cmds'),
        h(Spark, { values: series('verification'), inst, label: 'verification commands per watched frame' })),
      h('div', { className: 'sparkcell' },
        h('span', { className: 'n' }, h(Fact, { value: lane.subagents == null ? null : String(lane.subagents), field: 'state.live.subagents', source: '/api/state', prov: 'reported' })),
        h('span', { className: 'l' }, 'subagents'),
        h(Spark, { values: series('subagents'), inst, label: 'subagents per watched frame' }))),
    h('div', { className: 'burnexcl' },
      lp
        ? lp.done + '/' + lp.total + ' done · ' + lp.open + ' open' + (lp.held ? ' · ' + lp.held + ' held' : '') +
          (lp.unmarked ? ' · ' + lp.unmarked + ' UNMARKED' : '')
        : 'no tasks.md for this spec yet — the lane is still writing spec, plan and tasks'),
    lanes.length > 1 && h('div', { className: 'burnexcl' },
      '+' + (lanes.length - 1) + ' more lane(s) — all of them under MACHINE'));
}

function PfdBurn({ s, inst }) {
  const t = s.totals;
  const rows = s.ticks || [];
  const b = callMod(inst, 'burn', [s], undefined);
  const cost = overRows(rows, (r) => r.cost);
  const mins = overRows(rows, (r) => r.minutes);
  const hours = mins.sum / 60;
  const perHour = b && b.perHour != null ? b.perHour : (hours > 0.05 ? cost.sum / hours : null);
  const perTick = b && b.perTick != null ? b.perTick : (t.ticks ? t.notional / t.ticks : null);
  const perTask = b && b.perTask != null ? b.perTask : (t.closed ? t.notional / t.closed : null);
  const fig = (v, digits, prefix) => (v == null ? null : (prefix || '') + v.toFixed(digits == null ? 2 : digits));
  return h('div', { className: 'pfd-cell' },
    h('div', { className: 'pfd-label' }, 'burn'),
    h('div', { className: 'burnrow' },
      h('div', { className: 'burncell' },
        h('span', { className: 'n' }, h(Counter, { value: t.notional, prefix: '$', digits: 2 })),
        h('span', { className: 'l' }, 'notional')),
      h('div', { className: 'burncell' },
        h('span', { className: 'n' }, h(Fact, {
          value: fig(perHour, 2, '$'), field: 'Σ state.ticks[].minutes', source: 'the run ledger', prov: 'reconstructed',
          title: 'notional per hour of worker time',
        })),
        h('span', { className: 'l' }, '$/hour')),
      h('div', { className: 'burncell' },
        h('span', { className: 'n' }, h(Fact, {
          value: fig(perTick, 2, '$'), field: 'state.totals.ticks', source: 'the run ledger', prov: 'reconstructed',
          title: 'notional ÷ ticks',
        })),
        h('span', { className: 'l' }, '$/tick')),
      h('div', { className: 'burncell' },
        h('span', { className: 'n' }, h(Fact, {
          value: fig(perTask, 2, '$'), field: 'state.totals.closed', source: 'the run ledger', prov: 'reconstructed',
          title: 'notional ÷ tasks closed — unknown while nothing has closed, never $0',
        })),
        h('span', { className: 'l' }, '$/task closed'))),
    // Every figure the folded Run-totals panel carried, kept whole: the rebuild moved
    // panels and has never removed a field.
    h('div', { className: 'burnexcl' },
      t.ticks + ' ticks · ' + t.closed + ' tasks closed · ' + fmtMin(t.minutes) + ' of worker time · ' + t.rows + ' ledger rows'),
    h('div', { className: 'burnexcl' },
      (b && b.exclusion) || exclusionLine(cost.n, cost.total, 'a cost'),
      ' · ', exclusionLine(mins.n, mins.total, 'a duration')),
    h('div', { className: 'burnexcl' },
      t.billable === 0
        ? 'No tick used overage. Notional is list-price token value, not money.'
        : t.billable + ' tick(s) ran as OVERAGE and may be billable.'));
}

/**
 * CELL D — RUNWAY. Three account TIMELINES.
 *
 * A percentage answers "how much is gone"; the founder's question is "how long
 * have I got", and only a window with a now-marker on it answers that. The account
 * with the least headroom is drawn at 1.4× because it is the one that ends the night.
 */
function PfdRunway({ s, inst }) {
  const now = Date.now();
  const accts = s.accounts || [];
  const headroom = (a) => (a.cold ? -1 : typeof a.utilization === 'number' ? 1 - a.utilization : 0.5);
  const worst = accts.slice().sort((x, y) => headroom(x) - headroom(y))[0] || null;
  return h('div', { className: 'pfd-cell' },
    h('div', { className: 'pfd-label' }, 'runway'),
    h('div', { className: 'runway' }, accts.map((a) => {
      const u = a.utilization;
      const cls = u == null ? '' : u >= 0.9 ? 'crit' : u >= 0.7 ? 'warn' : '';
      const rw = callMod(inst, 'accountRunway', [a, now], undefined);
      const start = (rw && rw.startedAt) || a.windowStartedAt || null;
      const end = a.windowEndsAt || null;
      const nowPct = start && end && end > start ? Math.min(1, Math.max(0, (now - start) / (end - start))) : null;
      const lead = worst && a.id === worst.id && accts.length > 1;
      return h('div', { key: a.id, className: 'rwy' + (lead ? ' lead' : '') + (a.cold ? ' cold' : '') },
        h('div', { className: 'rwy-top' },
          h('span', { className: 'rwy-name' }, a.id),
          h('span', { className: 'rwy-meta' },
            a.cold
              ? 'cold ' + a.coldMinutes + 'm' + (a.refusedReason ? ' — ' + String(a.refusedReason).slice(0, 60) : '')
              : h(React.Fragment, null,
                  h(Fact, { value: u == null ? null : Math.round(u * 100) + '%', field: 'accounts[].utilization', source: 'the last run row for this account', prov: 'reported',
                    title: u == null ? 'the provider reports a utilization only past about 90%' : 'window used' }),
                  ' · ',
                  end ? 'window ends ' + clock(end) : h(Fact, { value: null, field: 'accounts[].windowEndsAt', source: 'the account pool', title: 'window end' })))),
        h('div', {
          className: 'rwy-track' + (nowPct == null ? ' unknown' : ''),
          title: nowPct == null
            ? 'no window start on record for ' + a.id + ' — the track cannot be placed in time, so it is hatched rather than drawn at zero'
            : a.id + ' window: ' + clock(start) + ' → ' + clock(end),
        },
          h('i', { className: 'fill ' + cls, style: { transform: 'scaleX(' + (u == null ? 0 : Math.max(0.02, u)).toFixed(3) + ')' } }),
          nowPct != null && h('i', { className: 'now', style: { left: (nowPct * 100).toFixed(1) + '%' } })),
        u == null && !a.cold && h('div', { className: 'burnexcl' }, 'utilization not reported'));
    })),
    accts.length === 0 && h('div', { className: 'burnexcl' }, 'no accounts in the pool — state.accounts is empty'));
}

/* ── Z2 — ALARMS ───────────────────────────────────────────────────
   Never an empty card, never an all-clear. Number, comparison, reason.
   ------------------------------------------------------------------ */
function Alarms({ s, inst, onWire }) {
  const list = callMod(inst, 'anomalies', [s], null);
  if (!Array.isArray(list) || list.length === 0) return h('div', { className: 'alarmzone' });
  const top = list.slice(0, 3);
  return h('div', { className: 'alarmzone live', role: 'alert' },
    top.map((a, i) => h('div', { key: a.id || i, className: 'alarmcard' + (a.level === 'warn' ? ' warn' : '') },
      a.headline || a.text || String(a))),
    list.length > top.length && h('button', {
      className: 'linkish alarmmore', type: 'button', onClick: onWire,
    }, '+' + (list.length - top.length) + ' more → open the wire'));
}

/* ── Z3 LEFT — ACT ─────────────────────────────────────────────────
   What the founder DOES, ranked by what clearing it unblocks. The top item is
   double weight because "which one first" is the question, and six equal tiles
   have never once answered it.
   ------------------------------------------------------------------ */
function ActColumn({ s, owedItems, inst, onOpen }) {
  const fromMod = callMod(inst, 'rankOwed', [owedItems], undefined);
  const ranked = Array.isArray(fromMod) && fromMod.length === (owedItems || []).length ? fromMod : rankOwed(owedItems);
  const parked = s.parked || [];
  return h('div', { className: 'deckcol act' },
    h('div', { className: 'colhead' }, h('span', null, 'act'), h('span', null, ranked.length + ' owed · ' + parked.length + ' parked')),
    h('div', { className: 'pane' },
      h('div', { className: 'panehead' }, h('span', null, 'Owed by you'),
        h('span', { className: 'sub' }, ranked.length ? 'ranked by what it unblocks' : 'nothing waiting')),
      ranked.length === 0
        ? h('p', { className: 'mono', style: { margin: 0, fontSize: '0.74rem', color: 'var(--text-dim)' } },
            'No spec is awaiting a founder journey and no journey is half-walked. When one lands it appears here in red.')
        : h('ul', { className: 'owedstack' }, ranked.map((item, i) => h('li', { key: item.key, className: i === 0 ? 'lead' : '' },
            h('button', { className: 'owedrow', type: 'button', onClick: () => onOpen({ kind: item.kind, id: item.id }) },
              h('span', { className: 'owedtitle', title: item.title || ('Spec ' + item.id) },
                item.kind === 'spec'
                  ? h(React.Fragment, null, h('b', null, 'Spec ' + item.id), ' — clicked founder journey')
                  : item.title),
              i === 0 && h('div', { className: 'owedwhy' }, unblockWhy(item)),
              h('div', { className: 'owedmeta' },
                item.signedOff && h('span', { className: 'ready' }, 'SIGNED OFF'),
                item.progress
                  ? h('span', null, item.progress.done + ' of ' + item.progress.total + ' checks')
                  : h('span', null, 'open to see what it needs'),
                item.progress && item.progress.complete && !item.signedOff && h('span', { className: 'ready' }, 'ready to sign off'),
                item.recordedOn && h('span', null, item.recordedOn)),
              item.affectsSpec && h('div', { className: 'owedmeta' },
                h('span', { className: 'owedaffects', title: 'affects ' + item.affectsSpec }, 'affects ' + item.affectsSpec)),
              item.progress && item.progress.total > 0 && h('div', { className: 'minibar' },
                h('i', {
                  className: item.progress.complete ? 'full' : '',
                  style: { transform: 'scaleX(' + (item.progress.done / item.progress.total) + ')' },
                }))))))),
    h('div', { className: 'pane' },
      h('div', { className: 'panehead' }, h('span', null, 'Parked'),
        h('span', { className: 'sub' }, parked.length ? 'only you can clear these' : 'nothing parked')),
      parked.length === 0
        ? h('p', { className: 'mono', style: { margin: 0, fontSize: '0.74rem', color: 'var(--text-dim)' } },
            'Nothing in PARKED.md and no queue entry parked without a diagnosis.')
        // Promoted out of the collapsed rail: a park is the single most common reason the
        // loop is waiting on a human, and it spent this whole build behind a chevron.
        : h('ul', { className: 'owed', style: { margin: 0, padding: 0 } }, parked.map((p, i) =>
            h('li', { key: String(p) + '#' + i, style: { fontSize: '0.8rem' } }, parkedLabel(p))))));
}

/* ── Z3 CENTRE — MACHINE ───────────────────────────────────────────
   The worker's own words, then its hands, then the whole build as a ladder.
   ------------------------------------------------------------------ */
function MachineColumn({ s, inst, onSpec }) {
  const lanes = (s.lanes && s.lanes.length) ? s.lanes : (s.live ? [s.live] : []);
  const lane = lanes[0] || null;
  const actions = ((lane && lane.actions) || []).slice(-8).reverse();
  const entries = (s.catalog.entries || []).slice().sort((a, b) => String(a.id).localeCompare(String(b.id)));
  return h('div', { className: 'deckcol machine' },
    h('div', { className: 'colhead' }, h('span', null, 'machine'),
      h('span', null, lanes.length ? lanes.length + ' lane' + (lanes.length > 1 ? 's' : '') : 'no lane')),
    h('div', { className: 'pane' },
      h('div', { className: 'panehead' }, h('span', null, 'Tool river'), h('span', { className: 'sub' }, actions.length + ' newest first')),
      lane && lane.say
        ? h('div', { className: 'standfirst' }, '“' + lane.say + '”',
            h('span', { className: 'attr' }, '— the worker' + (lane.sayAt ? ', ' + ago(lane.sayAt) : '')))
        : h('p', { className: 'mono', style: { margin: 0, fontSize: '0.74rem', color: 'var(--text-dim)' } },
            lane ? 'the worker has not said anything this tick yet' : 'no lane in flight — nothing is being said'),
      actions.length > 0
        ? h('ul', { className: 'river' }, actions.map((a, i) =>
            h('li', { key: (lane.id || 'l') + '|' + a.tool + '|' + a.hint + '#' + i },
              h('span', { className: 'tool' }, a.tool),
              h('span', { className: 'hint', title: a.hint }, a.hint))))
        : h('p', { className: 'mono', style: { marginTop: '0.5rem', fontSize: '0.72rem', color: 'var(--text-dim)' } },
            lane ? 'no tool call has been pushed for this lane yet' : '')),
    h('div', { className: 'pane' },
      h('div', { className: 'panehead' }, h('span', null, 'Spec ladder'),
        h('span', { className: 'sub' }, s.catalog.signedOff + ' of ' + s.catalog.total + ' signed off')),
      h('div', { className: 'ladder' }, entries.map((e) => {
        const p = e.progress;
        const fillFrac = p && p.total ? (p.done + p.held) / p.total : e.status === 'done' ? 1 : 0;
        const cls = e.status === 'done' ? 'done' : e.status === 'awaiting-founder' ? 'awaiting' : e.status === 'parked' ? 'parked' : '';
        return h('button', {
          key: e.id, type: 'button', className: 'rung ' + cls + (e.closingGateWarning ? ' gatewarn' : ''),
          title: 'Spec ' + e.id + (e.slug ? ' · ' + e.slug : '') + ' — ' + e.status +
            (p ? ' · ' + p.done + '/' + p.total + ' done, ' + p.open + ' open' : ' · no tasks.md') +
            (e.closingGateWarning ? ' · RETIRED WITHOUT A CLOSING-GATE RECORD' : ''),
          onClick: () => onSpec(e.id),
        },
          h('i', { className: 'fill', style: { transform: 'scaleY(' + fillFrac.toFixed(3) + ')' } }),
          h('span', { className: 'id' }, e.id));
      })),
      h('div', { className: 'burnexcl', style: { marginTop: '0.35rem' } },
        entries.filter((e) => !e.progress).length + ' of ' + entries.length + ' entries have no tasks.md and are drawn empty, not at zero')),

    // Nothing the previous build showed is gone. The per-lane task bars, the wave name and
    // the UNMARKED count keep their own pane under the ladder; the full Current-tick panel,
    // with its complete action feed and its 'show all n actions', is one disclosure away.
    h('div', { className: 'pane' },
      h('div', { className: 'panehead' }, h('span', null, 'Lane progress'),
        h('span', { className: 'sub' }, (s.actives || []).length + ' active')),
      h(CatalogLanes, { lanes: (s.actives || (s.active ? [s.active] : [])) })),
    h('details', { className: 'morebox pane' },
      h('summary', null, 'open the full current-tick panel'),
      h(Live, { live: s.live, lanes: s.lanes, running: s.running })));
}

/* ── Z3 RIGHT — RECORD: THE WIRE ───────────────────────────────────
   One reverse-chronological river of everything the loop has ruled, spent, or
   broken, each row naming the file it came from. A 900-character ruling is read
   here, in place, or it is read nowhere.
   ------------------------------------------------------------------ */
const WIRE_FILTERS = [['all', 'All'], ['rulings', 'Rulings'], ['money', 'Money'], ['breaks', 'Breaks'], ['mine', 'Mine']];
const WIRE_DESK_GROUP = { RULINGS: 'rulings', LEDGER: 'money', BUREAU: 'money', HEALTH: 'breaks', TREE: 'all', DESK: 'mine' };

function Wire({ s, inst, journal, seenAt, filter, onFilter, openRow, onOpenRow }) {
  const setOpenRow = onOpenRow;
  const rows = callMod(inst, 'wireRows', [s, journal], null);
  if (!Array.isArray(rows)) {
    return h('div', { className: 'pane' },
      h('div', { className: 'panehead' }, h('span', null, 'The wire'), h('span', { className: 'sub' }, 'unavailable')),
      h('p', { className: 'mono', style: { margin: 0, fontSize: '0.74rem', color: 'var(--hot)' } },
        'instruments.wireRows is not available, so this river is EMPTY rather than partial. ' +
        'It is not showing you a subset and calling it the record.'));
  }
  const shown = rows.filter((r) => filter === 'all' || WIRE_DESK_GROUP[r.desk] === filter);
  let dividerDrawn = false;
  return h('div', { className: 'pane' },
    h('div', { className: 'panehead' }, h('span', null, 'The wire'),
      h('span', { className: 'sub' }, shown.length + ' of ' + rows.length + ' rows')),
    h('div', { className: 'wirefilter', role: 'group', 'aria-label': 'Filter the wire' },
      WIRE_FILTERS.map(([id, label]) => h('button', {
        key: id, type: 'button', 'aria-pressed': filter === id ? 'true' : 'false', onClick: () => onFilter(id),
      }, label))),
    shown.length === 0
      ? h('p', { className: 'mono', style: { margin: 0, fontSize: '0.72rem', color: 'var(--text-dim)' } },
          'Nothing of that kind on the wire — ' + rows.length + ' other row(s) are under All.')
      : h('ul', { className: 'wire' }, shown.map((r, i) => {
          const at = typeof r.at === 'number' ? r.at : new Date(r.at).getTime();
          // The NEW SINCE mark sits where the founder last LOOKED, and does not move
          // while the tab is hidden — a divider that chases the newest row is a divider
          // that has never once told anyone what they missed.
          const divide = !dividerDrawn && seenAt != null && at <= seenAt && i > 0;
          if (divide) dividerDrawn = true;
          const key = r.id || (r.desk + '#' + at + '#' + i);
          const isOpen = openRow === key;
          return h(React.Fragment, { key: key + '-w' },
            divide && h('li', { key: key + '-div', style: { border: 0, padding: 0 } },
              h('div', { className: 'wirenew' }, 'new since ' + new Date(seenAt).toTimeString().slice(0, 5))),
            h('li', { className: isOpen ? 'open' : '' },
              h('button', {
                className: 'wirerow' + (r.level === 'bad' ? ' bad' : ''), type: 'button',
                'aria-expanded': r.note ? (isOpen ? 'true' : 'false') : undefined,
                onClick: () => setOpenRow(isOpen ? null : key),
                title: r.headline,
              },
                h('span', { className: 'wt' }, new Date(at).toTimeString().slice(0, 5)),
                h('span', { className: 'wd' }, r.desk),
                h('span', { className: 'wh' }, r.note ? h('span', { className: 'chev' + (isOpen ? ' open' : '') }, '▸ ') : null, r.headline),
                h('span', { className: 'ws' }, r.source || 'source not stated')),
              isOpen && r.note && h('div', { className: 'wirenote' }, r.note)));
        })));
}

/** Six hand-rolled small multiples. Each captioned with its n and its exclusions. */
function LedgerWall({ s, inst }) {
  const series = callMod(inst, 'ledgerSeries', [s], null);
  if (!Array.isArray(series) || series.length === 0) {
    const rows = s.ticks || [];
    const cost = overRows(rows, (r) => r.cost);
    return h('div', { className: 'pane' },
      h('div', { className: 'panehead' }, h('span', null, 'Ledger wall'), h('span', { className: 'sub' }, 'unavailable')),
      h('p', { className: 'mono', style: { margin: 0, fontSize: '0.72rem', color: 'var(--text-dim)' } },
        'instruments.ledgerSeries is not available. The raw ledger below is the whole record this page can prove: ' +
        exclusionLine(cost.n, cost.total, 'a cost') + ', and state.ticks is capped at the last 40 runs by the server.'));
  }
  return h('div', { className: 'pane' },
    h('div', { className: 'panehead' }, h('span', null, 'Ledger wall'), h('span', { className: 'sub' }, series.length + ' series')),
    h('div', { className: 'wall' }, series.slice(0, 6).map((sr) => {
      const path = sr.kind === 'band' ? null : (callMod(inst, 'sparkPath', [sr.values, 100, 40], undefined) ?? sparkPathOf(sr.values, 100, 40));
      const bands = sr.kind === 'band' && Array.isArray(sr.bands) ? sr.bands : null;
      return h('div', { key: sr.key, className: 'wallcell' + (!path && !bands ? ' unknown' : '') },
        h('span', { className: 'cap' }, sr.label),
        h('svg', { viewBox: '0 0 100 40', preserveAspectRatio: 'none', role: 'img', 'aria-label': sr.label },
          bands
            ? bands.map((b, i) => h('rect', {
                key: i, className: 'band', x: (b.x0 * 100).toFixed(2), y: (b.y0 * 40).toFixed(2),
                width: Math.max(0.4, (b.x1 - b.x0) * 100).toFixed(2), height: Math.max(0.4, (b.y1 - b.y0) * 40).toFixed(2),
                fill: 'var(' + (b.token || '--line-soft') + ')',
              }))
            : path && h('path', { d: path })),
        h('span', { className: 'cap' }, sr.caption || exclusionLine(sr.n || 0, sr.total || 0, 'a value')));
    })));
}

function RecordColumn({ s, inst, journal, seenAt, wireFilter, onWireFilter, wireOpen, onWireOpen, children }) {
  return h('div', { className: 'deckcol record', id: 'deck-record' },
    h('div', { className: 'colhead' }, h('span', null, 'record'), h('span', null, (s.ticks || []).length + ' runs on file')),
    h(Wire, { s, inst, journal, seenAt, filter: wireFilter, onFilter: onWireFilter, openRow: wireOpen, onOpenRow: onWireOpen }),
    h(LedgerWall, { s, inst }),
    children);
}

/* ── Z4 — THE WATCH RAIL ───────────────────────────────────────────
   Coverage, made spatial. This is the only thing on the page that can say what
   the room did NOT see, which is exactly the class of failure a snapshot
   renderer can never catch. Static by law: a gap must never shimmer.
   ------------------------------------------------------------------ */
function WatchRail({ range, onMark }) {
  const H = 1000;              // a viewBox unit space; the SVG scales to the rail
  if (!range) {
    return h('aside', { className: 'watchrail z-watch' },
      h('div', { className: 'watchhead' }, 'watch', h('br'), 'rail'),
      h('div', { className: 'watchbody', style: { display: 'flex', alignItems: 'center', padding: '0 0.2rem' } },
        h('div', {
          className: 'mono',
          style: { fontSize: '0.5rem', color: 'var(--text-dim)', lineHeight: 1.3, textAlign: 'center' },
          title: 'journal.mjs is not available, so the page cannot say which spans it watched. It says that, rather than drawing 24 unbroken hours it cannot prove.',
        }, 'no journal — coverage unknown')));
  }
  const marks = range.marks || [];
  const gaps = range.gaps || [];
  const from = range.from, to = range.to;
  const span = Math.max(1, to - from);
  const y = (t) => ((to - t) / span) * H;      // newest at top
  const hours = [];
  const firstHour = Math.ceil(from / 3600000) * 3600000;
  for (let t = firstHour; t <= to; t += 3600000) hours.push(t);
  return h('aside', { className: 'watchrail z-watch' },
    h('div', { className: 'watchhead', title: 'the share of the last 24 hours in which this page was open and recording transitions' },
      'watched', h('br'),
      range.coverage == null ? '—' : Math.round(range.coverage * 100) + '%', h('br'), 'of 24h'),
    h('div', { className: 'watchbody' },
      h('svg', { viewBox: '0 0 40 ' + H, preserveAspectRatio: 'none', role: 'img', 'aria-label': 'coverage of the last 24 hours' },
        gaps.map((g, i) => h('rect', {
          key: 'g' + i, className: 'gap', x: 0, width: 40,
          y: y(Math.min(to, g.to)).toFixed(1),
          height: Math.max(1, y(Math.max(from, g.from)) - y(Math.min(to, g.to))).toFixed(1),
        })),
        hours.map((t) => h(React.Fragment, { key: 'h' + t },
          h('line', { className: 'hourline', x1: 0, x2: 40, y1: y(t).toFixed(1), y2: y(t).toFixed(1) }),
          h('text', { className: 'hourlab', x: 2, y: (y(t) - 2).toFixed(1) }, new Date(t).toTimeString().slice(0, 5)))),
        marks.map((m, i) => {
          const my = y(m.at);
          const tone = m.level === 'bad' ? ' hot' : m.level === 'warn' ? ' warm' : '';
          return m.prov === 'reconstructed'
            ? h('circle', { key: 'm' + i, className: 'rec', cx: 26, cy: my.toFixed(1), r: 3, onClick: () => onMark(m), style: { cursor: 'pointer' } },
                h('title', null, m.label + ' — reconstructed from the ledger'))
            : h('line', { key: 'm' + i, className: 'mk' + tone, x1: 18, x2: 34, y1: my.toFixed(1), y2: my.toFixed(1), onClick: () => onMark(m), style: { cursor: 'pointer' } },
                h('title', null, m.label + ' — observed'));
        }))));
}

/* ── Z5 — THE TICKER ───────────────────────────────────────────────
   One line, always the newest tool call. The reflex answer to "is it actually
   doing something", visible at every scroll position and from any tab.
   ------------------------------------------------------------------ */
function Ticker({ lanes, reason }) {
  const a = newestAction(lanes);
  if (!a) return h('div', { className: 'ticker idle z-ticker' },
    h('span', { className: 'tk' }, 'IDLE'),
    h('span', { className: 'tv' }, reason || 'no lane in flight — no tool call to show'));
  return h('div', { className: 'ticker z-ticker', role: 'status', 'aria-live': 'off' },
    h('span', { className: 'tk' }, a.tool),
    h('span', { className: 'tv', title: a.hint }, a.hint));
}

/* ── Z6 — THE TELEMETRY BUS ────────────────────────────────────────
   One mono line. Every item is a fact with a budget; nothing here is decoration.
   ------------------------------------------------------------------ */
function Bus({ s, link, lastFrameAt, bell, modErrors, offline }) {
  const beat = useRef(null);
  const sig = useRef(lastFrameAt);
  // THE ONE animation on this page allowed to restart on the 4-second push, because
  // that is precisely and only what it means: a push just landed.
  useEffect(() => {
    if (sig.current === lastFrameAt) return undefined;
    sig.current = lastFrameAt;
    const node = beat.current;
    if (!node) return undefined;
    node.classList.remove('push');
    void node.offsetWidth;
    node.classList.add('push');
    const done = () => node.classList.remove('push');
    node.addEventListener('animationend', done, { once: true });
    return () => node.removeEventListener('animationend', done);
  }, [lastFrameAt]);
  const up = s.driver && s.driver.startedAt ? spanShort(Date.now() - new Date(s.driver.startedAt).getTime()) : null;
  return h('div', { className: 'bus z-bus' },
    modErrors.length > 0 && h('span', {
      className: 'busitem grow', style: { color: 'var(--hot)', fontWeight: 700 },
      title: modErrors.join(' · ') + ' — every instrument that depends on it is reading UNKNOWN, not zero',
    }, modErrors.length + ' module(s) did not load'),
    offline && h('span', { className: 'busitem', style: { color: 'var(--hot)', fontWeight: 700 } }, 'OFFLINE'),
    h('span', { className: 'busitem', title: s.git.subject }, 'head ' + s.git.head),
    h('span', { className: 'busitem' }, s.git.branch),
    h('span', { className: 'busitem', title: (s.git.dirtyPaths || []).join('\n') || 'clean' },
      s.git.dirty ? s.git.dirty + ' dirty' : 'clean'),
    h('span', { className: 'busitem' }, 'pid ' + (s.driver ? s.driver.pid : '—')),
    h('span', { className: 'busitem' }, 'up ', h(Fact, { value: up, field: 'driver.startedAt', source: 'the runner registration record', prov: 'reported', title: 'driver uptime' })),
    h('span', { className: 'busitem' }, 'beat ',
      h(Fact, {
        value: s.driver && s.driver.heartbeat ? ago(s.driver.heartbeat) : null,
        at: s.driver && s.driver.heartbeat, budget: BUDGET.heartbeat, prov: 'reported',
        field: 'driver.heartbeat', source: 'runner:main', title: 'runner heartbeat',
      })),
    h('span', { className: 'busitem' }, 'pushed ',
      h(Fact, {
        value: lastFrameAt ? spanShort(Date.now() - lastFrameAt) + ' ago' : null,
        at: lastFrameAt, budget: BUDGET.state, prov: 'observed',
        field: 'SSE state frame', source: 'the page watched it arrive', title: 'last state push',
      }),
      ' ', h('i', { className: 'beatdot', ref: beat, title: 'blips once per state push — if this is still, the feed is still' })),
    h('span', { className: 'busitem', style: bell === 'denied' ? { color: 'var(--hot)', fontWeight: 700 } : null },
      'notify ' + (bell === 'granted' ? 'ON' : bell === 'denied' ? 'DENIED' : 'OFF')),
    h('span', { className: 'busitem' }, 'feed ' + link));
}

/* ── C6 — THE COMMAND PALETTE ──────────────────────────────────────
   Every action on the deck, reachable without knowing where it lives.
   ------------------------------------------------------------------ */
function Palette({ items, onClose }) {
  const [q, setQ] = useState('');
  const [ix, setIx] = useState(0);
  const input = useRef(null);
  const rows = useMemo(() => rankPalette(items, q).slice(0, 60), [items, q]);
  useEffect(() => { if (input.current) input.current.focus(); }, []);
  useEffect(() => { setIx(0); }, [q]);
  const run = (it) => { onClose(); if (it && it.run) it.run(); };
  const onKey = (e) => {
    if (e.key === 'Escape') { onClose(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); setIx((n) => Math.min(rows.length - 1, n + 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setIx((n) => Math.max(0, n - 1)); }
    else if (e.key === 'Enter') { e.preventDefault(); run(rows[ix]); }
  };
  return h('div', { className: 'scrim', onMouseDown: (e) => { if (e.target === e.currentTarget) onClose(); } },
    h('div', { className: 'palette', role: 'dialog', 'aria-label': 'Command palette' },
      h('input', {
        ref: input, value: q, onChange: (e) => setQ(e.target.value), onKeyDown: onKey,
        placeholder: 'run, open, jump…', 'aria-label': 'Command', spellCheck: false,
      }),
      rows.length === 0
        ? h('div', { className: 'pempty' }, 'nothing matches “' + q + '”')
        : h('ul', { role: 'listbox' }, rows.map((it, i) => h('li', {
            key: it.id, role: 'option', 'aria-selected': i === ix ? 'true' : 'false',
            onMouseEnter: () => setIx(i), onMouseDown: (e) => { e.preventDefault(); run(it); },
          },
            h('span', { className: 'pgroup' }, it.group),
            h('span', { className: 'plabel' }, it.label))))));
}

/* ── C3 — HANDOVER / WHILE YOU SLEPT ───────────────────────────────
   The only structural answer to "what happened while nobody was watching", and
   the only one that can name its own blind spots. A digest that cannot say
   "03:04–04:52 unobserved" is a digest that is quietly claiming to be complete.
   ------------------------------------------------------------------ */
function Digest({ digest, sinceAt, onClose, onWire }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  const sec = (title, lines) => (lines && lines.length
    ? h('div', { className: 'digest-sec' }, h('h3', null, title),
        h('ul', { className: 'where-list' }, lines.map((l, i) =>
          h('li', { key: i },
            typeof l === 'string' ? l : h(React.Fragment, null,
              h('strong', null, l.headline || l.text),
              l.note && h('div', { style: { fontSize: '0.86rem', marginTop: '0.2rem' } }, l.note),
              l.wire && h('button', { className: 'linkish', type: 'button', onClick: () => { onClose(); onWire(l.wire); } }, 'find it on the wire'))))))
    : null);
  return h('div', { className: 'bigsheet', role: 'dialog', 'aria-label': 'While you slept' },
    h('div', { style: { display: 'flex', justifyContent: 'space-between', gap: '1rem', alignItems: 'baseline' } },
      h('div', { className: 'digest-lede' }, digest ? digest.lede : 'Late edition'),
      h('button', { type: 'button', onClick: onClose }, 'Close')),
    !digest
      ? h('p', { className: 'mono', style: { marginTop: '1rem', color: 'var(--hot)' } },
          'instruments.digestDiff is not available, so there is NO digest — not an empty one. ' +
          'The page will not summarise a span it cannot read.' +
          (sinceAt ? ' You were last here at ' + new Date(sinceAt).toLocaleString() + '.' : ''))
      : h(React.Fragment, null,
          sec('The numbers', digest.numbers),
          sec('What ruled', digest.ruled),
          sec('What broke', digest.broke),
          sec('What needs you', digest.needsYou),
          h('div', { className: 'digest-cov' },
            digest.coverage || 'coverage was not reported for this window — treat everything above as partial')));
}

/* ── C4 — THE NIGHT BELL ───────────────────────────────────────────
   Rules fire off JOURNAL TRANSITIONS — edges, not polling — so a condition that
   is already true when you open the page does not shout, and one that BECOMES
   true at 04:12 does. Every rule has a TEST button, because an alerter that has
   quietly stopped working is strictly worse than no alerter at all.
   ------------------------------------------------------------------ */
const BELL_RULES = [

  { id: 'health-failed', cls: 'critical', label: 'any health check goes to failed' },

  { id: 'feed-silent', cls: 'critical', label: 'the feed goes silent for 90s' },
  { id: 'parked', cls: 'owed', label: 'a new parked entry appears' },
  { id: 'owed', cls: 'owed', label: 'a new thing is owed by you' },
  { id: 'exit-bad', cls: 'critical', label: 'a run exits stalled / blocked / refused' },
  { id: 'account-refused', cls: 'money', label: 'an account refuses' },
  { id: 'accounts-cold', cls: 'money', label: 'every account is cold' },
  { id: 'gate-warning', cls: 'critical', label: 'a spec retires with no closing gate' },
  { id: 'gate-revise', cls: 'critical', label: 'a gate rules REVISE' },
  { id: 'money-mark', cls: 'money', label: 'notional crosses the next $250' },

function BellSheet({ perm, enabled, quiet, onToggle, onQuiet, onAsk, onTest, onClose, journalReady }) {
