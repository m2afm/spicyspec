/**
 * One row per supervised check — what was checked, when, and the last repair with its time.
 *
 * This panel exists because of the night the loop was dead for eight hours behind a header
 * that said RUNNING / LIVE FEED. Nothing on the page watched the processes, and nothing on
 * the page could have said so. A self-healer nobody can see is the same class of lie as a
 * frozen feed, so an absent or silent supervisor is stated in the panel's loudest words —
 * together with the one command that installs it.
 *
 * It collapses VISUALLY, never conditionally. The roster and the event feed are always
 * rendered and always in the DOM; `open` only changes whether the wrapper is 0fr or 1fr.
 * Hiding a break behind a conditional would be this panel telling the original lie itself.
 * `open` / `onToggle` are optional, so the component stays a pure function of props.
 */
function Health({ health, open, onToggle }) {
  if (!health || !health.supervisor) {
    return h(Panel, { title: 'Self-healing', alert: true },
      h('p', { className: 'mono', style: { margin: 0, fontSize: '0.76rem' } },
        'no supervisor reporting — nothing is watching the processes.'));
  }
  const sup = health.supervisor;
  const rows = health.rows || [];
  const events = health.events || [];
  const broken = rows.filter((r) => r.status === 'failed').length;
  const ordered = events.slice().reverse();
  const eventLine = (e, i) => h('li', { key: e.check + '@' + e.at + '#' + i },
    h('span', { className: 'tool' }, e.check),
    h('span', { className: 'hint' }, e.status + (e.detail ? ' — ' + e.detail : '') + ' · ' + ago(e.at)));

  return h(Panel, {
      title: 'Self-healing',
      alert: !sup.reporting || broken > 0,
      sub: sup.reporting ? 'supervisor beat ' + ago(sup.lastAt) : 'nobody is watching',
    },
    // The always-visible head: one square per check, coloured by the same status vocabulary
    // the roster uses, each titled with its label and its reported word.
    h('div', { className: 'striphead' },
      h('div', { className: 'strip-dots' }, rows.map((r) => h('i', {
        key: r.check,
        className: (HEALTH_TAG[r.status] || ' mute').trim() || 'ok',
        title: r.label + ' — ' + (r.reported || 'not reported'),
      }))),
      h('span', { style: { flex: 1 } }),
      h('button', {
        className: 'linkish', type: 'button',
        onClick: () => { if (onToggle) onToggle(); },
      }, h('span', { className: 'chev' + (open ? ' open' : '') }, '▸'), ' ',
         open ? 'hide the roster' : 'the roster and ' + events.length + ' events')),
    h('div', { className: 'stripline', style: broken > 0 ? { color: 'var(--hot)', fontWeight: 700 } : null },
      healthWorst(rows)),
    !sup.reporting && h('p', {
      className: 'mono',
      style: { margin: '0.5rem 0 0', fontSize: '0.74rem', fontWeight: 700, color: 'var(--hot)' },
    }, sup.advice || 'supervisor not reporting'),

    h('div', { className: 'disclose' + (open ? ' open' : '') }, h('div', null,
      // Bounded, not truncated: six roster cards plus a full event log is ~980px, which is
      // the monstrous panel back again wearing a chevron. It scrolls inside itself instead.
      h('div', { className: 'scrollcap', style: { paddingTop: '0.7rem' } },
        rows.map((r) => h('div', { key: r.check, className: 'acct' + (r.status === 'failed' ? ' cold' : '') },
          h('div', { className: 'acct-top' },
            h('span', { className: 'acct-name' }, r.label),
            h('span', { className: 'tag' + (HEALTH_TAG[r.status] || '') }, r.reported || 'not reported')),
          h('div', { className: 'acct-meta' },
            h('span', null, r.checkedAt ? 'checked ' + ago(r.checkedAt) : 'never checked'),
            r.lastRepairAt
              ? h('span', { style: { color: 'var(--hot)', fontWeight: 700 } }, 'repaired ' + ago(r.lastRepairAt))
              : h('span', null, 'no repair on record')),
          r.detail && h('div', { className: 'acct-meta', style: { color: 'var(--text-soft)' } }, r.detail.slice(0, 140)),
          // The repair line is only worth its own row when it is not simply the latest report
          // repeating itself — a healed check says "repaired" once, not twice.
          r.lastRepairDetail && r.lastRepairAt !== r.checkedAt &&
            h('div', { className: 'acct-meta', style: { color: 'var(--hot-deep)' } }, 'last repair: ' + r.lastRepairDetail.slice(0, 120)))),
        // 12 lines, then the rest behind a native disclosure. `details` rather than React
        // state because this component must stay callable as a plain function of props.
        events.length > 0 && h('ul', { className: 'feed', style: { marginTop: '0.7rem' } },
          ordered.slice(0, 12).map(eventLine)),
        ordered.length > 12 && h('details', { className: 'morebox' },
          h('summary', null, 'show all ' + ordered.length + ' events'),
          h('ul', { className: 'feed' }, ordered.slice(12).map(eventLine)))))));
}

/* ── progressive disclosure primitives ─────────────────────────────────
   Every list on this page was uncapped, which is how the Overview reached 4105px.
   None of them may DROP anything, so each caps at a readable default and says, in
   the count, exactly what it is holding back. "show all n" is not decoration: a
   silent cap reads as "this is everything", which is the one thing a record must
   never claim.
   -------------------------------------------------------------------- */

/** The action feed of one lane. Keys are content-derived, or every row would look new
    on every 4-second push and any enter animation would fire on all of them forever. */
function FeedList({ items, cap, prefix }) {
  const [all, setAll] = useState(false);
  const list = items || [];
  const start = all ? 0 : Math.max(0, list.length - cap);
  return h('div', null,
    h('ul', { className: 'feed' }, list.slice(start).map((a, i) =>
      h('li', { key: prefix + '|' + a.tool + '|' + a.hint + '#' + (start + i) },
        h('span', { className: 'tool' }, a.tool),
        h('span', { className: 'hint' }, a.hint)))),
    !all && list.length > cap && h('button', {
      className: 'linkish showall', type: 'button', onClick: () => setAll(true),
    }, 'show all ' + list.length + ' actions'));
}

/** The worker's last say-line. Three lines, then the rest in place — a quote that runs to
    fourteen lines pushes everything under it off the screen for one sentence of prose. */
function Say({ text }) {
  const [all, setAll] = useState(false);
  const long = String(text).length > 220;
  return h('div', null,
    h('div', { className: 'quote' + (all || !long ? '' : ' clamp') }, '“' + text + '”'),
    long && h('button', {
      className: 'linkish showall', type: 'button', onClick: () => setAll(!all),
    }, all ? 'clamp it' : 'show all of it'));
}

/* The body of one lane: the four figures, the action feed, the last thing it said. Shared so
   the single-lane panel is literally the prototype's Current tick (app.html:1244-1257) and the
   multi-lane one is the same body under a per-lane headline. */
function laneBody(lane) {
  const mins = lane.startedAt ? Math.round((Date.now() - lane.startedAt) / 60000) : null;
  return [
    h('div', { key: 'stats', className: 'statrow', style: { marginBottom: '0.6rem' } },
      h(Stat, { n: fmtMin(mins), l: 'elapsed' }),
      h(Stat, { n: lane.tools ?? 0, l: 'tool calls' }),
      h(Stat, { n: lane.verification ?? 0, l: 'verify cmds' }),
      h(Stat, { n: lane.subagents ?? 0, l: 'subagents' })),
    h(FeedList, { key: 'feed', items: lane.actions || [], cap: 8, prefix: String(lane.id || lane.spec || 'lane') }),
    lane.say && h(Say, { key: 'say', text: lane.say }),
  ];
}

function LaneBlock({ lane, divider }) {
  return h('div', { style: divider ? { borderTop: '2px solid var(--line)', marginTop: '0.9rem', paddingTop: '0.8rem' } : null },
    h('div', { className: 'panel-title', style: { border: 0, margin: 0, paddingBottom: '0.4rem' } },
      h('span', null, 'Spec ' + lane.spec + ' · ' + lane.stage),
      h('span', { className: 'sub' }, lane.account)),
    laneBody(lane));
}

function Live({ live, lanes, running }) {
  if (!running) return h(Panel, { title: 'Current tick' }, h('p', { className: 'mono' }, 'The loop is not running. Press START — it spawns detached and outlives this page.'));
  const all = (lanes && lanes.length) ? lanes : (live ? [live] : []);
  if (!all.length) return h(Panel, { title: 'Current tick' }, h('p', { className: 'mono' }, 'starting up…'));
  // One active spec is the normal case, and there it must LOOK like the prototype: the run id
  // in the sub, the figures straight underneath. '1 lane' plus a 'Spec X · stage' headline was
  // the multi-lane frame worn by a single lane — two extra lines of chrome saying what the
  // Catalog already says. Multi-lane rendering is kept for the >1 case only.
  if (all.length === 1) return h(Panel, { title: 'Current tick', sub: 'tick ' + all[0].id }, laneBody(all[0]));
  return h(Panel, { title: 'Current tick', sub: all.length + ' lanes' },
    all.map((lane, i) => h(LaneBlock, { key: lane.spec || i, lane, divider: i > 0 })));
}

/* ── ZONE 2: the marquee ───────────────────────────────────────────────
   The founder's four questions — is it working, on what, for how long, at what cost —
   were spread across a 9px header dot, the Current tick panel, a statrow, and Run totals
   2055px down the page. Nothing here is new data; every field already existed in
   buildRoomState. What is new is that they are read together, at a size that survives a
   glance up from a terminal.
   -------------------------------------------------------------------- */

/**
 * M4 — the elapsed clock. A leaf that owns its own 1s interval, so the tick re-renders
 * roughly forty characters and never the page. It deliberately does not animate: a digit
 * that fades in is a digit you cannot read at the moment it changes, and the motion that
 * carries "time is passing" is the crawl bar beside it.
 */
function Elapsed({ since }) {
  const [, bump] = useState(0);
  useEffect(() => {
    const id = setInterval(() => bump((n) => (n + 1) % 60), 1000);
    return () => clearInterval(id);
  }, []);
  return h('span', { className: 'mq-clock', title: 'since this lane started' }, laneElapsed(since, Date.now()));
}

/**
 * M7 — a figure that ADVANCES to its new value rather than teleporting.
 *
 * Keyed to the VALUE, never to a render: an identical 4-second push finds `target ===
 * from.current` and does nothing at all. The rAF lives in a leaf so the ~38 frames it
 * produces re-render one number, not the marquee.
 */
function Counter({ value, prefix, digits }) {
  const target = Number(value) || 0;
  const [shown, setShown] = useState(target);
  const from = useRef(target);
  useEffect(() => {
    if (target === from.current) return undefined;
    const a = from.current;
    from.current = target;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { setShown(target); return undefined; }
    const t0 = performance.now();
    let raf = 0;
    const step = (t) => {
      const k = Math.min(1, (t - t0) / 640);
      setShown(a + (target - a) * (1 - Math.pow(1 - k, 3)));
      if (k < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return h('span', { className: 'n', style: { fontVariantNumeric: 'tabular-nums' } },
    (prefix || '') + shown.toFixed(digits == null ? 0 : digits));
}

/**
 * M1 — the state word swap.
 *
 * Triggered from a useEffect comparing the STRING to a ref of its previous value, so a
 * WORKING → WORKING push is completely silent; the class is dropped on `animationend`, so a
 * re-render mid-flight cannot restart it. This is the only fact on the page that changes
 * meaning rather than magnitude, and a founder glancing up needs to catch that it moved.
 */
function StateWord({ state }) {
  const el = useRef(null);
  const prev = useRef(state);
  useEffect(() => {
    if (prev.current === state) return undefined;
    prev.current = state;
    const node = el.current;
    if (!node) return undefined;
    node.classList.remove('swap');
    void node.offsetWidth;           // one forced reflow, only ever on a real state change
    node.classList.add('swap');
    const done = () => node.classList.remove('swap');
    node.addEventListener('animationend', done, { once: true });
    return () => node.removeEventListener('animationend', done);
  }, [state]);
  return h('div', { className: 'marquee-state', ref: el }, state);
}

function Marquee({ s, top, armed, unsupervised, owedCount, onOwed }) {
  const c = s.catalog;
  const t = s.totals;
  const lanes = (s.lanes && s.lanes.length) ? s.lanes : (s.live ? [s.live] : []);
  const shown = lanes.slice(0, 3);
  const on = top.tone === 'on';
  // The leased account is the one a tick would actually run on: the first that is not cold.
  const leased = (s.accounts || []).find((a) => !a.cold) || (s.accounts || [])[0] || null;
  const u = leased ? leased.utilization : null;
  const gcls = u == null ? '' : u >= 0.9 ? 'crit' : u >= 0.7 ? 'warn' : '';
  const overage = (s.accounts || []).some((a) => a.overageStatus === 'allowed');

  return h('section', {
    className: 'panel' + (on ? '' : ' alert'),
    style: { marginBottom: '1.1rem' },
  },
    h('div', { className: 'marquee' },

      // ── CELL A — is it working, and why not ──────────────────────────
      h('div', { className: 'mq-cell' },
        h('div', { className: 'mq-head' },
          h('i', {
            className: 'marquee-dot ' + (on ? 'on' : top.tone === 'warn' ? 'warn' : 'off'),
            title: top.reason || 'a lane is in flight',
          }),
          h(StateWord, { state: top.state })),
        h('div', { className: 'marquee-rule' + (on ? '' : ' idle') }),
        // The reason line, moved out of the header where it was 0.76rem. The chips describe
        // PROCESSES — "running", "live feed" — and processes are what stayed true for eight
        // hours over a cancelled rotation. This is the only line describing PROGRESS.
        h('div', { className: 'whybar' + (top.tone === 'off' ? ' off' : ''), style: on && !top.reason ? { color: 'var(--text-soft)', borderLeftColor: 'var(--shatta)' } : null },
          top.reason || 'a lane is in flight — the loop is doing the work'),
        h('div', { className: 'role-chips', style: { marginTop: '0.6rem' } },
          armed && h('span', { className: 'chip warn' },
            (s.killFlag ? 'kill' : 'stop') + ' armed · ' + (armed.armedBy || 'unknown author') + ' · ' + ago(armed.armedAt)),
          unsupervised && h('span', { className: 'chip warn' }, 'unsupervised'),
          // The one added affordance on the whole page: the debt is stated where the founder
          // is already looking, and clicking it takes them to the list rather than describing it.
          owedCount > 0 && h('button', {
            type: 'button', className: 'chip live chipbtn', onClick: onOwed,
          }, owedCount + ' owed by you'))),

      // ── CELL B — on what, and for how long ───────────────────────────
      h('div', { className: 'mq-cell' },
        h('div', { className: 'mq-label' }, 'on what'),
        shown.length === 0
          ? h('div', null,
              h('div', { className: 'where-head', style: { fontSize: '1.15rem' } }, 'nothing in flight'),
              h('div', { className: 'where-src', style: { marginTop: '0.4rem' } },
                c.pending + ' pending · ' + c.parked.length + ' parked · ' + c.awaitingFounder.length + ' awaiting you'))
          : shown.map((lane) => h('div', { key: lane.id || lane.spec, className: 'marquee-lane' },
              h('div', { className: 'mq-lane-top' },
                h('span', { className: 'mq-lane-name' }, 'Spec ' + lane.spec + ' · ' + lane.stage),
                h(Elapsed, { since: lane.startedAt })),
              h('div', { className: 'acct-meta', style: { marginTop: '0.2rem' } },
                h('span', { className: 'tag' }, lane.account),
                h('span', null, (lane.tools ?? 0) + ' tools'),
                h('span', null, (lane.subagents ?? 0) + ' subagents')),
              // M5: the runtime reports no percentage, so a determinate bar would be an
              // invented number. A crawl says "in flight, duration unknown", which is true.
              h('div', { className: 'runbar live', style: { marginTop: '0.4rem' } }, h('i', null)))),
        lanes.length > shown.length && h('div', { className: 'where-src' },
          '+' + (lanes.length - shown.length) + ' more lane(s) — all of them in Current tick below')),

      // ── CELL C — at what cost, and how much window is left ───────────
      h('div', { className: 'mq-cell' },
        h('div', { className: 'mq-label' }, 'cost + runway'),
        h('div', { className: 'statrow two' },
          h('div', { className: 'stat' },
            h(Counter, { value: t.notional, prefix: '$', digits: 2 }),
            h('span', { className: 'l' }, 'notional')),
          h(Stat, { n: t.ticks, l: 'ticks' }),
          h(Stat, { n: t.closed, l: 'tasks closed' }),
          h(Stat, { n: fmtMin(t.minutes), l: 'worker time' })),
        leased && h('div', { style: { marginTop: '0.75rem' } },
          h('div', { className: 'acct-top' },
            h('span', { className: 'acct-name', style: { fontSize: '1rem' } }, leased.id),
            overage
              ? h('span', { className: 'tag warm' }, 'OVERAGE ON')
              : h('span', { className: 'tag' + (u != null && u >= 0.9 ? ' warm' : '') }, leased.rateStatus || 'warm')),
          h('div', { className: 'gauge', title: u == null ? 'under the reporting threshold' : pct(u) + '% used' },
            h('i', { className: gcls, style: { transform: 'scaleX(' + (u == null ? 0.08 : Math.max(0.04, u)) + ')' } })),
          h('div', { className: 'acct-meta' },
            h('span', null, u == null ? '<90% used' : pct(u) + '% used'),
            leased.windowEndsAt && h('span', null, 'window ' + clock(leased.windowEndsAt)),
            h('span', null, leased.ticks + ' ticks'))),
        h('p', { className: 'mono', style: { fontSize: '0.68rem', color: 'var(--text-dim)', margin: '0.6rem 0 0' } },
          t.billable === 0
            ? 'No tick used overage. Notional is list-price token value, not money.'
            : t.billable + ' tick(s) ran as OVERAGE and may be billable.'))));
}

/* ── ZONE 4/5: the panels that report rather than block ────────────────
   Each keeps its name, its title and every field it had. What changed is that a
   reference strip is 110px collapsed instead of 1029px expanded by default.
   -------------------------------------------------------------------- */

/** Owed by you — every item, ranked, three across, and never taller than one screen. */
function OwedPanel({ items, onOpen }) {
  const [all, setAll] = useState(false);
  const sorted = sortOwed(items);
  const shown = all ? sorted : sorted.slice(0, 6);
  if (sorted.length === 0) {
    return h(Panel, { title: 'Owed by you', sub: 'nothing waiting on you' },
      h('p', { className: 'mono', style: { margin: 0, fontSize: '0.74rem', color: 'var(--text-dim)' } },
        'No spec is awaiting a founder journey and no journey is half-walked. When one lands it appears here in red.'));
  }
  return h(Panel, { title: 'Owed by you', alert: true, sub: 'click one — each opens a checklist' },
    h('ul', { className: 'owed owedgrid' + (all && sorted.length > 6 ? ' capped' : '') },
      shown.map((item) => h('li', { key: item.key },
        h('button', {
          className: 'owedrow', type: 'button',
          onClick: () => onOpen({ kind: item.kind, id: item.id }),
        },
          h('span', { className: 'owedtitle', title: item.title || ('Spec ' + item.id) },
            item.kind === 'spec'
              ? h(React.Fragment, null, h('b', null, 'Spec ' + item.id), ' — clicked founder journey')
              : item.title),
          h('div', { className: 'owedmeta' },
            item.signedOff && h('span', { className: 'ready' }, 'SIGNED OFF'),
            item.progress
              ? h('span', null, item.progress.done + ' of ' + item.progress.total + ' checks')
              : h('span', null, 'open to see what it needs'),
            item.progress?.complete && !item.signedOff && h('span', { className: 'ready' }, 'ready to sign off'),
            item.recordedOn && h('span', null, item.recordedOn)),
          // `affects` is frequently a full sentence naming five downstream specs. One line
          // here, the whole of it in the tooltip, and all of it in the brief the tile opens.
          item.affectsSpec && h('div', { className: 'owedmeta' },
            h('span', { className: 'owedaffects', title: 'affects ' + item.affectsSpec }, 'affects ' + item.affectsSpec)),
          item.progress?.total > 0 && h('div', { className: 'minibar' },
            h('i', {
              className: item.progress.complete ? 'full' : '',
              style: { transform: 'scaleX(' + (item.progress.done / item.progress.total) + ')' },
            })))))),
    !all && sorted.length > shown.length && h('button', {
      className: 'linkish showall', type: 'button', onClick: () => setAll(true),
    }, 'show ' + (sorted.length - shown.length) + ' more'));
}

/** The lanes' own task progress. Two blocks, then the rest in place. */
function CatalogLanes({ lanes }) {
  const [all, setAll] = useState(false);
  const shown = all ? lanes : lanes.slice(0, 2);
  return h(React.Fragment, null,
    shown.map((lane) => {
      const lp = lane.progress;
      return h('div', { key: lane.id, style: { marginTop: '1rem', borderTop: '2px solid var(--line)', paddingTop: '0.8rem' } },
        h('div', { className: 'panel-title', style: { border: 0, margin: 0, paddingBottom: '0.3rem' } },
          h('span', null, 'Spec ' + lane.id + (lane.stage ? ' · ' + lane.stage : '')), h('span', { className: 'sub' }, lane.slug)),
        !lp && h('p', { className: 'mono', style: { fontSize: '0.78rem', margin: '0.2rem 0 0', color: 'var(--text-soft)' } },
          'SHAPING — no tasks.md yet. This lane is writing spec.md, plan.md and tasks.md from the catalog entry, then the DESIGN gate rules on all three together.'),
        lp && h(Progress, { done: lp.done, built: lp.held, total: lp.total }),
        lp && h('div', { className: 'bar-legend' },
          h('span', null, h('b', null, lp.done), ' done'),
          h('span', null, h('b', null, lp.open), ' open'),
          lp.held > 0 && h('span', null, h('b', null, lp.held), ' held (reason stated)'),
          lp.unmarked > 0 && h('span', { style: { color: 'var(--hot)', fontWeight: 700 } }, lp.unmarked + ' UNMARKED'),
          lp.currentWave && h('span', null, lp.currentWave.slice(0, 46))));
    }),
    lanes.length > shown.length && h('button', {
      className: 'linkish showall', type: 'button', onClick: () => setAll(true),
    }, '+' + (lanes.length - shown.length) + ' more lane(s)'));
}

/** Tree — and, at last, the dirty paths the server has always sent and the page never showed. */
function TreeStrip({ git, open, onToggle }) {
  const paths = git.dirtyPaths || [];
  return h(Panel, { title: 'Tree', sub: git.branch },
    h('div', { className: 'striphead' },
      h('span', { className: 'stripone', title: git.head + ' ' + git.subject },
        h('b', null, git.head), ' ' + git.subject)),
    h('div', { className: 'acct-meta', style: { marginTop: '0.35rem' } },
      h('span', null, 'branch ' + git.branch),
      h('span', { style: git.dirty ? { color: 'var(--warn-text)', fontWeight: 700 } : null },
        git.dirty ? git.dirty + ' dirty' : 'clean'),
      paths.length > 0 && h('button', { className: 'linkish', type: 'button', onClick: onToggle },
        h('span', { className: 'chev' + (open ? ' open' : '') }, '▸'), open ? ' hide files' : ' which files')),
    h('div', { className: 'disclose' + (open ? ' open' : '') }, h('div', null,
      h('ul', { className: 'feed', style: { marginTop: '0.5rem' } },
        paths.map((p, i) => h('li', { key: p + '#' + i }, h('span', { className: 'hint', title: p }, p)))),
      // The server sends the first eight. Saying so beats a list that silently stops.
      git.dirty > paths.length && h('div', { className: 'where-src' },
        (git.dirty - paths.length) + ' further dirty path(s) — the state feed carries the first ' + paths.length))));
}

/** Parked — and when nothing is parked it still occupies its cell, so clearing one does
    not make the whole rail jump a row. */
function ParkedStrip({ parked, open, onToggle }) {
  const list = parked || [];
  if (list.length === 0) {
    return h(Panel, { title: 'Parked', sub: 'nothing parked' },
      h('p', { className: 'mono', style: { margin: 0, fontSize: '0.74rem', color: 'var(--text-dim)' } },
        'Nothing in PARKED.md and no queue entry parked without a diagnosis. Anything only you can clear would be listed here.'));
  }
  return h(Panel, { title: 'Parked', alert: true, sub: 'only you can clear these — see PARKED.md' },
    h('div', { className: 'striphead' },
      h('span', { className: 'stripone', title: parkedLabel(list[0]) },
        h('b', null, list.length), ' parked · ' + parkedLabel(list[0])),
      h('button', { className: 'linkish', type: 'button', onClick: onToggle },
        h('span', { className: 'chev' + (open ? ' open' : '') }, '▸'), open ? ' hide' : ' show all ' + list.length)),
    h('div', { className: 'disclose' + (open ? ' open' : '') }, h('div', null,
      h('ul', { className: 'feed', style: { marginTop: '0.5rem' } }, list.map((p, i) =>
        h('li', { key: String(p) + '#' + i }, h('span', { className: 'hint' }, parkedLabel(p))))))));
}

/**
 * Red-first leaves the tree deliberately broken to prove a test fails before it passes. A
 * run that ENDS with residue left a break behind, which is the only thing worth a column;
 * an empty list is clean and a missing field is unknown, never clean.
 */
const redFirstCell = (r) => {
  if (r == null) return '—';
  const n = Array.isArray(r) ? r.length : Number(r) || 0;
  if (!n) return h('span', { className: 'pill clean' }, 'clean');
  return h('span', { className: 'pill bad' }, n);
};
const redFirstTitle = (r) =>
  Array.isArray(r) && r.length
    ? r.map((x) => (typeof x === 'string' ? x : [x.file, x.marker].filter(Boolean).join(' '))).join('\n')
    : r == null
      ? 'no red-first residue was recorded for this run — unknown, not clean'
      : '';

/**
 * ZONE 6 — the record.
 *
 * Three density changes, no columns lost and no rows dropped: twelve of the server's forty
 * by default with the rest one click away; the note clamped to one line with the full text
 * and the red-first file list behind a per-row expand; and a sticky `thead` inside a bounded
 * scroller, because column heads that scroll away turn a wide table into a guessing game.
 * A real virtualizer at n=40 would be a lie about the cost.
 */
function Ticks({ ticks }) {
  const [limit, setLimit] = useState(12);
  const [open, setOpen] = useState(null);
  const shown = ticks.slice(0, limit);
  const cols = ['#', 'exit', 'acct', 'dur', 'closed', '$', 'spec', 'tracker', 'red', 'note'];
  return h(Panel, {
      title: 'Tick history',
      sub: shown.length + ' of ' + ticks.length + ' most recent',
    },
    h('div', { className: 'tablewrap tickscroll' },
      h('table', null,
        h('thead', null, h('tr', null, cols.map((c) => h('th', { key: c }, c)))),
        h('tbody', null, shown.map((t, i) => {
          const bad = BAD.includes(t.exit), warn = WARN.includes(t.exit);
          const key = 'tick-' + t.tick + '-' + (t.attempt || '') + '#' + i;
          const files = Array.isArray(t.redFirst) ? t.redFirst : [];
          const isOpen = open === key;
          const row = h('tr', { key, className: bad ? 'bad' : warn ? 'warnrow' : '' },
            h('td', null, t.tick, t.attempt ? h('span', { className: 'tag', style: { marginLeft: 4 } }, 'retry') : null),
            h('td', null, h('span', { className: 'pill ' + (bad ? 'bad' : warn ? 'warn' : 'clean') }, t.exit)),
            h('td', null, t.account || '—'),
            h('td', null, fmtMin(t.minutes)),
            h('td', null, t.closed || '—'),
            h('td', null, t.cost == null ? h('span', { title: 'no result envelope — unknown, not zero' }, '?') : '$' + t.cost.toFixed(2)),
            h('td', null, t.spec || '—'),
            h('td', null, t.tracker || '—'),
            // Red-first residue: files this run left carrying a deliberate break. A count,
            // because the file list is long and the point is whether the tree was restored.
            h('td', { title: redFirstTitle(t.redFirst) }, redFirstCell(t.redFirst)),
            h('td', { className: 'note', title: t.note || '' },
              h('button', {
                className: 'notebtn', type: 'button',
                onClick: () => setOpen(isOpen ? null : key),
                'aria-expanded': isOpen ? 'true' : 'false',
              },
                h('span', { className: 'chev' + (isOpen ? ' open' : '') }, '▸'),
                h('span', { className: 'nt' }, (t.note || '').slice(0, 150) || 'no note'))));
          if (!isOpen) return row;
          return h(React.Fragment, { key: key + '-w' }, row,
            h('tr', { className: 'detail' }, h('td', { colSpan: cols.length },
              h('div', null, h('b', null, 'note '), t.note || 'none recorded'),
              t.head && h('div', null, h('b', null, 'head '), t.head),
              t.startedAt && h('div', null, h('b', null, 'started '), t.startedAt),
              h('div', null, h('b', null, 'red-first '),
                t.redFirst == null
                  ? 'not recorded — unknown, not clean'
                  : files.length === 0
                    ? 'clean — the tree was restored'
                    : files.map((x) => (typeof x === 'string' ? x : [x.file, x.marker].filter(Boolean).join(' '))).join(' · ')))));
        })))),
    ticks.length > shown.length && h('button', {
      className: 'linkish showall', type: 'button', onClick: () => setLimit(ticks.length),
    }, 'show all ' + ticks.length + ' ticks'));
}

function App() {
  const [themeMode, setThemeMode] = useTheme();
  const [s, setS] = useState(null);
  const [err, setErr] = useState(null);
  const [toast, setToast] = useState(null);
  const [busy, setBusy] = useState(false);
  const [tab, setTab] = useState('overview');
  const [openId, setOpenId] = useState(null);
  const [openDetail, setOpenDetail] = useState(null);
  const [histFilter, setHistFilter] = useState('all');
  const [histLimit, setHistLimit] = useState(25);
  const [owed, setOwed] = useState([]);
  const [roles, setRoles] = useState([]);
  const [roleOpen, setRoleOpen] = useState(null);      // role id | null
  const [roleDetail, setRoleDetail] = useState(null);
  const [draft, setDraft] = useState('');
  // Live tool calls per role, keyed by id. Kept outside the transcript because they are
  // in-flight rather than recorded — once the reply lands they arrive again as part of it.
  const [roleSteps, setRoleSteps] = useState({});
  const [rolePartial, setRolePartial] = useState({});
  const [briefOpen, setBriefOpen] = useState(null);   // { kind, id } | null
  const [brief, setBrief] = useState(null);
  // The three reference strips in the status rail. Collapsed by default — they REPORT, and
  // the page's whole failure was nine panels reporting at the same volume as the one that
  // decides. Their content is always in the DOM; these flags only move a 0fr to a 1fr.
  const [healthOpen, setHealthOpen] = useState(false);
  const [treeOpen, setTreeOpen] = useState(false);
  const [parkedOpen, setParkedOpen] = useState(false);

  const live = useLive();

  const load = useCallback(async () => {
    try {
      const r = await fetch('/api/state');
      if (!r.ok) throw new Error('state ' + r.status);
      setS(await r.json());
      setErr(null);
    } catch (e) { setErr(String(e.message)); }
  }, []);

  // The stream pushes state, so this poll is only a backstop for a stream that dies without
  // the browser noticing. 15s rather than 3s: pushed data is the normal path now.
  useEffect(() => { load(); const id = setInterval(load, 15000); return () => clearInterval(id); }, [load]);
  useEffect(() => { if (live.state) { setS(live.state); setErr(null); } }, [live.state]);

  // A collapsed strip may not hide a NEW break. Keyed to a signature of what is broken, not
  // to a render: the same break on the next 4-second push produces an identical signature and
  // does nothing, so a founder who deliberately collapsed a known failure is not fought with
  // every four seconds — but a DIFFERENT check going down opens it again, once.
  const healthSig = useRef('');
  useEffect(() => {
    const hs = s && s.health;
    if (!hs) return;
    const sig = (hs.supervisor && hs.supervisor.reporting ? '' : 'unsupervised;') +
      (hs.rows || []).filter((r) => r.status === 'failed').map((r) => r.check).join(',');
    if (sig === healthSig.current) return;
    healthSig.current = sig;
    if (sig) setHealthOpen(true);
  }, [s]);

  // The owed index carries per-item progress, so it re-reads whenever a check changes rather
  // than on a timer: nothing else moves it, and a founder ticking a box expects the count
  // beside the item to move with them.
  // Defined FIRST, because several handlers below list it in their dependency arrays — and a
  // useCallback dependency array is evaluated the moment the hook is called, not when the
  // callback runs. Declared after them, it threw "Cannot access 'post' before initialization"
  // and the whole page rendered blank: the const was hoisted into scope but not yet
  // initialized, so merely NAMING it as a dependency was enough to hit the temporal dead zone.
  const post = useCallback(async (path, body) => {
    const r = await fetch(path, {
      method: 'POST',
      headers: { 'X-Loop-Token': TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    return { ok: r.ok, body: await r.json() };
  }, []);

  const loadOwed = useCallback(async () => {
    try {
      const r = await fetch('/api/owed');
      if (r.ok) setOwed((await r.json()).owed || []);
    } catch { /* the panel falls back to the plain list from /api/state */ }
  }, []);
  useEffect(() => { loadOwed(); }, [loadOwed]);

  const loadRoles = useCallback(async () => {
    try {
      const r = await fetch('/api/roles');
      if (r.ok) setRoles((await r.json()).roles || []);
    } catch { /* the tab shows what it last had */ }
  }, []);
  useEffect(() => { loadRoles(); const id = setInterval(loadRoles, 20000); return () => clearInterval(id); }, [loadRoles]);

  const loadRoleDetail = useCallback(async (id) => {
    if (!id) { setRoleDetail(null); return; }
    try {
      const r = await fetch('/api/role?id=' + encodeURIComponent(id));
      setRoleDetail(r.ok ? await r.json() : null);
    } catch { setRoleDetail(null); }
  }, []);
  useEffect(() => { loadRoleDetail(roleOpen); }, [roleOpen, loadRoleDetail]);

  // React to what a role is doing. `done` reloads the transcript and clears the in-flight
  // steps, because the finished message carries its own copy of them.
  useEffect(() => {
    const e = live.roleEvent;
    if (!e) return;
    if (e.kind === 'doing') {
      setRoleSteps((prev) => ({ ...prev, [e.role]: [...(prev[e.role] || []), e.step].slice(-40) }));
    } else if (e.kind === 'partial') {
      setRolePartial((prev) => ({ ...prev, [e.role]: e.text }));
    } else if (e.kind === 'started') {
      setRoleSteps((prev) => ({ ...prev, [e.role]: [] }));
      setRolePartial((prev) => ({ ...prev, [e.role]: '' }));
      loadRoles();
    } else if (e.kind === 'done' || e.kind === 'failed' || e.kind === 'task') {
      setRoleSteps((prev) => ({ ...prev, [e.role]: [] }));
      setRolePartial((prev) => ({ ...prev, [e.role]: '' }));
      loadRoles();
      if (e.role === roleOpen) loadRoleDetail(e.role);
      if (e.kind === 'failed') setToast(e.role + ': ' + e.error);
    }
  }, [live.roleEvent, roleOpen, loadRoles, loadRoleDetail]);

  const sendToRole = useCallback(async () => {
    const text = draft.trim();
    if (!roleOpen || !text) return;
    setDraft('');
    const res = await post('/api/role/say', { id: roleOpen, text });
    if (!res.ok || res.body.ok === false) {
      setToast(res.body.message || 'could not send');
      setDraft(text);   // give it back rather than losing what was typed
      return;
    }
    loadRoleDetail(roleOpen);
  }, [draft, roleOpen, post, loadRoleDetail]);

  const queueRoleTask = useCallback(async (text) => {
    if (!roleOpen || !text.trim()) return;
    const res = await post('/api/role/task', { id: roleOpen, text: text.trim() });
    setToast(res.body.ok ? 'queued as a task — it will not run until you send it' : (res.body.message || 'could not queue'));
    if (res.body.ok) { setDraft(''); loadRoleDetail(roleOpen); loadRoles(); }
  }, [roleOpen, post, loadRoleDetail, loadRoles]);

  const saveMandate = useCallback(async (text) => {
    if (!roleOpen) return;
    const res = await post('/api/role/mandate', { id: roleOpen, text });
    setToast(res.body.ok ? 'mandate saved — it is read at the start of every session' : (res.body.message || 'could not save'));
    loadRoleDetail(roleOpen);
    loadRoles();
  }, [roleOpen, post, loadRoleDetail, loadRoles]);

  const loadBrief = useCallback(async (target) => {
    if (!target) { setBrief(null); return; }
    try {
      const r = await fetch('/api/brief?kind=' + encodeURIComponent(target.kind) + '&id=' + encodeURIComponent(target.id));
      const body = await r.json();
      setBrief(r.ok ? body : { error: body.error || ('brief ' + r.status) });
    } catch (e) { setBrief({ error: String(e.message) }); }
  }, []);
  useEffect(() => { loadBrief(briefOpen); }, [briefOpen, loadBrief]);

  useEffect(() => {
    if (!briefOpen) return undefined;
    const onKey = (e) => { if (e.key === 'Escape') setBriefOpen(null); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [briefOpen]);

  // Optimistic, then reconciled. A checkbox that waits for a round trip feels broken, and a
  // checkbox that never reconciles lies when the write failed.
  const toggleCheck = useCallback(async (checkKey, value) => {
    if (!brief?.itemKey) return;
    setBrief((b) => (b ? { ...b, progress: { ...b.progress, checked: { ...b.progress.checked, [checkKey]: value ? new Date().toISOString() : undefined }, blockingDone: b.progress.blockingDone + (value ? 1 : -1) } } : b));
    const res = await post('/api/check', { itemKey: brief.itemKey, checkKey, value });
    if (!res.ok || res.body.ok === false) setToast(res.body.message || 'could not save that tick');
    await loadBrief(briefOpen);
    await loadOwed();
  }, [brief, briefOpen, post, loadBrief, loadOwed]);

  const saveNote = useCallback(async (checkKey, text) => {
    if (!brief?.itemKey) return;
    const res = await post('/api/note', { itemKey: brief.itemKey, checkKey, text });
    if (!res.ok || res.body.ok === false) setToast(res.body.message || 'could not save that note');
    await loadBrief(briefOpen);
  }, [brief, briefOpen, post, loadBrief]);

  const signOff = useCallback(async (id) => {
    if (!window.confirm('Sign off spec ' + id + '?\n\nThis creates an annotated git tag signed-off/' + id + '. The driver reads that tag and frees its founder-review slot, so the loop will open the next spec.')) return;
    setBusy(true);
    const res = await post('/api/signoff', { id });
    setToast(res.body.message || (res.ok ? 'signed off' : 'sign-off refused'));
    setBusy(false);
    await loadBrief(briefOpen);
    await loadOwed();
    load();
  }, [briefOpen, post, loadBrief, loadOwed, load]);

  // Prompt and summary are too big to push on every frame, so they are fetched once when an
  // agent is opened; the trace then streams into it from the feed.
  useEffect(() => {
    if (!openId) { setOpenDetail(null); return undefined; }
    let alive = true;
    fetch('/api/agent?id=' + encodeURIComponent(openId))
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => { if (alive) setOpenDetail(d); })
      .catch(() => { /* the sheet still shows what the feed already gave us */ });
    return () => { alive = false; };
  }, [openId]);

  useEffect(() => {
    if (!openId) return undefined;
    const onKey = (e) => { if (e.key === 'Escape') setOpenId(null); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [openId]);
  useEffect(() => { if (!toast) return; const id = setTimeout(() => setToast(null), 7000); return () => clearTimeout(id); }, [toast]);

  const act = async (name, confirmMsg) => {
    if (confirmMsg && !window.confirm(confirmMsg)) return;
    setBusy(true);
    try {
      const r = await fetch('/api/action/' + name, { method: 'POST', headers: { 'X-Loop-Token': TOKEN } });
      const j = await r.json();
      setToast(j.message);
    } catch (e) { setToast('failed: ' + e.message); }
    setBusy(false);
    load();
  };

  if (err && !s) return h('div', { className: 'nojs' }, h('strong', null, 'Cannot reach the server. '), err,
    h('p', { className: 'mono' }, 'Start it with: node .specify/loop/ui/server.mjs'));
  if (!s) return h('div', { className: 'nojs' }, 'reading loop state…');

  const c = s.catalog;
  const active = s.active;
  const p = active && active.progress;
  // WORKING versus NOT WORKING, derived on the server (room-server topLine) so the poll, the
  // SSE frames and the tests all read one sentence. The chip used to be computed here from
  // `s.running`, which is a fresh runner HEARTBEAT and nothing more: it said 'running' for
  // eight hours while the rotation was cancelled and a stop flag sat armed. A heartbeat is now
  // necessary and never sufficient — a lane in flight is what working means, and every other
  // state carries the reason it is not.
  const top = s.activity || { state: s.running ? 'WORKING' : 'STOPPED', reason: null, tone: s.running ? 'on' : 'off' };
  const armed = s.killFlag || s.stopFlag || null;
  // Stated beside feed health, for the same reason feed health is stated beside loop health:
  // an unwatched loop and a watched one look identical on a page that shows only the loop.
  const unsupervised = Boolean(s.health && s.health.supervisor && !s.health.supervisor.reporting);

  const byId = new Map(live.agents.map((a) => [a.id, a]));
  // Dispatched work only, for every count and statistic: the worker is not its own subagent,
  // and including it would inflate "agents" by one forever.
  const realAgents = live.agents.filter((a) => a.kind !== 'session');
  const liveCount = realAgents.filter((a) => a.status === 'running').length;
  // The grid does show it, first and always. It is agent zero — the thing that dispatched
  // everything else — and leaving it out made the one agent that is always working the only
  // one you could not open.
  const gridAgents = live.agents.filter((a) => a.kind === 'session').concat(realAgents);
  const worker = live.agents.find((a) => a.kind === 'session') || null;
  const workerBusy = Boolean(worker && worker.status === 'running');

  // The split the whole tab hinges on. A tick dispatched 24 background commands and had 2
  // things actually running; showing all 26 as equal cards buried the 2 that mattered and
  // grew without bound for the length of the tick. Live is what is running RIGHT NOW and can
  // still change the tree. Everything else is a record.
  const liveNow = gridAgents.filter((a) => a.status === 'running');
  const liveDispatched = liveNow.filter((a) => a.kind !== 'session').length;
  const pastAll = gridAgents.filter((a) => a.status !== 'running').slice().reverse();
  const pastFiltered = pastAll.filter((a) =>
    histFilter === 'agents' ? a.kind === 'local_agent'
      : histFilter === 'commands' ? a.kind === 'local_bash'
        : true);
  const pastShown = pastFiltered.slice(0, histLimit);
  const openAgent = openDetail || byId.get(openId) || null;
  const openLog = (live.trace.get(openId) || []);

  const feedLink = live.link === 'live'
    ? ['on', 'live feed']
    : live.link === 'reconnecting' ? ['warn', 'feed reconnecting'] : ['off', 'feed connecting'];

  // Owed drives the marquee's one red affordance, so it is counted once, here, from the same
  // list the panel renders — two places counting the same debt is how one of them goes stale.
  const owedItems = owed.length
    ? owed
    : c.awaitingFounder.map((id) => ({ kind: 'spec', id, key: 'spec-' + id, title: 'Spec ' + id + ' — clicked founder journey' }));
  const jumpToOwed = () => {
    const el = document.getElementById('zone-obligations');
    if (!el) return;
    // Reduced motion means no scroll animation either — a 700px smooth glide is the largest
    // piece of motion on the page, and the setting exists for people it makes ill.
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  };

  return h('div', null,
    // Header and tabs are ONE sticky dock. Two stacked stickies need the second to know the
    // first's height, and that number is wrong the moment the hero wraps.
    h('div', { className: 'topdock' },
    h('header', { className: 'hero' },
      h('h1', null, 'Loop Control Room'),
      h('span', { className: 'pulse ' + top.tone, title: top.reason || 'a lane is in flight' },
        h('i', { className: 'dot' }), top.state),
      // WHO armed the flag, and WHEN. An unsigned flag reads as nobody's, which is exactly how
      // an agent's stop survived a night with no founder able to say who set it.
      armed && h('span', { className: 'pulse warn' }, h('i', { className: 'dot' }),
        (s.killFlag ? 'kill' : 'stop') + ' armed · ' + (armed.armedBy || 'unknown author') + ' · ' + ago(armed.armedAt)),
      // Feed health is stated separately from loop health on purpose: a dead feed and a
      // stopped loop look identical on a page that shows only one of them.
      h('span', { className: 'pulse ' + feedLink[0] }, h('i', { className: 'dot' }), feedLink[1]),
      unsupervised && h('span', {
        className: 'pulse off',
        title: (s.health.supervisor.advice || 'the supervisor is not reporting'),
      }, h('i', { className: 'dot' }), 'unsupervised'),
      s.driver && h('span', { className: 'mono', style: { fontSize: '0.72rem', color: 'var(--text-dim)' } },
        'pid ' + s.driver.pid + (s.driver.workerPid ? ' · worker ' + s.driver.workerPid : '') + ' · code ' + (s.driver.code || '?') + ' · beat ' + ago(s.driver.heartbeat)),
      h('span', { style: { flex: 1 } }),
      h(ThemeSwitch, { mode: themeMode, onPick: setThemeMode }),
      h('div', { className: 'controls' },
        h('button', { className: 'go', disabled: busy || s.running, onClick: () => act('start') }, 'Start'),
        h('button', { className: 'warn', disabled: busy || !s.running, onClick: () => act('stop') }, 'Pause after tick'),
        h('button', { className: 'danger', disabled: busy || !s.running, onClick: () => act('kill', 'Kill the running worker now? Uncommitted work in this tick may be lost.') }, 'Kill now'),
        (s.stopArmed || s.killArmed) && h('button', { disabled: busy, onClick: () => act('resume') }, 'Clear stop'),
        h('button', { disabled: busy, onClick: () => act('report') }, 'Report'))),
    // The `.whybar` reason line has MOVED to the marquee, where it is read at three times
    // this size. It left the header rather than being dropped: it is still the only line on
    // the page that describes progress rather than a process.

    h('div', { className: 'tabs', role: 'group', 'aria-label': 'View' },
      h('button', { type: 'button', 'aria-pressed': tab === 'overview' ? 'true' : 'false', onClick: () => setTab('overview') }, 'Overview'),
      h('button', { type: 'button', 'aria-pressed': tab === 'agents' ? 'true' : 'false', onClick: () => setTab('agents') },
        'Agents',
        // Never a bare zero. "0" beside a worker that is plainly running reads as "this view
        // is broken", and in effect it was: it counted only DISPATCHED agents, so a worker
        // doing the job itself — which is most of a shape stage — showed nothing at all.
        h('span', { className: 'badge' }, agentBadge(liveCount, realAgents.length, workerBusy))),
      h('button', { type: 'button', 'aria-pressed': tab === 'history' ? 'true' : 'false', onClick: () => setTab('history') },
        'History', h('span', { className: 'badge' }, String(pastAll.length))),
      h('button', { type: 'button', 'aria-pressed': tab === 'management' ? 'true' : 'false', onClick: () => setTab('management') },
        'Management',
        h('span', { className: 'badge' },
          roles.some((r) => r.busy) ? 'talking' : String(roles.length || 3))))),

    // A fragment, not a wrapper div: the overview's grid layout must not gain a parent.
    tab === 'agents' && h(React.Fragment, null,
      h('div', { className: 'grid cols-2', style: { marginBottom: '1.1rem' } },
        h(Panel, { title: 'Where we are', sub: live.meta ? 'tick ' + live.meta.number + ' · ' + live.meta.spec + '/' + live.meta.stage : 'no tick' },
          h(WherePanel, { where: live.where })),
        h(Panel, { title: 'Fan-out', sub: 'this tick' },
          // The worker's own tool count leads, because it is the only figure here that is
          // never zero while a tick is alive. All four columns read zero on a running loop
          // during a shape stage, which is precisely when nothing gets dispatched.
          h('div', { className: 'statrow' },
            h(Stat, { n: worker ? worker.toolUses : 0, l: 'worker tools' }),
            h(Stat, { n: realAgents.filter((a) => a.kind === 'local_agent').length, l: 'agents' }),
            h(Stat, { n: liveCount, l: 'working now' }),
            h(Stat, { n: realAgents.filter((a) => a.kind === 'local_bash').length, l: 'commands' })),
          h('div', { className: 'agent-meta', style: { marginTop: '0.9rem' } },
            worker && worker.contextTokens > 0 &&
              h('span', null, 'worker context ' + Math.round(worker.contextTokens / 1000) + 'k'),
            h('span', null, 'depth ' + live.agents.reduce((d, a) => Math.max(d, a.depth), 0)),
            h('span', null, (live.counts.completed || 0) + ' returned'),
            (live.counts.stopped || 0) > 0 && h('span', null, live.counts.stopped + ' cancelled'),
            (live.counts.failed || 0) > 0 && h('span', { style: { color: 'var(--hot)', fontWeight: 700 } }, live.counts.failed + ' failed'),
            // SUBAGENT tokens by name: the runtime reports a total per subagent and none for
            // the worker, so one combined number would be two different measurements added
            // together and presented as one.
            h('span', null, Math.round(realAgents.reduce((n, a) => n + (a.tokens || 0), 0) / 1000) + 'k subagent tokens')),
          // A zero always gets a sentence. "0 agents" next to "5 commands" is accurate and
          // still looks broken, so each shape of emptiness says why it is empty.
          h('div', { className: 'where-src' },
            realAgents.length === 0
              ? 'Nothing dispatched yet this tick — the worker is doing the job itself, which is normal for a shape stage.'
              : realAgents.filter((a) => a.kind === 'local_agent').length === 0
                ? 'No subagent out: the worker is running background commands itself, not delegating.'
                : 'A cancelled command is not a failure — the worker stopped waiting on it deliberately.'))),

      h(Panel, {
        title: 'Working now',
        // Counts DISPATCHED agents, matching the tab badge exactly. The first version counted
        // the cards on screen, which includes the worker, so the badge said "1 live" beside a
        // panel saying "2 live" — two numbers for one fact, which is the bug I keep fixing.
        sub: liveNow.length === 0
          ? 'nothing running'
          : (liveDispatched === 0 ? 'the worker alone' : liveDispatched + ' live') +
            ' · ' + pastAll.length + ' returned, in History',
      },
        liveNow.length === 0
          ? h('div', { className: 'mono', style: { fontSize: '0.72rem', color: 'var(--text-dim)' } },
              live.link === 'live'
                ? 'Nothing is running. The tick has ended, or the loop is between ticks — everything it did is in History.'
                : 'Waiting for the feed…')
          : h('div', { className: 'agentgrid' },
              // Index is the agent's position in the tick's spawn order, not its position in
              // this list, so a card keeps the same number as things finish around it.
              liveNow.map((a) => h(AgentCard, {
                key: a.id, a, index: gridAgents.indexOf(a), parent: byId.get(a.parentId),
                selected: a.id === openId, onOpen: setOpenId,
              }))))),

    tab === 'management' && h(React.Fragment, null,
      h(Panel, {
        title: 'Management',
        sub: 'three sessions you can talk to · click one to open its chat',
      },
        h('p', { style: { fontSize: '0.86rem', lineHeight: 1.5, marginTop: 0 } },
          'The loop had one overseer and nothing checked it, which is how 006 came to be marked ' +
          'built when it had never been started. The manager exists to disagree with the supervisor ' +
          'when the evidence says so; the special agent is yours.'),
        h('div', { className: 'rolegrid' },
          (roles.length ? roles : []).map((r) => h(RoleCard, {
            key: r.id, role: r,
            live: roleSteps[r.id] || [],
            selected: r.id === roleOpen,
            onOpen: setRoleOpen,
          }))),
        roles.length === 0 && h('div', { className: 'mono', style: { fontSize: '0.72rem', color: 'var(--text-dim)' } },
          'Could not read the roles. Is the server on the current code?'),
        h('div', { className: 'where-src', style: { marginTop: '0.9rem' } },
          'Each message is a real Claude Code session turn against this repo — same tooling as the ' +
          'workers, and it costs quota. Supervisor and manager are read-only on purpose: an auditor ' +
          'that can edit what it audits is not an auditor.'))),

    tab === 'history' && h(Panel, {
      title: 'History',
      sub: pastAll.length + ' returned this tick' + (live.meta ? ' (tick ' + live.meta.number + ')' : ''),
    },
      h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '0.6rem', alignItems: 'center', marginBottom: '0.7rem' } },
        h('div', { className: 'theme-seg', role: 'group', 'aria-label': 'Filter history' },
          [['all', 'All'], ['agents', 'Agents'], ['commands', 'Commands']].map(([id, label]) =>
            h('button', {
              key: id, type: 'button',
              'aria-pressed': histFilter === id ? 'true' : 'false',
              onClick: () => { setHistFilter(id); setHistLimit(25); },
            }, label))),
        // Three numbers because there are three: rendered, matching the filter, and total.
        // "28 shown of 28" was printed while 25 rows were on screen — a silent cap is the one
        // thing a history view must never do, since it reads as "this is everything".
        h('span', { className: 'mono', style: { fontSize: '0.66rem', color: 'var(--text-dim)' } },
          pastShown.length + ' shown' +
          (pastFiltered.length !== pastShown.length ? ' of ' + pastFiltered.length + ' matching' : '') +
          (pastFiltered.length !== pastAll.length ? ' · ' + pastAll.length + ' total' : ''))),

      pastFiltered.length === 0
        ? h('div', { className: 'mono', style: { fontSize: '0.72rem', color: 'var(--text-dim)' } },
            pastAll.length === 0
              ? 'Nothing has returned yet this tick.'
              : 'Nothing of that kind this tick — ' + pastAll.length + ' other entries are under All.')
        : h(React.Fragment, null,
            h('ul', { className: 'hist' }, pastShown.map((a) => h('li', { key: a.id },
              h('button', {
                className: 'histrow ' + a.status,
                'aria-current': a.id === openId ? 'true' : 'false',
                onClick: () => setOpenId(a.id),
              },
                h('i', { className: 'sdot ' + a.status }),
                h('span', { className: 'hname' }, agentLabel(a)),
                h('span', { className: 'hdesc' }, a.description),
                h('span', { className: 'hstat' }, AGENT_STAT(a).join(' · ') || a.status))))),
            // Never silently truncate: say what is hidden and offer it.
            pastFiltered.length > pastShown.length && h('button', {
              className: 'linkish', style: { marginTop: '0.6rem' },
              onClick: () => setHistLimit(pastFiltered.length),
            }, 'show ' + (pastFiltered.length - pastShown.length) + ' older'))),

    tab === 'overview' && h(React.Fragment, null,
    // EIGHT ZONES, RANKED — not nine co-equal panels.
    //
    // The page was 4105px of panels that all shouted at the same volume: a 9px header dot
    // answered "is it working", the cost answer sat 2055px down, and the self-healing panel
    // — added last, dumping every check and every event — was 1029px of reference material
    // sitting above the two things a founder acts on. Nothing here is deleted. It is ranked:
    //
    //   2  MARQUEE      is it working · on what · for how long · at what cost
    //   3  LIVE WORK    the current tick, and the catalog it is working through
    //   4  OBLIGATIONS  what only the founder can clear, and what it is costing
    //   5  STATUS RAIL  self-healing, tree, parked — three strips that expand in place
    //   6  RECORDS      tick history, windowed
    //
    // Run totals is the only panel that stops existing as a panel; all four of its figures
    // and its billable sentence are in the marquee's third cell. Fields removed: none.
    // Fields added: git.dirtyPaths, which the server has always sent and the page never showed.

    // ── ZONE 2 ──────────────────────────────────────────────────────────
    h(Marquee, {
      s, top, armed, unsupervised,
      owedCount: owedItems.length,
      onOwed: jumpToOwed,
    }),

    // ── ZONE 3 — live work ──────────────────────────────────────────────
    h('div', { className: 'grid cols-2', style: { marginBottom: '1.1rem' } },
      h(Live, { live: s.live, lanes: s.lanes, running: s.running }),

      h(Panel, { title: 'Catalog', sub: c.signedOff + ' of ' + c.total + ' signed off' },
        h(Progress, { done: c.signedOff, built: c.builtFraction, total: c.total }),
        // "The platform never marks its own work done": a spec that retired on an empty task
        // list with no closing-gate APPROVE on record gets said out loud, not just logged.
        // A chip, not an emoji — the page has a vocabulary for warnings and this is it.
        c.entries.some((e) => e.closingGateWarning) &&
          h('p', { className: 'mono', style: { fontSize: '0.72rem', color: 'var(--warn-text)', fontWeight: 700, margin: '0.6rem 0 0' } },
            h('span', { className: 'tag warn' }, 'no closing gate'), ' ',
            'retired without a closing-gate record: ' +
            c.entries.filter((e) => e.closingGateWarning).map((e) => e.id).join(', ')),
        h('div', { className: 'statrow', style: { marginTop: '1rem' } },
          h(Stat, { n: c.signedOff, l: 'signed off' }),
          h(Stat, { n: c.awaitingFounder.length, l: 'awaiting you' }),
          h(Stat, { n: c.parked.length, l: 'parked' }),
          h(Stat, { n: c.pending, l: 'not started' })),
        h(CatalogLanes, { lanes: (s.actives || (active ? [active] : [])) }))),

    // ── ZONE 4 — obligations. The scroll target of the marquee's red chip. ──
    h('div', { className: 'grid cols-2', id: 'zone-obligations', style: { marginBottom: '1.1rem', scrollMarginTop: '8rem' } },
      // Every row opens a brief. The panel used to name a debt without saying what paying it
      // involves, which is how three specs came to sit here for two days.
      h(OwedPanel, { items: owedItems, onOpen: setBriefOpen }),
      h(Accounts, { accounts: s.accounts, events: s.accountEvents })),

    // ── ZONE 5 — the status rail. Three strips, collapsed, that expand in place. ──
    h('div', { className: 'grid cols-3', style: { marginBottom: '1.1rem' } },
      // Self-healing keeps its name, its full output tree and every row it ever rendered —
      // it collapses visually and never conditionally, and re-opens itself on a new break.
      h(Health, { health: s.health, open: healthOpen, onToggle: () => setHealthOpen((v) => !v) }),
      h(TreeStrip, { git: s.git, open: treeOpen, onToggle: () => setTreeOpen((v) => !v) }),
      h(ParkedStrip, { parked: s.parked, open: parkedOpen, onToggle: () => setParkedOpen((v) => !v) })),

    // ── ZONE 6 — the record ─────────────────────────────────────────────
    h(Ticks, { ticks: s.ticks })),

    roleOpen && h(ChatSheet, {
      role: roles.find((r) => r.id === roleOpen) || null,
      detail: roleDetail,
      liveSteps: roleSteps[roleOpen] || [],
      partial: rolePartial[roleOpen] || '',
      draft, onDraft: setDraft,
      onSend: sendToRole, onTask: queueRoleTask, onMandate: saveMandate,
      onClose: () => setRoleOpen(null),
      busy,
    }),

    briefOpen && h(BriefSheet, {
      brief, busy,
      onToggle: toggleCheck, onNote: saveNote, onSignoff: signOff,
      onClose: () => setBriefOpen(null),
    }),

    openAgent && h(AgentSheet, {
      a: openAgent,
      parent: byId.get(openAgent.parentId),
      children: (openAgent.children || []).map((id) => byId.get(id)).filter(Boolean),
      log: openLog,
      onClose: () => setOpenId(null),
    }),

    h('footer', null,
      'Reads the driver\'s state files and signals it back through files — closing this page never stops a build. ',
      'Loopback bind + host allowlist + cross-site rejection + a per-start control token. Terminal equivalent: ', h('code', null, 'pnpm my-spec'),
      ' · updated ', ago(s.at)),

    toast && h('div', { className: 'toast', role: 'status' }, toast));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
