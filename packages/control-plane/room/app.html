        h('span', { className: 'sub' }, perm === 'granted' ? 'permission on' : perm === 'denied' ? 'DENIED' : 'permission not asked')),
      perm === 'denied' && h('p', { className: 'mono', style: { color: 'var(--hot)', fontSize: '0.76rem', margin: '0 0 0.6rem' } },
        'This browser has DENIED notifications for 127.0.0.1. No rule below can fire until you clear that in site settings. ' +
        'It is said here loudly rather than swallowed, because a bell you believe is on and is not is the worst state of the three.'),
      perm !== 'granted' && perm !== 'denied' && h('button', { type: 'button', className: 'go', onClick: onAsk, style: { marginBottom: '0.6rem' } },
        'Turn the bell on'),
      !journalReady && h('p', { className: 'mono', style: { color: 'var(--hot)', fontSize: '0.74rem', margin: '0 0 0.6rem' } },
        'journal.mjs is not loaded, so no rule can fire: every rule below is an EDGE, and edges come from the transition log.'),
      h('label', { className: 'rulerow', style: { cursor: 'pointer' } },
        h('input', { type: 'checkbox', checked: quiet.on, onChange: (e) => onQuiet({ ...quiet, on: e.target.checked }) }),
        h('span', { className: 'rl' }, 'Quiet hours ' + quiet.from + ':00 → ' + quiet.to + ':00 — CRITICAL rules override it'),
        h('span', { className: 'rc' }, 'quiet')),
      BELL_RULES.map((r) => h('div', { key: r.id, className: 'rulerow' },
        h('input', {
          type: 'checkbox', id: 'rule-' + r.id, checked: enabled[r.id] !== false,
          onChange: (e) => onToggle(r.id, e.target.checked),
        }),
        h('label', { className: 'rl', htmlFor: 'rule-' + r.id }, r.label),
        h('span', { className: 'rc' }, r.cls),
        h('button', { type: 'button', className: 'chipbtn', onClick: () => onTest(r) }, 'test')))));
}


/* ── DECK HOOKS ────────────────────────────────────────────────────
   Shell, density, acknowledgements, the frame ring, the journal, the bell and
   the last-seen mark. All of them persist through localStorage, because a
   console you re-configure every morning is a console you stop configuring.
   ------------------------------------------------------------------ */

const LS = {
  get(k, dflt) { try { const v = localStorage.getItem(k); return v == null ? dflt : JSON.parse(v); } catch (e) { return dflt; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};

/**
 * Which shell we can honestly draw, re-decided on a debounced resize.
 *
 * Written to a data attribute rather than threaded through props: the whole
 * difference between the two shells is CSS, so exactly one render tree feeds both
 * and there is no second layout to keep in step with the first.
 */
function useShell() {
  const [shell, setShell] = useState(() => shellFor(window.innerWidth, window.innerHeight));
  useEffect(() => {
    let t = 0;
    const pick = () => {
      clearTimeout(t);
      t = setTimeout(() => setShell(shellFor(window.innerWidth, window.innerHeight)), 160);
    };
    window.addEventListener('resize', pick);
    return () => { clearTimeout(t); window.removeEventListener('resize', pick); };
  }, []);
  useEffect(() => { document.documentElement.dataset.shell = shell; }, [shell]);
  return shell;
}

const DENSITIES = ['console', 'comfortable', 'wall'];
function useDensity() {
  const [d, setD] = useState(() => {
    const saved = LS.get('loop.density', null);
    return DENSITIES.includes(saved) ? saved : 'console';
  });
  useEffect(() => {
    document.documentElement.dataset.density = d;
    LS.set('loop.density', d);
    // WALL is a room-scale readout left on a screen nobody touches, so it is the one
    // density that asks to keep the screen awake — and it asks, it never assumes:
    // wakeLock does not exist in every browser and a rejected promise is not an error.
    if (d === 'wall' && navigator.wakeLock && navigator.wakeLock.request) {
      navigator.wakeLock.request('screen').catch(() => { /* denied or unsupported: the deck is unaffected */ });
    }
  }, [d]);
  return [d, setD, () => setD((cur) => DENSITIES[(DENSITIES.indexOf(cur) + 1) % DENSITIES.length])];
}

/**
 * Annunciator acknowledgements, keyed to the SIGNATURE of what is wrong.
 *
 * This is the difference between an annunciator and a dismiss button: acking
 * "rotation failed" silences rotation-failed and nothing else. A DIFFERENT failure
 * of the same slot produces a different signature, finds no ack, and alarms again.
 * `firstAt` is when the slot first went live unacked, which is what the five-minute
 * escalation is measured from.
 */
function useAcks() {
  const [acks, setAcks] = useState(() => LS.get('loop.acks', {}) || {});
  const write = useCallback((next) => { setAcks(next); LS.set('loop.acks', next); }, []);
  const ack = useCallback((id, sig) => {
    setAcks((cur) => {
      const next = { ...cur, [id]: { sig, at: Date.now(), firstAt: (cur[id] && cur[id].firstAt) || Date.now() } };
      LS.set('loop.acks', next);
      return next;
    });
  }, []);
  const ackAll = useCallback((slots) => {
    const at = Date.now();
    const next = {};
    for (const sl of slots || []) next[sl.id] = { sig: sl.sig, at, firstAt: at };
    write(next);
  }, [write]);
  return [acks, ack, ackAll];
}

/**
 * C1's ring: the last 60 state frames, appended once per push.
 *
 * A useRef mirrored through a counter, not state: sixty samples re-rendering the
 * whole deck sixty times would be the page spending its budget proving it is alive.
 */
function useFrameRing(state) {
  const ring = useRef([]);
  const [, bump] = useState(0);
  const lastAt = useRef(0);
  useEffect(() => {
    if (!state) return;
    const live = state.live || {};
    const at = Date.now();
    if (at - lastAt.current < 500) return;    // the poll backstop and a push can land together
    lastAt.current = at;
    ring.current = [...ring.current, {
      at,
      tools: typeof live.tools === 'number' ? live.tools : 0,
      verification: typeof live.verification === 'number' ? live.verification : 0,
      subagents: typeof live.subagents === 'number' ? live.subagents : 0,
      lane: live.id || null,
    }].slice(-60);
    bump((n) => (n + 1) % 1000);
  }, [state]);
  return ring.current;
}

/**
 * C2 — THE JOURNAL.
 *
 * The room's memory. Everything else on this page renders the present; only this
 * can describe a span nobody watched, which is the exact failure that burned the
 * founder — a snapshot renderer cannot ever catch a thing that was briefly wrong.
 *
 * The page owns the pump (feed it frames, ask it for a range); the module owns the
 * store and the diffing. When the module is absent the rail says so and the bell
 * says so; nothing invents a coverage figure it did not measure.
 */
function useJournal(jnl, state, railOffsetMs) {
  const [journal, setJournal] = useState(null);
  const [range, setRange] = useState(null);
  const [transitions, setTransitions] = useState([]);
  const prev = useRef(null);
  const seeded = useRef(false);

  useEffect(() => {
    if (!jnl) return undefined;
    let alive = true;
    Promise.resolve(callMod(jnl, 'open', [], null)).then((j) => { if (alive && j) setJournal(j); })
      .catch(() => { /* an unopenable store is an absent one: the rail says coverage unknown */ });
    return () => { alive = false; };
  }, [jnl]);

  useEffect(() => {
    if (!journal || !state) return;
    if (!seeded.current) {
      seeded.current = true;
      // Backfill from state.ticks so an empty database still yields a 24h rail — marked
      // RECONSTRUCTED, drawn as hollow rings, never as things the page saw happen.
      Promise.resolve(callMod(journal, 'seed', [state], null)).catch(() => {});
    }
    const before = prev.current;
    prev.current = state;
    if (!before) return;
    Promise.resolve(callMod(journal, 'record', [before, state, Date.now()], []))
      .then((tr) => { if (Array.isArray(tr) && tr.length) setTransitions(tr); })
      .catch(() => {});
  }, [journal, state]);

  const refresh = useCallback(() => {
    if (!journal) return;
    const to = Date.now() + (railOffsetMs || 0);
    Promise.resolve(callMod(journal, 'range', [to - 86400000, to], null))
      .then((r) => { if (r) setRange({ ...r, from: r.from == null ? to - 86400000 : r.from, to: r.to == null ? to : r.to }); })
      .catch(() => {});
  }, [journal, railOffsetMs]);
  useEffect(() => { refresh(); const id = setInterval(refresh, 30000); return () => clearInterval(id); }, [refresh]);
  useEffect(() => { refresh(); }, [transitions, refresh]);

  return { journal, range, transitions };
}

/* Which transitions each bell rule listens for. Edges, never levels: a condition
   already true when the page opens must not shout, and one that becomes true at
   04:12 must. The predicate reads defensively because the journal is another
   owner's module and a shape it does not produce must fail silent, not throw. */
const BELL_MATCH = {
  'left-working': (t) => t.kind === 'activity.state' && t.from === 'WORKING' && t.to !== 'WORKING',
  'health-failed': (t) => t.kind === 'health.row' && t.to === 'failed',
  'supervisor-silent': (t) => t.kind === 'supervisor.reporting' && t.to === false,
  'feed-silent': (t) => t.kind === 'feed' && t.to === 'down',
  parked: (t) => t.kind === 'parked' && t.change === 'add',
  owed: (t) => t.kind === 'owed' && t.change === 'add',
  'exit-bad': (t) => t.kind === 'tick.exit' && ['stalled', 'blocked', 'account-refused', 'no-progress'].includes(String(t.to)),
  'account-refused': (t) => t.kind === 'account.refused',
  'accounts-cold': (t) => t.kind === 'accounts.allCold' && t.to === true,
  'gate-warning': (t) => t.kind === 'gate.warning' && t.change === 'add',
  'gate-revise': (t) => t.kind === 'gate.ruling' && String(t.verdict).toUpperCase() === 'REVISE',
  'money-mark': (t) => t.kind === 'notional.mark',
};
const BELL_CLASS = Object.fromEntries(BELL_RULES.map((r) => [r.id, r.cls]));

/**
 * C4 — the night bell.
 *
 * 127.0.0.1 is a secure context, so this needs no server, no push service and no
 * third party. Permission is requested ONLY from a real click, never on load:
 * a dashboard that prompts on arrival gets denied once and stays denied forever,
 * and a denied bell that pretends to be on is the worst of the three states — so
 * DENIED is rendered loudly in the bar and on the bus rather than swallowed.
 */
function useBell(transitions, journalReady) {
  const supported = typeof window !== 'undefined' && 'Notification' in window;
  const [perm, setPerm] = useState(() => (supported ? Notification.permission : 'unsupported'));
  const [enabled, setEnabled] = useState(() => LS.get('loop.bell.rules', {}) || {});
  const [quiet, setQuiet] = useState(() => LS.get('loop.bell.quiet', { on: false, from: 1, to: 7 }));
  const fired = useRef(new Set());

  const ask = useCallback(() => {
    if (!supported) return;
    Notification.requestPermission().then((p) => setPerm(p)).catch(() => setPerm('denied'));
  }, [supported]);

  const send = useCallback((rule, title, body) => {
    if (perm !== 'granted') return false;
    const hour = new Date().getHours();
    const inQuiet = quiet.on && (quiet.from < quiet.to
      ? hour >= quiet.from && hour < quiet.to
      : hour >= quiet.from || hour < quiet.to);
    if (inQuiet && BELL_CLASS[rule] !== 'critical') return false;
    try {
      // One tag per rule CLASS, so eight hours of alerts replace each other instead of
      // stacking into a wall the founder has to dismiss one by one at 07:00.
      new Notification(title, { body, tag: 'loop-' + (BELL_CLASS[rule] || 'critical'), silent: false });
      return true;
    } catch (e) { return false; }
  }, [perm, quiet]);

  useEffect(() => {
    if (!transitions || !transitions.length) return;
    for (const t of transitions) {
      for (const rule of BELL_RULES) {
        if (enabled[rule.id] === false) continue;
        let hit = false;
        try { hit = BELL_MATCH[rule.id] ? BELL_MATCH[rule.id](t) : false; } catch (e) { hit = false; }
        if (!hit) continue;
        const sig = rule.id + '|' + (t.at || '') + '|' + (t.to == null ? '' : String(t.to));
        if (fired.current.has(sig)) continue;
        fired.current.add(sig);
        send(rule.id, 'Loop — ' + rule.label, t.headline || t.label || (t.kind + ' ' + (t.from == null ? '' : t.from + ' → ') + t.to));
      }
    }
  }, [transitions, enabled, send]);

  const toggle = useCallback((id, on) => {
    setEnabled((cur) => { const next = { ...cur, [id]: on }; LS.set('loop.bell.rules', next); return next; });
  }, []);
  const setQuietHours = useCallback((q) => { setQuiet(q); LS.set('loop.bell.quiet', q); }, []);
  const test = useCallback((rule) => {
    const ok = send(rule.id, 'Loop — test', rule.label + ' (test fired ' + new Date().toTimeString().slice(0, 8) + ')');
    return ok;
  }, [send]);

  return { supported, perm, enabled, quiet, ask, toggle, setQuietHours, test, journalReady };
}

/**
 * C3's mark. Written on the way OUT — visibilitychange→hidden and pagehide — and
 * never on a 4-second push, because a mark that moves while you are away can never
 * tell you what you missed. That is the entire reason the NEW SINCE divider on the
 * wire holds still with the tab in the background.
 */
function useLastSeen() {
  const [seenAt, setSeenAt] = useState(() => LS.get('loop.lastSeenAt', null));
  const [gapMs, setGapMs] = useState(0);
  useEffect(() => {
    const mark = () => { LS.set('loop.lastSeenAt', Date.now()); };
    const onVis = () => {
      if (document.visibilityState === 'hidden') { mark(); return; }
      const last = LS.get('loop.lastSeenAt', null);
      setSeenAt(last);
      setGapMs(last ? Date.now() - last : 0);
    };
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('pagehide', mark);
    return () => { document.removeEventListener('visibilitychange', onVis); window.removeEventListener('pagehide', mark); };
  }, []);
  const clear = useCallback(() => { LS.set('loop.lastSeenAt', Date.now()); setGapMs(0); setSeenAt(Date.now()); }, []);
  return { seenAt, gapMs, clear };
}

function App() {
  const [themeMode, setThemeMode] = useTheme();
  const [s, setS] = useState(null);
  const [err, setErr] = useState(null);
  const [toast, setToast] = useState(null);
  const [busy, setBusy] = useState(false);
  const [tab, setTab] = useState('overview');
  const [openId, setOpenId] = useState(null);
  const [openDetail, setOpenDetail] = useState(null);
  const [histFilter, setHistFilter] = useState('all');
  const [histLimit, setHistLimit] = useState(25);
  const [owed, setOwed] = useState([]);
  const [roles, setRoles] = useState([]);
  const [roleOpen, setRoleOpen] = useState(null);      // role id | null
  const [roleDetail, setRoleDetail] = useState(null);
  const [draft, setDraft] = useState('');
  // Live tool calls per role, keyed by id. Kept outside the transcript because they are
  // in-flight rather than recorded — once the reply lands they arrive again as part of it.
  const [roleSteps, setRoleSteps] = useState({});
  const [rolePartial, setRolePartial] = useState({});
  const [briefOpen, setBriefOpen] = useState(null);   // { kind, id } | null
  const [brief, setBrief] = useState(null);
  // Two reference strips, now at the foot of the RECORD column. They REPORT, and the page's
  // whole failure was nine panels reporting at the same volume as the one that decides.
  // Their content is always in the DOM; these flags only move a 0fr to a 1fr. Parked left
  // this rail entirely — it is promoted into ACT, because a park is the single most common
  // reason the loop is waiting on a human and it spent a whole build behind a chevron.
  const [healthOpen, setHealthOpen] = useState(false);
  const [treeOpen, setTreeOpen] = useState(false);

  const live = useLive();

  // ── THE DECK ──────────────────────────────────────────────────────
  // Shell and density are written to data attributes, so exactly one render tree
  // feeds the fixed deck and the document fallback and there is no second layout
  // to keep in step. Everything else here is memory: the frame ring that proves
  // motion, the journal that remembers spans nobody watched, the acknowledgements,
  // the bell, and the mark that says when the founder last actually looked.
  const shell = useShell();
  const [density, setDensity, cycleDensity] = useDensity();
  const mods = useModules();
  const ring = useFrameRing(s);
  const [railOffset, setRailOffset] = useState(0);
  const jr = useJournal(mods.jnl, s, railOffset);
  const [acks, ackOne, ackAll] = useAcks();
  const bell = useBell(jr.transitions, Boolean(jr.journal));
  const lastSeen = useLastSeen();
  const [paletteOpen, setPaletteOpen] = useState(false);
  const [shortcutsOpen, setShortcutsOpen] = useState(false);
  const [bellOpen, setBellOpen] = useState(false);
  const [digestOpen, setDigestOpen] = useState(false);
  const [wireFilter, setWireFilter] = useState('all');
  const [wireOpen, setWireOpen] = useState(null);

  const load = useCallback(async () => {
    try {
      const r = await fetch('/api/state');
      if (!r.ok) throw new Error('state ' + r.status);
      setS(await r.json());
      setErr(null);
    } catch (e) { setErr(String(e.message)); }
  }, []);

  // The stream pushes state, so this poll is only a backstop for a stream that dies without
  // the browser noticing. 15s rather than 3s: pushed data is the normal path now.
  useEffect(() => { load(); const id = setInterval(load, 15000); return () => clearInterval(id); }, [load]);
  useEffect(() => { if (live.state) { setS(live.state); setErr(null); } }, [live.state]);

  // A collapsed strip may not hide a NEW break. Keyed to a signature of what is broken, not
  // to a render: the same break on the next 4-second push produces an identical signature and
  // does nothing, so a founder who deliberately collapsed a known failure is not fought with
  // every four seconds — but a DIFFERENT check going down opens it again, once.
  const healthSig = useRef('');
  useEffect(() => {
    const hs = s && s.health;
    if (!hs) return;
    const sig = (hs.supervisor && hs.supervisor.reporting ? '' : 'unsupervised;') +
      (hs.rows || []).filter((r) => r.status === 'failed').map((r) => r.check).join(',');
    if (sig === healthSig.current) return;
    healthSig.current = sig;
    if (sig) setHealthOpen(true);
  }, [s]);

  // The owed index carries per-item progress, so it re-reads whenever a check changes rather
  // than on a timer: nothing else moves it, and a founder ticking a box expects the count
  // beside the item to move with them.
  // Defined FIRST, because several handlers below list it in their dependency arrays — and a
  // useCallback dependency array is evaluated the moment the hook is called, not when the
  // callback runs. Declared after them, it threw "Cannot access 'post' before initialization"
  // and the whole page rendered blank: the const was hoisted into scope but not yet
  // initialized, so merely NAMING it as a dependency was enough to hit the temporal dead zone.
  const post = useCallback(async (path, body) => {
    const r = await fetch(path, {
      method: 'POST',
      headers: { 'X-Loop-Token': TOKEN, 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    return { ok: r.ok, body: await r.json() };
  }, []);

  const loadOwed = useCallback(async () => {
    try {
      const r = await fetch('/api/owed');
      if (r.ok) setOwed((await r.json()).owed || []);
    } catch { /* the panel falls back to the plain list from /api/state */ }
  }, []);
  useEffect(() => { loadOwed(); }, [loadOwed]);

  const loadRoles = useCallback(async () => {
    try {
      const r = await fetch('/api/roles');
      if (r.ok) setRoles((await r.json()).roles || []);
    } catch { /* the tab shows what it last had */ }
  }, []);
  useEffect(() => { loadRoles(); const id = setInterval(loadRoles, 20000); return () => clearInterval(id); }, [loadRoles]);

  const loadRoleDetail = useCallback(async (id) => {
    if (!id) { setRoleDetail(null); return; }
    try {
      const r = await fetch('/api/role?id=' + encodeURIComponent(id));
      setRoleDetail(r.ok ? await r.json() : null);
    } catch { setRoleDetail(null); }
  }, []);
  useEffect(() => { loadRoleDetail(roleOpen); }, [roleOpen, loadRoleDetail]);

  // React to what a role is doing. `done` reloads the transcript and clears the in-flight
  // steps, because the finished message carries its own copy of them.
  useEffect(() => {
    const e = live.roleEvent;
    if (!e) return;
    if (e.kind === 'doing') {
      setRoleSteps((prev) => ({ ...prev, [e.role]: [...(prev[e.role] || []), e.step].slice(-40) }));
    } else if (e.kind === 'partial') {
      setRolePartial((prev) => ({ ...prev, [e.role]: e.text }));
    } else if (e.kind === 'started') {
      setRoleSteps((prev) => ({ ...prev, [e.role]: [] }));
      setRolePartial((prev) => ({ ...prev, [e.role]: '' }));
      loadRoles();
    } else if (e.kind === 'done' || e.kind === 'failed' || e.kind === 'task') {
      setRoleSteps((prev) => ({ ...prev, [e.role]: [] }));
      setRolePartial((prev) => ({ ...prev, [e.role]: '' }));
      loadRoles();
      if (e.role === roleOpen) loadRoleDetail(e.role);
      if (e.kind === 'failed') setToast(e.role + ': ' + e.error);
    }
  }, [live.roleEvent, roleOpen, loadRoles, loadRoleDetail]);

  const sendToRole = useCallback(async () => {
    const text = draft.trim();
    if (!roleOpen || !text) return;
    setDraft('');
    const res = await post('/api/role/say', { id: roleOpen, text });
    if (!res.ok || res.body.ok === false) {
      setToast(res.body.message || 'could not send');
      setDraft(text);   // give it back rather than losing what was typed
      return;
    }
    loadRoleDetail(roleOpen);
  }, [draft, roleOpen, post, loadRoleDetail]);

  const queueRoleTask = useCallback(async (text) => {
    if (!roleOpen || !text.trim()) return;
    const res = await post('/api/role/task', { id: roleOpen, text: text.trim() });
    setToast(res.body.ok ? 'queued as a task — it will not run until you send it' : (res.body.message || 'could not queue'));
    if (res.body.ok) { setDraft(''); loadRoleDetail(roleOpen); loadRoles(); }
  }, [roleOpen, post, loadRoleDetail, loadRoles]);

  const saveMandate = useCallback(async (text) => {
    if (!roleOpen) return;
    const res = await post('/api/role/mandate', { id: roleOpen, text });
    setToast(res.body.ok ? 'mandate saved — it is read at the start of every session' : (res.body.message || 'could not save'));
    loadRoleDetail(roleOpen);
    loadRoles();
  }, [roleOpen, post, loadRoleDetail, loadRoles]);

  const loadBrief = useCallback(async (target) => {
    if (!target) { setBrief(null); return; }
    try {
      const r = await fetch('/api/brief?kind=' + encodeURIComponent(target.kind) + '&id=' + encodeURIComponent(target.id));
      const body = await r.json();
      setBrief(r.ok ? body : { error: body.error || ('brief ' + r.status) });
    } catch (e) { setBrief({ error: String(e.message) }); }
  }, []);
  useEffect(() => { loadBrief(briefOpen); }, [briefOpen, loadBrief]);

  useEffect(() => {
    if (!briefOpen) return undefined;
    const onKey = (e) => { if (e.key === 'Escape') setBriefOpen(null); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [briefOpen]);

  // Optimistic, then reconciled. A checkbox that waits for a round trip feels broken, and a
  // checkbox that never reconciles lies when the write failed.
  const toggleCheck = useCallback(async (checkKey, value) => {
    if (!brief?.itemKey) return;
    setBrief((b) => (b ? { ...b, progress: { ...b.progress, checked: { ...b.progress.checked, [checkKey]: value ? new Date().toISOString() : undefined }, blockingDone: b.progress.blockingDone + (value ? 1 : -1) } } : b));
    const res = await post('/api/check', { itemKey: brief.itemKey, checkKey, value });
    if (!res.ok || res.body.ok === false) setToast(res.body.message || 'could not save that tick');
    await loadBrief(briefOpen);

  }, [brief, briefOpen, post, loadBrief, loadOwed]);

  const saveNote = useCallback(async (checkKey, text) => {
    if (!brief?.itemKey) return;

    await loadBrief(briefOpen);
  }, [brief, briefOpen, post, loadBrief]);

  const signOff = useCallback(async (id) => {
    if (!window.confirm('Sign off spec ' + id + '?\n\nThis creates an annotated git tag signed-off/' + id + '. The driver reads that tag and frees its founder-review slot, so the loop will open the next spec.')) return;
    setBusy(true);
    const res = await post('/api/signoff', { id });
    setToast(res.body.message || (res.ok ? 'signed off' : 'sign-off refused'));
    setBusy(false);
    await loadBrief(briefOpen);
    await loadOwed();
    load();
  }, [briefOpen, post, loadBrief, loadOwed, load]);

  // Prompt and summary are too big to push on every frame, so they are fetched once when an
  // agent is opened; the trace then streams into it from the feed.
  useEffect(() => {
    if (!openId) { setOpenDetail(null); return undefined; }
    let alive = true;
    fetch('/api/agent?id=' + encodeURIComponent(openId))
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => { if (alive) setOpenDetail(d); })
      .catch(() => { /* the sheet still shows what the feed already gave us */ });
    return () => { alive = false; };
  }, [openId]);

  useEffect(() => {
    if (!openId) return undefined;
    const onKey = (e) => { if (e.key === 'Escape') setOpenId(null); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [openId]);
  useEffect(() => { if (!toast) return; const id = setTimeout(() => setToast(null), 7000); return () => clearTimeout(id); }, [toast]);

  const act = async (name, confirmMsg) => {
    if (confirmMsg && !window.confirm(confirmMsg)) return;
    setBusy(true);
    try {
      const r = await fetch('/api/action/' + name, { method: 'POST', headers: { 'X-Loop-Token': TOKEN } });
      const j = await r.json();

    } catch (e) { setToast('failed: ' + e.message); }
    setBusy(false);
    load();
  };


  /* ── the deck's own wiring ───────────────────────────────────────
     Everything below is a hook, so it sits above the two early returns: a hook
     called conditionally is a hook that changes order between renders, and React
     will take the whole page down for it. */

  const cycleTheme = useCallback(() => {
    setThemeMode(THEME_ORDER[(THEME_ORDER.indexOf(themeMode) + 1) % THEME_ORDER.length]);
  }, [themeMode, setThemeMode]);

  /** Scroll a deck column to the top of its own scroller — the deck never scrolls the page. */
  const jumpTo = useCallback((id) => {
    const el = document.getElementById(id);
    if (!el) return;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest', inline: 'nearest' });
    el.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  }, []);

  const copyRestart = useCallback(() => {
    const cmd = 'node "C:/Users/ASUS/Desktop/claude work/spicyspec/packages/runner/dist/bin.js" dashboard --config ' +
      ((s && s.driver && s.driver.config) ? s.driver.config : '<your runner config>') + ' --port ' + window.location.port;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(cmd).then(() => setToast('restart command copied')).catch(() => setToast(cmd));
    } else setToast(cmd);
  }, [s]);

  /* C3 — the digest. Composed only when it is actually opened: it reads the whole
     journal window, and doing that on every 4-second push would be the page paying
     for a report nobody asked for. */
  const digest = useMemo(() => {
    if (!digestOpen || !s) return null;
    return callMod(mods.inst, 'digestDiff', [
      { at: lastSeen.seenAt },
      { at: Date.now(), state: s, journal: jr.journal, transitions: jr.transitions, range: jr.range },
    ], null);
  }, [digestOpen, s, mods.inst, lastSeen.seenAt, jr.journal, jr.transitions, jr.range]);

  /* C6 — everything the deck can do, as one list. The palette is the only surface
     that has to enumerate the console, which makes it the honest inventory of it. */
  const paletteItems = useMemo(() => {
    const out = [];
    const add = (group, label, run) => out.push({ id: group + '|' + label, group, label, run });
    add('run', 'Start the loop', () => act('start'));
    add('run', 'Pause after this tick', () => act('stop'));
    add('run', 'Kill the worker now', () => act('kill', 'Kill the running worker now? Uncommitted work in this tick may be lost.'));
    add('run', 'Clear the stop flag', () => act('resume'));
    add('run', 'Write a report', () => act('report'));
    add('view', 'Overview', () => setTab('overview'));
    add('view', 'Agents', () => setTab('agents'));
    add('view', 'History', () => setTab('history'));
    add('view', 'Management', () => setTab('management'));
    for (const m of THEME_ORDER) add('theme', 'Theme: ' + m, () => setThemeMode(m));
    for (const d of DENSITIES) add('density', 'Density: ' + d, () => setDensity(d));
    add('deck', 'Acknowledge every annunciator', () => ackAll(s ? annSlots(s, annCtxRef.current, mods.inst) : []));
    add('deck', 'Notification rules — the night bell', () => setBellOpen(true));
    add('deck', 'While you slept — the digest', () => setDigestOpen(true));
    add('deck', 'Keyboard shortcuts', () => setShortcutsOpen(true));
    add('deck', 'Open the raw ledger', () => jumpTo('deck-record'));
    add('deck', 'Copy the dashboard restart command', copyRestart);
    for (const [id, label] of WIRE_FILTERS) add('wire', 'Wire: ' + label, () => { setWireFilter(id); jumpTo('deck-record'); });
    for (const e of (s && s.catalog && s.catalog.entries) || []) {
      add('spec', 'Spec ' + e.id + (e.slug ? ' · ' + e.slug : '') + ' — ' + e.status, () => setBriefOpen({ kind: 'spec', id: e.id }));
    }
    for (const r of roles) add('role', 'Talk to ' + r.name, () => setRoleOpen(r.id));
    return out;
  }, [s, roles, mods.inst, ackAll, copyRestart, jumpTo, setThemeMode, setDensity]);

  /* The annunciator context, in a ref so the palette's ack-all can read the current
     signatures without the whole list re-memoising four times a minute. */
  const annCtxRef = useRef({ link: 'connecting', lastFrameAt: null, owedCount: 0, cadenceVerdict: 'unknown' });

  /* C5 — the installable console. The service worker caches the SHELL only and never
     /api/*, so an offline window paints the instrument frame and says outright that
     it has no state — which is the one thing a cached dashboard must never fake. */
  useEffect(() => {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.register('/sw.js').catch(() => { /* not shipped yet: the page is unaffected */ });
  }, []);

  /* The keyboard. Single-letter keys are deliberately unmodified — this is a console
     the founder keeps focused for hours — and every one of them bails out the moment
     a text field has focus, so typing into the chat can never arm a stop flag. */
  useEffect(() => {
    const onKey = (e) => {
      const tag = (e.target && e.target.tagName) || '';
      const typing = tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable);
      if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); setPaletteOpen((v) => !v); return; }
      if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === '?') { setShortcutsOpen(true); return; }
      if (e.key === 'a') { ackAll(s ? annSlots(s, annCtxRef.current, mods.inst) : []); return; }
      if (e.key === 't') { cycleTheme(); return; }
      if (e.key === 'd') { cycleDensity(); return; }
      if (e.key === 'w') { setDigestOpen(true); return; }
      if (e.key === 'b') { setBellOpen(true); return; }
      // The rail scrub moves the 24h WINDOW rather than replaying the console from a
      // snapshot: a full time-scrub would mean every component rendering from a passed-in
      // state object, which is an architectural refactor of a live 158KB page. Moving the
      // window is honest, useful, and cannot desynchronise an instrument from its source.
      if (e.key === '[') { setRailOffset((n) => n - 900000); return; }
      if (e.key === ']') { setRailOffset((n) => Math.min(0, n + 900000)); return; }
      if (e.key === '1') setTab('overview');
      else if (e.key === '2') setTab('agents');
      else if (e.key === '3') setTab('history');
      else if (e.key === '4') setTab('management');
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [s, mods.inst, ackAll, cycleTheme, cycleDensity]);

  if (err && !s) return h('div', { className: 'nojs' }, h('strong', null, 'Cannot reach the server. '), err,
    h('p', { className: 'mono' }, 'Start it with: node .specify/loop/ui/server.mjs'));
  if (!s) return h('div', { className: 'nojs' }, 'reading loop state…');

  const c = s.catalog;
  // WORKING versus NOT WORKING, derived on the server (room-server topLine) so the poll, the
  // SSE frames and the tests all read one sentence. The chip used to be computed here from
  // `s.running`, which is a fresh runner HEARTBEAT and nothing more: it said 'running' for
  // eight hours while the rotation was cancelled and a stop flag sat armed. A heartbeat is now
  // necessary and never sufficient — a lane in flight is what working means, and every other
  // state carries the reason it is not.
  const top = s.activity || { state: s.running ? 'WORKING' : 'STOPPED', reason: null, tone: s.running ? 'on' : 'off' };
  const armed = s.killFlag || s.stopFlag || null;
  // Stated beside feed health, for the same reason feed health is stated beside loop health:
  // an unwatched loop and a watched one look identical on a page that shows only the loop.
  const unsupervised = Boolean(s.health && s.health.supervisor && !s.health.supervisor.reporting);

  const byId = new Map(live.agents.map((a) => [a.id, a]));
  // Dispatched work only, for every count and statistic: the worker is not its own subagent,
  // and including it would inflate "agents" by one forever.
  const realAgents = live.agents.filter((a) => a.kind !== 'session');
  const liveCount = realAgents.filter((a) => a.status === 'running').length;
  // The grid does show it, first and always. It is agent zero — the thing that dispatched
  // everything else — and leaving it out made the one agent that is always working the only
  // one you could not open.
  const gridAgents = live.agents.filter((a) => a.kind === 'session').concat(realAgents);
  const worker = live.agents.find((a) => a.kind === 'session') || null;
  const workerBusy = Boolean(worker && worker.status === 'running');

  // The split the whole tab hinges on. A tick dispatched 24 background commands and had 2
  // things actually running; showing all 26 as equal cards buried the 2 that mattered and
  // grew without bound for the length of the tick. Live is what is running RIGHT NOW and can
  // still change the tree. Everything else is a record.
  const liveNow = gridAgents.filter((a) => a.status === 'running');
  const liveDispatched = liveNow.filter((a) => a.kind !== 'session').length;
  const pastAll = gridAgents.filter((a) => a.status !== 'running').slice().reverse();
  const pastFiltered = pastAll.filter((a) =>
    histFilter === 'agents' ? a.kind === 'local_agent'
      : histFilter === 'commands' ? a.kind === 'local_bash'
        : true);
  const pastShown = pastFiltered.slice(0, histLimit);
  const openAgent = openDetail || byId.get(openId) || null;
  const openLog = (live.trace.get(openId) || []);

  const feedLink = live.link === 'live'
    ? ['on', 'live feed']
    : live.link === 'reconnecting' ? ['warn', 'feed reconnecting'] : ['off', 'feed connecting'];

  // Owed drives the marquee's one red affordance, so it is counted once, here, from the same
  // list the panel renders — two places counting the same debt is how one of them goes stale.
  const owedItems = owed.length
    ? owed
    : c.awaitingFounder.map((id) => ({ kind: 'spec', id, key: 'spec-' + id, title: 'Spec ' + id + ' — clicked founder journey' }));
  // Everything the annunciator bar needs that is NOT in the state payload: the feed's own
  // health, when the last frame actually landed, the debt count, and the cadence verdict —
  // which is the one input to that bar the server cannot supply, because only this page
  // watched the frames. Mirrored into a ref so the palette's ack-all and the `a` key can
  // read the current signatures without re-memoising the whole command list every 4 seconds.
  const cadNow = cadenceOf(ring, Date.now());
  const annCtx = {
    link: live.link,
    lastFrameAt: live.lastAt,
    owedCount: owedItems.length,
    cadenceVerdict: cadNow.verdict,
  };
  annCtxRef.current = annCtx;

  return h('div', { className: 'deckwrap' },
    // ── Z0 — THE ANNUNCIATOR BAR ────────────────────────────────────
    // Eight slots in a fixed order, then the console's own controls. It is the
    // only element on the page that is drag-region in a Window Controls Overlay
    // install, which is what makes the deck a window rather than a tab.
    h('div', { className: 'annbar z-bar' },
      h(Annunciators, {
        s, ctx: annCtx, inst: mods.inst, acks,
        onAck: ackOne,
        onSlot: (id) => {
          if (id === 'OWED' || id === 'PARK') jumpTo('deck-act');
          else if (id === 'GATE') jumpTo('deck-machine');
          else if (id === 'RATE') jumpTo('deck-pfd');
        },
      }),
      h('div', { className: 'annright' },
        h('button', {
          type: 'button', className: 'ann ' + (bell.perm === 'denied' ? 'alarm denied' : bell.perm === 'granted' ? 'nominal' : 'nominal'),
          title: bell.perm === 'granted' ? 'notifications on — open the rules'
            : bell.perm === 'denied' ? 'notifications DENIED by this browser for 127.0.0.1 — no rule can fire'
              : 'notifications off — click to see the rules and turn them on',
          onClick: () => setBellOpen(true),
        }, h('i', { className: 'lamp' }), bell.perm === 'granted' ? 'BELL ON' : bell.perm === 'denied' ? 'BELL DENIED' : 'BELL OFF'),
        h('button', {
          type: 'button', className: 'ann nominal', title: 'theme — auto follows the machine',
          onClick: cycleTheme,
        }, 'THEME ' + themeMode.toUpperCase()),
        h('button', {
          type: 'button', className: 'ann nominal', title: 'density — console is the deck default, wall is a room-scale readout',
          onClick: cycleDensity,
        }, density.toUpperCase()),
        h('span', { className: 'ann nominal', title: shell === 'deck' ? 'the fixed instrument deck' : 'the viewport is too small for the deck — the watch rail and the ticker are withdrawn rather than squeezed' },
          shell === 'deck' ? 'DECK' : 'DOC'),
        h('button', { type: 'button', className: 'ann nominal', onClick: () => setPaletteOpen(true), title: 'command palette' },
          h('span', { className: 'keycap' }, isMac ? '⌘K' : 'Ctrl K')))),

    // ── Z0b — THE DOCK ──────────────────────────────────────────────
    // DEVIATION, stated: the eight-slot bar has no room for the tab strip or the
    // five control actions, and neither may be deleted, so they get 34px of their own.
    h('div', { className: 'deckdock z-dock' },
      h('span', { className: 'docktitle' }, 'LOOP'),
      h('div', { className: 'tabs', role: 'group', 'aria-label': 'View' },
        h('button', { type: 'button', 'aria-pressed': tab === 'overview' ? 'true' : 'false', onClick: () => setTab('overview') }, 'Overview'),
        h('button', { type: 'button', 'aria-pressed': tab === 'agents' ? 'true' : 'false', onClick: () => setTab('agents') },
          'Agents',
          // Never a bare zero. "0" beside a worker that is plainly running reads as "this view
          // is broken", and in effect it was: it counted only DISPATCHED agents, so a worker
          // doing the job itself — which is most of a shape stage — showed nothing at all.
          h('span', { className: 'badge' }, agentBadge(liveCount, realAgents.length, workerBusy))),
        h('button', { type: 'button', 'aria-pressed': tab === 'history' ? 'true' : 'false', onClick: () => setTab('history') },
          'History', h('span', { className: 'badge' }, String(pastAll.length))),
        h('button', { type: 'button', 'aria-pressed': tab === 'management' ? 'true' : 'false', onClick: () => setTab('management') },
          'Management',
          h('span', { className: 'badge' },
            roles.some((r) => r.busy) ? 'talking' : String(roles.length || 3)))),
      h('div', { className: 'controls' },
        h('button', { className: 'go', disabled: busy || s.running, onClick: () => act('start') }, 'Start'),
        h('button', { className: 'warn', disabled: busy || !s.running, onClick: () => act('stop') }, 'Pause after tick'),
        h('button', { className: 'danger', disabled: busy || !s.running, onClick: () => act('kill', 'Kill the running worker now? Uncommitted work in this tick may be lost.') }, 'Kill now'),
        (s.stopArmed || s.killArmed) && h('button', { disabled: busy, onClick: () => act('resume') }, 'Clear stop'),
        h('button', { disabled: busy, onClick: () => act('report') }, 'Report'))),

    // ── Z1 — THE PFD ────────────────────────────────────────────────
    // Always drawn, on every tab. The glance must not depend on which view the
    // founder happened to leave open, and switching to Agents must not cost them
    // the answer to "is it stuck".
    h('div', { className: 'z-pfd', id: 'deck-pfd' },
      !navigator.onLine && h('div', { className: 'offline-bar' },
        'showing the shell only — this browser is offline, so nothing below is newer than ' +
        (live.lastAt ? new Date(live.lastAt).toTimeString().slice(0, 8) : 'the last frame it saw')),
      // C3 — the handover card. It precedes the PFD because on the morning it
      // matters it is the only thing on this page the founder wants.
      lastSeen.gapMs > 1200000 && h('div', { className: 'handover' },
        h('span', { className: 'hl' }, 'You were away ' + spanShort(lastSeen.gapMs) + '.'),
        h('span', { className: 'mono', style: { fontSize: '0.74rem', color: 'var(--text-soft)' } },
          jr.range && jr.range.coverage != null
            ? 'the room watched ' + Math.round(jr.range.coverage * 100) + '% of the last 24h'
            : 'coverage of that span is unknown — the journal is not reporting'),
        h('button', { type: 'button', className: 'go', onClick: () => setDigestOpen(true) }, 'What happened'),
        h('button', { type: 'button', onClick: lastSeen.clear }, 'Dismiss')),
      h('div', { className: 'pfd' },
        h(PfdState, { s, top, samples: ring, inst: mods.inst }),
        h(PfdLane, { s, samples: ring, inst: mods.inst }),
        h(PfdBurn, { s, inst: mods.inst }),
        h(PfdRunway, { s, inst: mods.inst }))),

    // ── Z2 — ALARMS. Zero height when there is nothing wrong. ───────
    h('div', { className: 'z-alarm' },
      h(Alarms, { s, inst: mods.inst, onWire: () => { setWireFilter('all'); jumpTo('deck-record'); } })),

    // ── Z3 — THE CONSOLE GRID ───────────────────────────────────────
    h('div', { className: 'z-grid' },
      tab === 'overview' && h('div', { className: 'deckgrid' },
        h(ActColumn, { s, owedItems, inst: mods.inst, onOpen: setBriefOpen }),
        h(MachineColumn, { s, inst: mods.inst, onSpec: (id) => setBriefOpen({ kind: 'spec', id }) }),
        h(RecordColumn, {
          s, inst: mods.inst, journal: jr.journal, seenAt: lastSeen.seenAt,
          wireFilter, onWireFilter: setWireFilter, wireOpen, onWireOpen: setWireOpen,
        },
          // Everything the previous build showed, kept and ranked below the record
          // rather than deleted. A disclosure moves a panel down the page; it never
          // removes a field, and every one of these is still in the DOM for ctrl-F.
          h('div', { className: 'pane' },
            h(Health, { health: s.health, open: healthOpen, onToggle: () => setHealthOpen((v) => !v) })),
          h('div', { className: 'pane' },
            h(TreeStrip, { git: s.git, open: treeOpen, onToggle: () => setTreeOpen((v) => !v) })),
          h('div', { className: 'pane' },
            h(Accounts, { accounts: s.accounts, events: s.accountEvents })),
          h('details', { className: 'morebox pane' },
            h('summary', null, 'open the raw ledger — all ' + (s.ticks || []).length + ' runs the state feed carries'),
            h(Ticks, { ticks: s.ticks })),
          h('footer', { style: { marginTop: '0.6rem' } },
            'Reads the driver\'s state files and signals it back through files — closing this page never stops a build. ',
            'Loopback bind + host allowlist + cross-site rejection + a per-start control token. Terminal equivalent: ', h('code', null, 'pnpm my-spec'),
            ' · updated ', ago(s.at)))),

      tab === 'agents' && h('div', { className: 'tabpane' },
        h('div', { className: 'grid cols-2', style: { marginBottom: '1.1rem', marginTop: '0.6rem' } },
          h(Panel, { title: 'Where we are', sub: live.meta ? 'tick ' + live.meta.number + ' · ' + live.meta.spec + '/' + live.meta.stage : 'no tick' },
            h(WherePanel, { where: live.where })),
          h(Panel, { title: 'Fan-out', sub: 'this tick' },
            // The worker's own tool count leads, because it is the only figure here that is
            // never zero while a tick is alive. All four columns read zero on a running loop
            // during a shape stage, which is precisely when nothing gets dispatched.
            h('div', { className: 'statrow' },
              h(Stat, { n: worker ? worker.toolUses : 0, l: 'worker tools' }),
              h(Stat, { n: realAgents.filter((a) => a.kind === 'local_agent').length, l: 'agents' }),
              h(Stat, { n: liveCount, l: 'working now' }),
              h(Stat, { n: realAgents.filter((a) => a.kind === 'local_bash').length, l: 'commands' })),
            h('div', { className: 'agent-meta', style: { marginTop: '0.9rem' } },
              worker && worker.contextTokens > 0 &&
                h('span', null, 'worker context ' + Math.round(worker.contextTokens / 1000) + 'k'),
              h('span', null, 'depth ' + live.agents.reduce((d, a) => Math.max(d, a.depth), 0)),
              h('span', null, (live.counts.completed || 0) + ' returned'),
              (live.counts.stopped || 0) > 0 && h('span', null, live.counts.stopped + ' cancelled'),
              (live.counts.failed || 0) > 0 && h('span', { style: { color: 'var(--hot)', fontWeight: 700 } }, live.counts.failed + ' failed'),
              // SUBAGENT tokens by name: the runtime reports a total per subagent and none for
              // the worker, so one combined number would be two different measurements added
              // together and presented as one.
              h('span', null, Math.round(realAgents.reduce((n, a) => n + (a.tokens || 0), 0) / 1000) + 'k subagent tokens')),
            // A zero always gets a sentence. "0 agents" next to "5 commands" is accurate and
            // still looks broken, so each shape of emptiness says why it is empty.
            h('div', { className: 'where-src' },
              realAgents.length === 0
                ? 'Nothing dispatched yet this tick — the worker is doing the job itself, which is normal for a shape stage.'
                : realAgents.filter((a) => a.kind === 'local_agent').length === 0
                  ? 'No subagent out: the worker is running background commands itself, not delegating.'
                  : 'A cancelled command is not a failure — the worker stopped waiting on it deliberately.'))),

        h(Panel, {
          title: 'Working now',
          // Counts DISPATCHED agents, matching the tab badge exactly. The first version counted
          // the cards on screen, which includes the worker, so the badge said "1 live" beside a
          // panel saying "2 live" — two numbers for one fact, which is the bug I keep fixing.
          sub: liveNow.length === 0
            ? 'nothing running'
            : (liveDispatched === 0 ? 'the worker alone' : liveDispatched + ' live') +
              ' · ' + pastAll.length + ' returned, in History',
        },
          liveNow.length === 0
            ? h('div', { className: 'mono', style: { fontSize: '0.72rem', color: 'var(--text-dim)' } },
                live.link === 'live'
                  ? 'Nothing is running. The tick has ended, or the loop is between ticks — everything it did is in History.'
                  : 'Waiting for the feed…')
            : h('div', { className: 'agentgrid' },
                // Index is the agent's position in the tick's spawn order, not its position in
                // this list, so a card keeps the same number as things finish around it.
                liveNow.map((a) => h(AgentCard, {
                  key: a.id, a, index: gridAgents.indexOf(a), parent: byId.get(a.parentId),
                  selected: a.id === openId, onOpen: setOpenId,
                }))))),

      tab === 'management' && h('div', { className: 'tabpane' },
        h(Panel, {
          title: 'Management',
          sub: 'three sessions you can talk to · click one to open its chat',
        },
          h('p', { style: { fontSize: '0.86rem', lineHeight: 1.5, marginTop: 0 } },
            'The loop had one overseer and nothing checked it, which is how 006 came to be marked ' +
            'built when it had never been started. The manager exists to disagree with the supervisor ' +
            'when the evidence says so; the special agent is yours.'),
          h('div', { className: 'rolegrid' },
            (roles.length ? roles : []).map((r) => h(RoleCard, {
              key: r.id, role: r,
              live: roleSteps[r.id] || [],
              selected: r.id === roleOpen,
              onOpen: setRoleOpen,
            }))),
          roles.length === 0 && h('div', { className: 'mono', style: { fontSize: '0.72rem', color: 'var(--text-dim)' } },
            'Could not read the roles. Is the server on the current code?'),
          h('div', { className: 'where-src', style: { marginTop: '0.9rem' } },
            'Each message is a real Claude Code session turn against this repo — same tooling as the ' +
            'workers, and it costs quota. Supervisor and manager are read-only on purpose: an auditor ' +
            'that can edit what it audits is not an auditor.'))),

      tab === 'history' && h('div', { className: 'tabpane' }, h(Panel, {
        title: 'History',
        sub: pastAll.length + ' returned this tick' + (live.meta ? ' (tick ' + live.meta.number + ')' : ''),
      },
        h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '0.6rem', alignItems: 'center', marginBottom: '0.7rem' } },
          h('div', { className: 'theme-seg', role: 'group', 'aria-label': 'Filter history' },
            [['all', 'All'], ['agents', 'Agents'], ['commands', 'Commands']].map(([id, label]) =>
              h('button', {
                key: id, type: 'button',
                'aria-pressed': histFilter === id ? 'true' : 'false',
                onClick: () => { setHistFilter(id); setHistLimit(25); },
              }, label))),
          // Three numbers because there are three: rendered, matching the filter, and total.
          // "28 shown of 28" was printed while 25 rows were on screen — a silent cap is the one
          // thing a history view must never do, since it reads as "this is everything".
          h('span', { className: 'mono', style: { fontSize: '0.66rem', color: 'var(--text-dim)' } },
            pastShown.length + ' shown' +
            (pastFiltered.length !== pastShown.length ? ' of ' + pastFiltered.length + ' matching' : '') +
            (pastFiltered.length !== pastAll.length ? ' · ' + pastAll.length + ' total' : ''))),

        pastFiltered.length === 0
          ? h('div', { className: 'mono', style: { fontSize: '0.72rem', color: 'var(--text-dim)' } },
              pastAll.length === 0
                ? 'Nothing has returned yet this tick.'
                : 'Nothing of that kind this tick — ' + pastAll.length + ' other entries are under All.')
          : h(React.Fragment, null,
              h('ul', { className: 'hist' }, pastShown.map((a) => h('li', { key: a.id },
                h('button', {
                  className: 'histrow ' + a.status,
                  'aria-current': a.id === openId ? 'true' : 'false',
                  onClick: () => setOpenId(a.id),
                },
                  h('i', { className: 'sdot ' + a.status }),
                  h('span', { className: 'hname' }, agentLabel(a)),
                  h('span', { className: 'hdesc' }, a.description),
                  h('span', { className: 'hstat' }, AGENT_STAT(a).join(' · ') || a.status))))),
              // Never silently truncate: say what is hidden and offer it.
              pastFiltered.length > pastShown.length && h('button', {
                className: 'linkish', style: { marginTop: '0.6rem' },
                onClick: () => setHistLimit(pastFiltered.length),
              }, 'show ' + (pastFiltered.length - pastShown.length) + ' older'))))),

    // ── Z4 — THE WATCH RAIL ─────────────────────────────────────────
    h(WatchRail, {
      range: jr.range,
      onMark: (m) => { setWireFilter('all'); setWireOpen(m.wireId || null); jumpTo('deck-record'); },
    }),

    // ── Z5 — THE TICKER ─────────────────────────────────────────────
    h(Ticker, { lanes: (s.lanes && s.lanes.length) ? s.lanes : (s.live ? [s.live] : []), reason: top.reason }),

    // ── Z6 — THE TELEMETRY BUS ──────────────────────────────────────
    h(Bus, {
      s, link: live.link, lastFrameAt: live.lastAt, bell: bell.perm,
      modErrors: mods.errors, offline: !navigator.onLine,
    }),

    // ── OVERLAYS ────────────────────────────────────────────────────
    paletteOpen && h(Palette, { items: paletteItems, onClose: () => setPaletteOpen(false) }),
    shortcutsOpen && h(Shortcuts, { onClose: () => setShortcutsOpen(false) }),
    bellOpen && h(BellSheet, {
      perm: bell.perm, enabled: bell.enabled, quiet: bell.quiet, journalReady: Boolean(jr.journal),
      onToggle: bell.toggle, onQuiet: bell.setQuietHours, onAsk: bell.ask,
      onTest: (rule) => { const ok = bell.test(rule); setToast(ok ? 'test notification sent — if nothing appeared, the OS is suppressing it' : 'the bell could not fire: ' + (bell.perm === 'granted' ? 'quiet hours are on and this rule is not critical' : 'permission is ' + bell.perm)); },
      onClose: () => setBellOpen(false),
    }),
    digestOpen && h(Digest, {
      digest, sinceAt: lastSeen.seenAt,
      onClose: () => { setDigestOpen(false); lastSeen.clear(); },
      onWire: (id) => { setWireFilter('all'); setWireOpen(id); jumpTo('deck-record'); },
    }),

    roleOpen && h(ChatSheet, {
      role: roles.find((r) => r.id === roleOpen) || null,
      detail: roleDetail,
      liveSteps: roleSteps[roleOpen] || [],
      partial: rolePartial[roleOpen] || '',
      draft, onDraft: setDraft,
      onSend: sendToRole, onTask: queueRoleTask, onMandate: saveMandate,
      onClose: () => setRoleOpen(null),
      busy,
    }),

    briefOpen && h(BriefSheet, {
      brief, busy,
      onToggle: toggleCheck, onNote: saveNote, onSignoff: signOff,
      onClose: () => setBriefOpen(null),
    }),

    openAgent && h(AgentSheet, {
      a: openAgent,
      parent: byId.get(openAgent.parentId),
      children: (openAgent.children || []).map((id) => byId.get(id)).filter(Boolean),
      log: openLog,
      onClose: () => setOpenId(null),
    }),

    toast && h('div', { className: 'toast', role: 'status' }, toast));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
