<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loop Control Room</title>
<script>
/* Resolve the theme BEFORE first paint. Without this the page renders cream and then snaps
   to the night panel, which on a dashboard you leave open all day is the single most
   irritating thing a theme can do. Inline and synchronous in <head> is what makes it
   invisible; a module or a deferred script is already too late. */
(function () {
  var KEY = 'loop-theme';
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { /* private mode: auto it is */ }
  var mode = (saved === 'light' || saved === 'dark' || saved === 'auto') ? saved : 'auto';
  var dark = mode === 'dark' ||
    (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  window.__loopTheme = { key: KEY, mode: mode };
})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23EDE4CC'/%3E%3Crect x='3' y='3' width='26' height='26' fill='none' stroke='%231A1A1A' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23D62828'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts are stylesheets: they cannot execute, so a remote load here is not a
     process-control risk. If the machine is offline the stack falls back to system-ui. -->
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=JetBrains+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ==================================================================
   Built to the she3bo V2 constitution, which is LOCKED:
     1. The paper is sacred — cream #EDE4CC, never white, never black.
     2. Three colours only — paper, ink, shatta red. Plus tonal siblings.
     3. Manga sketch, not corporate flat — ink linework, hard offsets.
     4. Locked typography — Bangers display, Zen Kaku Gothic New body, JetBrains Mono
        data. Inter is only the body FALLBACK, never the primary face.
     5. Function survives style — works at 320px, readable without JS.
   Flame is used ONLY for warning states, so heat means something.

   On directive 1 and the night theme: "the paper is sacred" governs the PAPER
   STOCK, and dark mode does not repaint it — it reverses the drawing out, which
   the system already sanctions per block (DESIGN.md: "Reverse-out text on dark
   blocks"). No thirteenth colour is introduced; see THE ROLE LAYER below.
   ================================================================== */
:root {
  --paper:        #EDE4CC;
  --paper-shadow: #D4C9A8;
  --paper-grain:  #E5DBC0;
  --paper-deep:   #C9BD9A;
  --ink:          #1A1A1A;
  --ink-soft:     #4A4A4A;
  --ink-muted:    #2D2620;
  --ink-faded:    #6B5F50;
  --shatta:       #D62828;
  --shatta-deep:  #B71D1D;
  --flame:        #F77F00;
  --flame-soft:   #FCBF49;

  --font-display: 'Bangers', 'Anton', system-ui, sans-serif;
  --font-body: 'Zen Kaku Gothic New', 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  --ink-thin: 1px; --ink-medium: 2px; --ink-thick: 3px; --ink-bold: 5px;
  --ease-hover: cubic-bezier(0.33, 1, 0.68, 1);
  --gutter: clamp(0.75rem, 3vw, 1.75rem);
}

/* ── THE ROLE LAYER ───────────────────────────────────────────────────
   The twelve colours above are constants and are never redefined. A theme
   changes only which colour plays which ROLE. That distinction is what
   keeps directive 2 intact: dark mode adds no thirteenth colour.

   Dark mode is not a second palette, it is the same drawing reversed out —
   white ink on a night panel. The locked system already sanctions the move
   for individual blocks (DESIGN.md: "Reverse-out text on dark blocks");
   this is that rule at page scale.

   Every rule below this line uses roles, never raw brand tokens, with two
   deliberate exceptions: a saturated shatta or flame FILL keeps its brand
   value in both themes (heat should not go pastel at night), and the text
   sitting on such a fill is always cream.
   ------------------------------------------------------------------ */
:root {
  color-scheme: light;
  --page:         var(--paper);
  --grain-a:      var(--paper-deep);
  --grain-b:      var(--paper-shadow);
  --surface:      var(--paper-grain);   /* panel fill */
  --surface-alt:  var(--paper);         /* controls and insets inside a panel */
  --surface-sunk: var(--paper-shadow);  /* a recessed or sidelined thing */
  --line:         var(--ink);           /* linework: every border */
  --line-soft:    var(--ink-soft);
  --hairline:     var(--paper-deep);    /* 1px separators, dashed rules */
  --text:         var(--ink);
  --text-soft:    var(--ink-soft);
  --text-dim:     var(--ink-faded);     /* mono labels, column heads */
  --offset:       var(--ink);           /* the hard manga drop, directive 3 */
  --fill-solid:   var(--ink);           /* filled bars, primary button, toast */
  --inert:        var(--paper-deep);    /* a dot that means "nothing happening" */
  --on-fill:      var(--paper);         /* text on a saturated shatta fill */
  --on-warm:      var(--ink);           /* text on a flame-soft fill. Constant in BOTH themes:
                                           the fill is bright either way, so cream on it is
                                           1.31:1 — the one thing reverse-out must not do. */
  --hot:          var(--shatta);        /* accent as TEXT, not as fill */
  --hot-deep:     var(--shatta-deep);
  --warn-text:    var(--flame);
  --hatch:        rgba(26, 26, 26, 0.28);
  --row-bad:      rgba(214, 40, 40, 0.09);
  --row-warn:     rgba(247, 127, 0, 0.10);

  --shadow:    4px 4px 0 0 var(--offset);
  --shadow-sm: 3px 3px 0 0 var(--offset);
  --shadow-red:4px 4px 0 0 var(--shatta);
}

/* Night panel. There is deliberately no `prefers-color-scheme` block: the inline script in
   <head> resolves the system preference and always writes an explicit data-theme before
   first paint, so one source of truth beats two that can disagree. */
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:         var(--ink);
  --grain-a:      var(--ink-faded);     /* screentone. Warmer and bolder than the light
                                           grain on purpose: the same 0.5px dot reads much
                                           fainter against ink than against paper. */
  --grain-b:      var(--ink-soft);
  --surface:      var(--ink-muted);     /* warm brown-black, so panels stay warm paper-stock
                                           in feel rather than going cold grey */
  --surface-alt:  var(--ink);
  --surface-sunk: var(--ink-muted);
  --surface-sunk: color-mix(in oklab, var(--shatta) 16%, var(--ink));
  --line:         var(--paper);         /* white ink */
  --line-soft:    var(--ink-faded);
  --hairline:     var(--ink-soft);
  --text:         var(--paper);
  --text-soft:    var(--paper-shadow);
  --text-dim:     var(--paper-deep);
  --offset:       var(--paper-deep);    /* Directive 3 is hard offsets, and this is the token
                                           that carries it. Light mode drops ink on paper at
                                           13.7:1, so a faithful reverse-out has to drop paper
                                           on ink at comparable strength — anything subtle
                                           flattens every panel into a plain outlined box.
                                           Screenshot-compared against a dim warm drop at
                                           2.8:1: that version lost the sticker pop entirely.
                                           paper-deep rather than full paper keeps the border
                                           dominant, so the shape still reads before the
                                           shadow does. */
  --fill-solid:   var(--paper);
  --inert:        var(--ink-soft);

  /* Accent-as-text has to be lifted or it is unreadable: raw shatta on the panel fill is
     2.7:1 and shatta-deep is 1.9:1. These are tints of the same red, which is exactly what
     the locked palette means by a tonal sibling — shatta-deep is its shade. Each is declared
     twice so a browser without color-mix() still gets a legible value. */
  --hot:          #E8836F;
  --hot:          color-mix(in oklab, var(--shatta) 58%, var(--paper));
  --hot-deep:     #E4735F;
  --hot-deep:     color-mix(in oklab, var(--shatta) 64%, var(--paper));
  --warn-text:    #F9A64A;
  --warn-text:    color-mix(in oklab, var(--flame) 74%, var(--paper));

  --hatch:        rgba(26, 26, 26, 0.42);
  --row-bad:      rgba(214, 40, 40, 0.20);
  --row-warn:     rgba(247, 127, 0, 0.18);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background-color: var(--page);
  /* paper grain — halftone dots, not a gradient. Directive 1 & 3. */
  background-image:
    radial-gradient(var(--grain-a) 0.5px, transparent 0.5px),
    radial-gradient(var(--grain-b) 0.5px, transparent 0.5px);
  background-size: 14px 14px, 22px 22px;
  background-position: 0 0, 7px 11px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding: var(--gutter);
  min-height: 100vh;
}

h1, h2, h3, .display {
  font-family: var(--font-display);
  font-weight: 400;
  letter-spacing: 0.04em;
  margin: 0;
  line-height: 1;
}
.mono { font-family: var(--font-mono); }

/* ── the ink panel: the only container shape in the system ────────── */
.panel {
  min-width: 0;   /* a panel may never widen the page; children truncate instead */
  background: var(--surface);
  border: var(--ink-thick) solid var(--line);
  box-shadow: var(--shadow);
  padding: 1rem 1.1rem;
}
.panel.alert { box-shadow: var(--shadow-red); border-color: var(--shatta); }
.panel-title {
  font-family: var(--font-display);
  font-size: 1.35rem;
  letter-spacing: 0.05em;
  border-bottom: var(--ink-medium) solid var(--line);
  padding-bottom: 0.35rem;
  margin-bottom: 0.8rem;
  display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem;
}
.panel-title .sub {
  font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0;
  color: var(--text-dim); text-transform: uppercase;
}

header.hero {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.25rem;
  border-bottom: var(--ink-bold) solid var(--line);
  padding-bottom: 0.75rem; margin-bottom: 1.25rem;
}
header.hero h1 { font-size: clamp(1.9rem, 5vw, 3rem); }
.pulse {
  display: inline-flex; align-items: center; gap: 0.45rem;
  font-family: var(--font-mono); font-size: 0.8rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  border: var(--ink-medium) solid var(--line); padding: 0.25rem 0.6rem;
  background: var(--surface-alt);
}
.pulse .dot { width: 9px; height: 9px; border: 1px solid var(--line); }
.pulse.on  .dot { background: var(--shatta); animation: beat 1.4s var(--ease-hover) infinite; }
.pulse.off .dot { background: var(--inert); }
.pulse.warn .dot { background: var(--flame); }
@keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.5); } }
/* Why the loop is not working, on its own line under the chips. The chips describe PROCESSES
   — "running", "live feed" — and processes are what stayed true for eight hours over a
   cancelled rotation. The reason is the only thing on this page that describes PROGRESS. */
.whybar {
  flex-basis: 100%; order: 99;
  font-family: var(--font-mono); font-size: 0.76rem; font-weight: 700; line-height: 1.4;
  color: var(--warn-text); background: var(--surface-alt);
  border-left: var(--ink-bold) solid var(--flame); padding: 0.4rem 0.7rem;
}
.whybar.off { color: var(--text-soft); border-left-color: var(--inert); }
.tag.mute { color: var(--text-dim); }

/* ── layout ───────────────────────────────────────────────────────── */
.grid { display: grid; gap: 1.1rem; min-width: 0; }
.cols-2 { grid-template-columns: 1fr; }
.cols-3 { grid-template-columns: 1fr; }
@media (min-width: 760px)  { .cols-2 { grid-template-columns: 1.4fr 1fr; align-items: start; } }
@media (min-width: 1080px) { .cols-3 { grid-template-columns: repeat(3, 1fr); } }

/* ── progress: halftone fill, hard edge, never a gradient ─────────── */
.bar { height: 20px; border: var(--ink-medium) solid var(--line); background: var(--surface-alt); display: flex; overflow: hidden; }
.bar .seg { height: 100%; border-right: var(--ink-thin) solid var(--line); }
.bar .seg:last-child { border-right: 0; }
.seg.done  { background: var(--fill-solid); }
.seg.built { background: var(--flame-soft); background-image: repeating-linear-gradient(45deg, transparent 0 3px, var(--hatch) 3px 4px); }
.seg.open  { background: var(--surface-alt); }
.bar-legend { display: flex; flex-wrap: wrap; gap: 0.85rem; font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-soft); margin-top: 0.4rem; }
.bar-legend b { color: var(--text); }

.stat { display: flex; flex-direction: column; gap: 0.1rem; }
.stat .n { font-family: var(--font-display); font-size: 2rem; line-height: 1; }
.stat .l { font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-dim); }
.statrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 0.9rem; }

/* ── accounts ─────────────────────────────────────────────────────── */
.acct { border: var(--ink-medium) solid var(--line); background: var(--surface-alt); padding: 0.6rem 0.7rem; margin-bottom: 0.6rem; }
.acct:last-child { margin-bottom: 0; }
.acct.cold { border-color: var(--shatta); background: var(--surface-sunk); }
.acct-top { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
.acct-name { font-family: var(--font-display); font-size: 1.15rem; letter-spacing: 0.04em; }
.tag { font-family: var(--font-mono); font-size: 0.63rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; border: 1px solid var(--line); padding: 0.1rem 0.35rem; background: var(--surface); }
.tag.hot { background: var(--shatta); color: var(--on-fill); border-color: var(--shatta-deep); }
.tag.warm { background: var(--flame-soft); color: var(--on-warm); }
.gauge { height: 9px; border: 1px solid var(--line); background: var(--surface); margin-top: 0.45rem; }
.gauge > i { display: block; height: 100%; background: var(--fill-solid); }
.gauge > i.warn { background: var(--flame); }
.gauge > i.crit { background: var(--shatta); }
.acct-meta { display: flex; flex-wrap: wrap; gap: 0.75rem; font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-soft); margin-top: 0.4rem; }

/* ── buttons: ink blocks that press into the paper ────────────────── */
.controls { display: flex; flex-wrap: wrap; gap: 0.6rem; }
button {
  font-family: var(--font-display); font-size: 1.05rem; letter-spacing: 0.06em;
  background: var(--surface-alt); color: var(--text); cursor: pointer;
  border: var(--ink-thick) solid var(--line); box-shadow: var(--shadow-sm);
  padding: 0.45rem 1rem; transition: transform 180ms var(--ease-hover), box-shadow 180ms var(--ease-hover);
}
button:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 0 var(--offset); }
button:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 0 var(--offset); }
button:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
button.go   { background: var(--fill-solid); color: var(--page); }
button.warn { background: var(--flame-soft); color: var(--on-warm); }
button.danger { background: var(--shatta); color: var(--on-fill); border-color: var(--shatta-deep); }
button:focus-visible { outline: var(--ink-thick) solid var(--flame); outline-offset: 2px; }

/* ── live feed ────────────────────────────────────────────────────── */
.feed { font-family: var(--font-mono); font-size: 0.76rem; }
/* min-width:0 on both the flex row and the truncating child. Without it a nowrap flex
   item refuses to shrink below its content, the ellipsis never engages, and a long Bash
   command drags the panel to 1050px inside a 360px viewport — measured, not theoretical. */
.feed li { list-style: none; display: flex; gap: 0.5rem; padding: 0.22rem 0; border-bottom: 1px dashed var(--hairline); min-width: 0; }
.feed li:last-child { border-bottom: 0; }
.feed .tool { font-weight: 700; min-width: 5.4rem; flex: 0 0 auto; }
.feed .hint { color: var(--text-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 auto; }
.quote {
  border-left: var(--ink-bold) solid var(--shatta); background: var(--surface-alt);
  padding: 0.5rem 0.7rem; margin-top: 0.7rem; font-size: 0.85rem; font-style: italic;
}

/* ── table ────────────────────────────────────────────────────────── */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 0.74rem; }
th, td { text-align: left; padding: 0.32rem 0.5rem; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
th { font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-dim); border-bottom: var(--ink-medium) solid var(--line); }
/* td.note is declared in the command-centre layer below — it is now clamped to one line
   with the full text behind a per-row expand, which is what took 1261px off the record. */
tr.bad td { background: var(--row-bad); }
tr.warnrow td { background: var(--row-warn); }
.pill { border: 1px solid var(--line); padding: 0 0.3rem; font-size: 0.66rem; font-weight: 700; text-transform: uppercase; }
.pill.clean { background: var(--surface); }
.pill.bad { background: var(--shatta); color: var(--on-fill); }
.pill.warn { background: var(--flame-soft); color: var(--on-warm); }

.owed li { list-style: none; border-left: var(--ink-bold) solid var(--flame); background: var(--surface-alt); padding: 0.4rem 0.6rem; margin-bottom: 0.45rem; font-size: 0.84rem; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 1.1rem; z-index: 20;
  background: var(--fill-solid); color: var(--page); border: var(--ink-thick) solid var(--line);
  box-shadow: var(--shadow-red); padding: 0.6rem 1rem; font-family: var(--font-mono); font-size: 0.8rem; max-width: min(92vw, 46rem);
}
footer { margin-top: 1.4rem; padding-top: 0.7rem; border-top: var(--ink-medium) dashed var(--line-soft); font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-dim); }
.nojs { border: var(--ink-thick) solid var(--shatta); background: var(--surface); padding: 1rem; box-shadow: var(--shadow-red); }

/* ── tabs ──────────────────────────────────────────────────────────
   Same segmented shape as the theme switch, one size up. Consistency here is
   cheap and it means the two controls teach each other. */
.tabs { display: inline-flex; border: var(--ink-thick) solid var(--line); box-shadow: var(--shadow-sm); background: var(--surface-alt); margin-bottom: 1.1rem; }
.tabs button {
  font-family: var(--font-display); font-size: 1.05rem; letter-spacing: 0.06em;
  background: transparent; color: var(--text-dim);
  border: 0; box-shadow: none; padding: 0.4rem 1.1rem;
}
.tabs button + button { border-left: var(--ink-medium) solid var(--line); }
.tabs button:hover:not(:disabled), .tabs button:active:not(:disabled) { transform: none; box-shadow: none; }
.tabs button[aria-pressed="false"]:hover { background: var(--surface); color: var(--text); }
.tabs button[aria-pressed="true"] { background: var(--fill-solid); color: var(--page); }
.tabs .badge {
  font-family: var(--font-mono); font-size: 0.6rem; font-weight: 700;
  border: 1px solid currentColor; padding: 0 0.25rem; margin-left: 0.45rem; vertical-align: 0.15em;
}

/* ── the agent grid: one card per agent lifetime ───────────────────── */
.agentgrid { display: grid; gap: 0.8rem; grid-template-columns: 1fr; }
@media (min-width: 700px)  { .agentgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1120px) { .agentgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.agent {
  min-width: 0; text-align: left; width: 100%; cursor: pointer;
  background: var(--surface-alt); border: var(--ink-medium) solid var(--line);
  box-shadow: var(--shadow-sm); padding: 0.6rem 0.7rem;
  font-family: var(--font-body); font-size: 0.85rem; color: var(--text);
  display: flex; flex-direction: column; gap: 0.3rem;
  transition: transform 160ms var(--ease-hover), box-shadow 160ms var(--ease-hover);
}
.agent:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 0 var(--offset); }
.agent:active { transform: translate(2px, 2px); box-shadow: 0 0 0 0 var(--offset); }
.agent[aria-current="true"] { box-shadow: var(--shadow-red); border-color: var(--shatta); }
/* a running agent is the only thing on the page that draws a heavy edge */
.agent.running { border-left: var(--ink-bold) solid var(--shatta); }
.agent.failed  { border-left: var(--ink-bold) solid var(--shatta); background: var(--surface-sunk); }
.agent.stopped { opacity: 0.72; }
.agent.cmd { border-style: dashed; }

.agent-top { display: flex; align-items: baseline; gap: 0.5rem; min-width: 0; }
.agent-name { font-family: var(--font-display); font-size: 1.1rem; letter-spacing: 0.03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 auto; }
.agent-ix { font-family: var(--font-mono); font-size: 0.66rem; color: var(--text-dim); flex: 0 0 auto; }
.agent-desc { font-size: 0.8rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.agent-meta { font-family: var(--font-mono); font-size: 0.66rem; color: var(--text-soft); display: flex; flex-wrap: wrap; gap: 0.55rem; }
.agent-under { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-dim); }
.agent-last { font-family: var(--font-mono); font-size: 0.66rem; color: var(--text-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* Indeterminate, because the runtime reports no percentage and inventing one would be a lie. */
.runbar { height: 6px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; }
.runbar > i { display: block; height: 100%; width: 100%; }
.runbar.live > i {
  background: repeating-linear-gradient(45deg, var(--flame-soft) 0 5px, transparent 5px 10px);
  background-size: 200% 100%; animation: crawl 900ms linear infinite;
}
.runbar.done > i { background: var(--fill-solid); }
.runbar.cold > i { background: var(--inert); }
.runbar.bad  > i { background: var(--shatta); }
@keyframes crawl { from { background-position: 0 0; } to { background-position: -20px 0; } }

.sdot { width: 8px; height: 8px; border: 1px solid var(--line); flex: 0 0 auto; }
.sdot.running { background: var(--shatta); animation: beat 1.4s var(--ease-hover) infinite; }
.sdot.completed { background: var(--fill-solid); }
.sdot.stopped { background: var(--inert); }
.sdot.failed { background: var(--shatta); }

/* ── agent detail: a sheet, not a modal — the grid stays readable behind it ── */
.sheet { position: fixed; inset: auto 0 0 0; max-height: 76vh; z-index: 30; display: flex; flex-direction: column;
  background: var(--surface); border-top: var(--ink-bold) solid var(--line); box-shadow: 0 -6px 0 0 var(--offset); }
@media (min-width: 900px) { .sheet { inset: 0 0 0 auto; width: min(46rem, 52vw); max-height: none; border-top: 0; border-left: var(--ink-bold) solid var(--line); box-shadow: -6px 0 0 0 var(--offset); } }
.sheet-head { display: flex; align-items: baseline; gap: 0.6rem; padding: 0.8rem 1rem; border-bottom: var(--ink-medium) solid var(--line); }
.sheet-body { overflow-y: auto; padding: 0.9rem 1rem 1.4rem; min-height: 0; }
.sheet h4 { font-family: var(--font-mono); font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-dim); margin: 1.1rem 0 0.4rem; }
.sheet h4:first-child { margin-top: 0; }
.sheet pre { font-family: var(--font-mono); font-size: 0.7rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word;
  background: var(--surface-alt); border: var(--ink-thin) solid var(--line); padding: 0.6rem; margin: 0; max-height: 22rem; overflow-y: auto; }
.trace { list-style: none; margin: 0; padding: 0; font-family: var(--font-mono); font-size: 0.7rem; }
.trace li { display: flex; gap: 0.5rem; padding: 0.2rem 0; border-bottom: 1px dashed var(--hairline); min-width: 0; }
.trace li:last-child { border-bottom: 0; }
.trace .k { flex: 0 0 4.6rem; font-weight: 700; }
.trace .k.say { color: var(--hot); }
.trace .d { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.trace li.saying .d { font-family: var(--font-body); font-size: 0.78rem; font-style: italic; }

/* ── management: the three you can talk to ─────────────────────────
   A card per role, and a chat on the right when you open one. The card has to
   answer "is it working, and on what" without being clicked — a panel you must
   open to learn whether anything is happening is a panel you stop opening. */
.rolegrid { display: grid; gap: 0.9rem; grid-template-columns: 1fr; }
@media (min-width: 820px) { .rolegrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.role {
  min-width: 0; width: 100%; text-align: left; cursor: pointer;
  background: var(--surface-alt); border: var(--ink-thick) solid var(--line);
  box-shadow: var(--shadow); padding: 0.85rem 0.9rem;
  display: flex; flex-direction: column; gap: 0.4rem;
  font-family: var(--font-body); color: var(--text);
  transition: transform 160ms var(--ease-hover), box-shadow 160ms var(--ease-hover);
}
.role:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 0 var(--offset); }
.role:active { transform: translate(2px, 2px); box-shadow: 0 0 0 0 var(--offset); }
.role[aria-current="true"] { border-color: var(--shatta); box-shadow: var(--shadow-red); }
.role.working { border-left: var(--ink-heavy, 8px) solid var(--shatta); }

.role-name { font-family: var(--font-display); font-size: 1.4rem; letter-spacing: 0.03em; line-height: 1; }
.role-tag { font-size: 0.8rem; color: var(--text-soft); line-height: 1.35; }
.role-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.chip {
  font-family: var(--font-mono); font-size: 0.56rem; font-weight: 700; letter-spacing: 0.07em;
  text-transform: uppercase; border: 1px solid var(--line); padding: 0.05rem 0.3rem;
}
.chip.live { background: var(--shatta); color: var(--on-fill); border-color: var(--shatta); }
.chip.ro { background: var(--surface); color: var(--text-dim); }
.chip.warn { background: var(--flame-soft); color: var(--on-warm); border-color: var(--flame); }
.role-said {
  font-size: 0.79rem; line-height: 1.4; color: var(--text-soft);
  border-left: var(--ink-medium) solid var(--hairline); padding-left: 0.5rem;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.role-doing { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-dim); }
.role-doing div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.role-foot { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-dim); display: flex; flex-wrap: wrap; gap: 0.5rem; }

/* ── the chat ───────────────────────────────────────────────────────── */
.chatwrap { display: flex; flex-direction: column; min-height: 0; height: 100%; }
.chatlog { flex: 1 1 auto; overflow-y: auto; min-height: 0; padding-right: 0.2rem; }
.turn { margin-bottom: 0.7rem; }
.turn .who {
  font-family: var(--font-mono); font-size: 0.58rem; font-weight: 700; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.2rem;
}
.turn .said {
  font-size: 0.86rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere;
  border: var(--ink-thin) solid var(--hairline); background: var(--surface-alt); padding: 0.5rem 0.6rem;
}
.turn.me .said { background: var(--surface); border-left: var(--ink-thick) solid var(--line); }
.turn.them .said { border-left: var(--ink-thick) solid var(--shatta); }
.turn.err .said { border-color: var(--shatta); color: var(--hot); }
.turn .meta { font-family: var(--font-mono); font-size: 0.58rem; color: var(--text-dim); margin-top: 0.15rem; }
.turn details { margin-top: 0.25rem; }
.turn summary { font-family: var(--font-mono); font-size: 0.6rem; color: var(--text-dim); cursor: pointer; }
.turn details ul { list-style: none; margin: 0.25rem 0 0; padding: 0; font-family: var(--font-mono); font-size: 0.62rem; }
.turn details li { padding: 0.1rem 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.thinking { border: var(--ink-medium) dashed var(--shatta); padding: 0.5rem 0.6rem; margin-bottom: 0.7rem; }
.thinking .lab { font-family: var(--font-mono); font-size: 0.58rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--hot); }
.thinking ul { list-style: none; margin: 0.3rem 0 0; padding: 0; font-family: var(--font-mono); font-size: 0.64rem; }
.thinking li { padding: 0.08rem 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.composer { flex: 0 0 auto; border-top: var(--ink-medium) solid var(--line); padding-top: 0.6rem; margin-top: 0.6rem; }
.composer textarea {
  width: 100%; font-family: var(--font-body); font-size: 0.86rem; line-height: 1.45;
  padding: 0.5rem 0.6rem; min-height: 4.2rem; resize: vertical;
  background: var(--surface-alt); color: var(--text); border: var(--ink-medium) solid var(--line);
}
.composer textarea:focus-visible { outline: var(--ink-medium) solid var(--flame); outline-offset: 1px; }
.composer .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 0.45rem; }
.composer .hint { font-family: var(--font-mono); font-size: 0.6rem; color: var(--text-dim); flex: 1 1 8rem; min-width: 0; }

.tasklist { list-style: none; margin: 0.4rem 0 0; padding: 0; font-family: var(--font-mono); font-size: 0.68rem; }
.tasklist li { display: flex; gap: 0.5rem; align-items: baseline; padding: 0.2rem 0; border-bottom: 1px dashed var(--hairline); }
.tasklist li:last-child { border-bottom: 0; }
.tasklist .t { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.tasklist .st { flex: 0 0 auto; font-size: 0.56rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-dim); }

/* ── the founder brief: a journey you can walk ──────────────────────
   Density is the point. A founder opens this once per spec, works down it, and
   must be able to tell at a glance which step is next — so the current step is
   the only loud thing on the sheet. */
.owed li button.owedrow {
  display: block; width: 100%; text-align: left; background: transparent;
  border: 0; box-shadow: none; padding: 0; font: inherit; color: inherit; cursor: pointer;
}
.owed li button.owedrow:hover:not(:disabled),
.owed li button.owedrow:active:not(:disabled) { transform: none; box-shadow: none; }
.owed li button.owedrow:hover .owedtitle { text-decoration: underline; }
.owedmeta { font-family: var(--font-mono); font-size: 0.64rem; color: var(--text-dim); margin-top: 0.2rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.owedmeta .ready { color: var(--hot); font-weight: 700; }

.minibar { height: 5px; border: 1px solid var(--line); background: var(--surface-alt); margin-top: 0.3rem; max-width: 14rem; }
.minibar > i { display: block; height: 100%; background: var(--fill-solid); }
.minibar > i.full { background: var(--shatta); }

.bigbar { height: 14px; border: var(--ink-medium) solid var(--line); background: var(--surface-alt); }
.bigbar > i { display: block; height: 100%; background: var(--flame-soft);
  background-image: repeating-linear-gradient(45deg, transparent 0 4px, var(--hatch) 4px 5px); }
.bigbar > i.full { background: var(--fill-solid); background-image: none; }

.stepnav {
  position: sticky; top: 0; z-index: 2; margin: -0.9rem -1rem 0.9rem; padding: 0.6rem 1rem;
  background: var(--surface); border-bottom: var(--ink-medium) solid var(--line);
}
.stepnav .row { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; }
.stepnav .count { font-family: var(--font-display); font-size: 1.15rem; letter-spacing: 0.03em; flex: 0 0 auto; }

.sect { margin-top: 1.4rem; }
.sect:first-of-type { margin-top: 0; }
.sect > h5 {
  font-family: var(--font-display); font-size: 1.1rem; letter-spacing: 0.04em;
  margin: 0 0 0.15rem; display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;
}
.sect > h5 .pri { font-family: var(--font-mono); font-size: 0.6rem; border: 1px solid var(--line); padding: 0 0.25rem; }
.sect > h5 .opt { font-family: var(--font-mono); font-size: 0.58rem; color: var(--text-dim); border: 0; }
.sect > .note { font-size: 0.82rem; color: var(--text-soft); margin: 0 0 0.6rem; line-height: 1.4; }

.check { display: flex; gap: 0.6rem; padding: 0.5rem 0.6rem; border: var(--ink-thin) solid var(--hairline); margin-bottom: 0.45rem; background: var(--surface-alt); }
.check.done { opacity: 0.62; }
.check.next { border: var(--ink-thick) solid var(--shatta); box-shadow: var(--shadow-sm); opacity: 1; background: var(--surface); }
.check input[type="checkbox"] {
  appearance: none; -webkit-appearance: none; margin: 0.15rem 0 0; flex: 0 0 auto;
  width: 17px; height: 17px; border: var(--ink-medium) solid var(--line);
  background: var(--surface-alt); cursor: pointer; display: grid; place-content: center;
}
.check input[type="checkbox"]:checked { background: var(--fill-solid); }
.check input[type="checkbox"]:checked::after { content: ''; width: 9px; height: 5px; border-left: 2px solid var(--page); border-bottom: 2px solid var(--page); transform: rotate(-45deg) translate(1px, -2px); }
.check input[type="checkbox"]:focus-visible { outline: var(--ink-medium) solid var(--flame); outline-offset: 2px; }
.check .body { flex: 1 1 auto; min-width: 0; }
.check .ct { font-weight: 700; font-size: 0.86rem; display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
.check .ct .tag { font-family: var(--font-mono); font-size: 0.56rem; font-weight: 700; letter-spacing: 0.08em; background: var(--shatta); color: var(--on-fill); padding: 0 0.3rem; }
.check .cd { font-size: 0.82rem; line-height: 1.45; margin-top: 0.2rem; color: var(--text-soft); }
.gwt { margin-top: 0.35rem; font-size: 0.82rem; line-height: 1.45; }
.gwt div { display: flex; gap: 0.5rem; padding: 0.1rem 0; }
.gwt b { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.08em; flex: 0 0 3.4rem; padding-top: 0.2rem; color: var(--text-dim); }
.gwt span { flex: 1 1 auto; min-width: 0; }
.cmds { margin-top: 0.35rem; }
.cmds code { display: block; font-family: var(--font-mono); font-size: 0.7rem; background: var(--surface); border: var(--ink-thin) solid var(--hairline); padding: 0.22rem 0.4rem; margin-bottom: 0.2rem; overflow-wrap: anywhere; }
.prov { font-family: var(--font-mono); font-size: 0.6rem; color: var(--text-dim); margin-top: 0.3rem; }
.notebox { margin-top: 0.4rem; }
.notebox textarea {
  width: 100%; font-family: var(--font-body); font-size: 0.8rem; padding: 0.35rem 0.45rem;
  background: var(--surface-alt); color: var(--text); border: var(--ink-thin) solid var(--line); resize: vertical; min-height: 2.4rem;
}
.notebox textarea:focus-visible { outline: var(--ink-medium) solid var(--flame); outline-offset: 1px; }

.signoff { margin-top: 1.6rem; border: var(--ink-thick) solid var(--line); padding: 0.9rem; background: var(--surface-alt); }
.signoff.ready { border-color: var(--shatta); box-shadow: var(--shadow-red); }
.signoff h5 { font-family: var(--font-display); font-size: 1.2rem; letter-spacing: 0.04em; margin: 0 0 0.35rem; }
.signoff p { font-size: 0.82rem; line-height: 1.45; margin: 0 0 0.7rem; color: var(--text-soft); }
.problems { margin-top: 1.4rem; border-left: var(--ink-bold) solid var(--flame); padding: 0.5rem 0.7rem; background: var(--surface-alt); }
.problems li { font-family: var(--font-mono); font-size: 0.68rem; margin-bottom: 0.2rem; overflow-wrap: anywhere; }

/* ── history: what has already returned ────────────────────────────
   A row, not a card. 24 finished commands as cards is 24 pieces of furniture
   for information nobody is acting on; the same 24 as rows is a scannable
   record that stays out of the way of the two things actually running. */
.hist { list-style: none; margin: 0; padding: 0; }
.histrow {
  display: flex; align-items: baseline; gap: 0.55rem; width: 100%; text-align: left;
  background: transparent; border: 0; border-radius: 0; box-shadow: none;
  border-bottom: 1px dashed var(--hairline);
  padding: 0.28rem 0.2rem; font-family: var(--font-mono); font-size: 0.72rem;
  color: var(--text); cursor: pointer; min-width: 0;
}
.histrow:hover:not(:disabled) { background: var(--surface-alt); transform: none; box-shadow: none; }
.histrow:active:not(:disabled) { transform: none; box-shadow: none; }
.histrow[aria-current="true"] { background: var(--surface-alt); border-left: var(--ink-thick) solid var(--shatta); padding-left: 0.4rem; }
/* Wraps rather than clips. `flex: 0 0 auto` on the stat made it refuse to shrink below its
   content, so at 360px "17 tools · 30k tok · 1m" pushed the page 12px wider than the viewport
   — the same trap that once dragged a panel to 1050px inside a 360px screen. Wrapping keeps
   every figure readable instead of trading overflow for truncation. */
.histrow { flex-wrap: wrap; }
.histrow .hname { font-family: var(--font-display); font-size: 0.92rem; letter-spacing: 0.03em; flex: 0 0 auto; }
.histrow .hdesc { flex: 1 1 6rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-soft); }
.histrow .hstat { flex: 0 1 auto; margin-left: auto; color: var(--text-dim); font-size: 0.64rem; }
.histrow.failed .hname { color: var(--hot); }

/* ── where we are ──────────────────────────────────────────────────── */
.where-head { font-family: var(--font-display); font-size: clamp(1.15rem, 2.6vw, 1.6rem); line-height: 1.15; }
.where-phase { font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-top: 0.3rem; }
.where-list { list-style: none; margin: 0.8rem 0 0; padding: 0; }
.where-list li { border-left: var(--ink-thick) solid var(--line); padding: 0.25rem 0 0.25rem 0.6rem; margin-bottom: 0.4rem; font-size: 0.85rem; }
.where-list li.block { border-left-color: var(--shatta); }
.where-src { font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-dim); margin-top: 0.7rem; }
.linkish { background: none; border: 0; box-shadow: none; padding: 0; font: inherit; color: var(--hot); text-decoration: underline; cursor: pointer; }
.linkish:hover:not(:disabled), .linkish:active:not(:disabled) { transform: none; box-shadow: none; }

/* ── theme switch: one ink block cut into three ────────────────────
   Three states, not two. AUTO has to exist as its own position, because a
   two-way toggle cannot express "follow the machine" — the moment you touch
   it you have silently opted out of the system setting forever. */
.theme-seg {
  display: inline-flex; align-items: stretch;
  border: var(--ink-thick) solid var(--line);
  box-shadow: var(--shadow-sm);
  background: var(--surface-alt);
}
.theme-seg button {
  font-family: var(--font-mono); font-size: 0.6rem; font-weight: 700;
  letter-spacing: 0.11em; text-transform: uppercase;
  background: transparent; color: var(--text-dim);
  border: 0; border-radius: 0; box-shadow: none;
  padding: 0.34rem 0.55rem; line-height: 1;
  transition: background 140ms var(--ease-hover), color 140ms var(--ease-hover);
}
.theme-seg button + button { border-left: var(--ink-medium) solid var(--line); }
/* the generic button rules lift and drop on press; a segment of a switch must not move */
.theme-seg button:hover:not(:disabled),
.theme-seg button:active:not(:disabled) { transform: none; box-shadow: none; }
.theme-seg button:hover[aria-pressed="false"] { background: var(--surface); color: var(--text); }
.theme-seg button[aria-pressed="true"] { background: var(--fill-solid); color: var(--page); }

/* ══════════════════════════════════════════════════════════════════
   THE COMMAND-CENTRE LAYER — added in the Overview rebuild.

   The system above is LOCKED and nothing below redefines it: every rule here
   addresses a ROLE token, so paper / night / auto keep working with zero new
   declarations, and no thirteenth colour is introduced. What is new is a MOTION
   SCALE and a HIERARCHY — the page had nine co-equal panels and no answer.

   Motion law, because this page repaints every 4 seconds:
     · animate transform and opacity only, never width / height / top in a hot path;
     · one-shot animations are triggered from a VALUE change, never from a render,
       and are removed on animationend so a mid-flight re-render cannot restart them;
     · infinite ambient animations live only on elements React never unmounts, so
       their CSS clock is never reset.
   ══════════════════════════════════════════════════════════════════ */
:root {
  /* four steps plus one event step. Nothing on this page may invent a sixth. */
  --dur-fast:  120ms;
  --dur-base:  220ms;
  --dur-state: 420ms;
  --dur-slow:  640ms;
  --dur-event: 900ms;
  --ease-snap: cubic-bezier(0.2, 0, 0, 1);
  --ease-out:  cubic-bezier(0.16, 1, 0.3, 1);
  /* the one scale addition: the single state word, and nothing else, ever */
  --display-mega: clamp(2.4rem, 5.6vw, 4.6rem);
  /* a list that grows past this scrolls inside itself rather than growing the page */
  --list-cap: 21rem;
}

/* ── ZONE 0+1 — the dock ───────────────────────────────────────────
   Header and tabs are ONE sticky element rather than two stacked ones. Two
   stickies need the second to know the first's height, which is a magic number
   that breaks the moment the hero wraps at a narrow width. */
.topdock {
  position: sticky; top: 0; z-index: 6;
  background: var(--page);
  margin: calc(var(--gutter) * -1) calc(var(--gutter) * -1) 1.1rem;
  padding: 0.5rem var(--gutter) 0;
  border-bottom: var(--ink-bold) solid var(--line);
}
.topdock .tabs { margin-bottom: 0.5rem; }
/* On a phone the hero wraps to five rows, and a sticky dock would eat a quarter of the
   screen forever. Below the two-column breakpoint it scrolls away like any other block. */
@media (max-width: 759px) { .topdock { position: static; } }
header.hero { border-bottom: 0; padding-bottom: 0.45rem; margin-bottom: 0; gap: 0.45rem 0.8rem; }
header.hero h1 { font-size: clamp(1.15rem, 2.4vw, 1.6rem); }
header.hero .pulse { font-size: 0.68rem; padding: 0.18rem 0.45rem; }
header.hero button { font-size: 0.88rem; padding: 0.28rem 0.7rem; }
header.hero .theme-seg button { font-size: 0.55rem; padding: 0.26rem 0.45rem; }
header.hero .controls { gap: 0.4rem; }
/* The reason line has LEFT the header for the marquee, where it is read at 3x the
   size. It keeps its class because it keeps its meaning. */
@media (min-width: 1200px) {
  header.hero { flex-wrap: nowrap; }
  header.hero .controls { flex-wrap: nowrap; }
  header.hero h1 { flex: 0 0 auto; white-space: nowrap; }
}

/* ── ZONE 2 — the marquee ──────────────────────────────────────────
   One dominant readout answering the founder's four questions in one glance:
   is it working (cell A), on what (B), for how long (B), at what cost (C). */
.marquee { display: grid; gap: 1rem; grid-template-columns: 1fr; align-items: start; min-width: 0; }
@media (min-width: 1080px) {
  .marquee { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 0.85fr); gap: 1.4rem; }
}
.mq-cell { min-width: 0; }
.mq-cell + .mq-cell { border-top: var(--ink-thin) dashed var(--line-soft); padding-top: 0.9rem; }
@media (min-width: 1080px) {
  .mq-cell + .mq-cell { border-top: 0; padding-top: 0; border-left: var(--ink-thin) dashed var(--line-soft); padding-left: 1.3rem; }
}
.mq-label {
  font-family: var(--font-mono); font-size: 0.62rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim);
  margin-bottom: 0.45rem;
}
.mq-head { display: flex; align-items: center; gap: 0.7rem; min-width: 0; }

/* M2 / M3 live here. The dot is a stable DOM node — React never unmounts it — so its
   animation clock survives every 4-second state push untouched. */
.marquee-dot {
  width: 18px; height: 18px; flex: 0 0 auto; position: relative;
  border: var(--ink-medium) solid var(--line); background: var(--inert);
}
.marquee-dot.on { background: var(--shatta); animation: beat 1.4s var(--ease-hover) infinite; }
.marquee-dot.warn { background: var(--flame); }
/* M3: an idle dashboard that is perfectly still is indistinguishable from a crashed tab. */
.marquee-dot.off { animation: breathe 6s ease-in-out infinite; }
.marquee-dot.on::after {
  content: ''; position: absolute; inset: -3px; border: var(--ink-medium) solid var(--shatta);
  opacity: 0.5; will-change: transform; pointer-events: none;
  animation: ring 2.6s var(--ease-out) infinite;
}
@keyframes ring { from { transform: scale(1); opacity: 0.5; } to { transform: scale(2.2); opacity: 0; } }
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

/* M1: the only fact on this page that changes MEANING rather than magnitude. Transform and
   opacity only — letter-spacing or font-size would reflow a Bangers word at 4.6rem. */
.marquee-state {
  font-family: var(--font-display); font-weight: 400;
  font-size: var(--display-mega); line-height: 0.85; letter-spacing: 0.03em;
  min-width: 0; overflow: hidden; text-overflow: ellipsis;
}
.marquee-state.swap { animation: stateSwap var(--dur-state) var(--ease-snap); }
@keyframes stateSwap {
  0%   { transform: translateY(0);        opacity: 1; }
  45%  { transform: translateY(-0.12em);  opacity: 0; }
  100% { transform: translateY(0);        opacity: 1; }
}

.marquee-rule { position: relative; height: 3px; background: var(--line); margin: 0.6rem 0 0.7rem; overflow: hidden; }
.marquee-rule.idle::after {
  content: ''; position: absolute; top: 0; left: 0; height: 2px; width: 45%;
  background: var(--flame-soft); opacity: 0.4;
  animation: sweep 4.5s ease-in-out infinite;
}
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(322%); } }

.marquee-lane {
  border-left: var(--ink-bold) solid var(--shatta); background: var(--surface-alt);
  padding: 0.4rem 0.6rem; margin-bottom: 0.5rem; min-width: 0;
}
.marquee-lane:last-child { margin-bottom: 0; }
.mq-lane-top { display: flex; align-items: baseline; gap: 0.5rem; min-width: 0; }
.mq-lane-name {
  font-family: var(--font-display); font-size: 1.1rem; letter-spacing: 0.03em;
  min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* M4 earns its place by NOT animating: a digit that fades in is a digit you cannot read at
   the moment it changes, and this surface is watched for hours. */
.mq-clock {
  font-family: var(--font-mono); font-size: 0.82rem; font-weight: 700;
  font-variant-numeric: tabular-nums; flex: 0 0 auto;
}
.chipbtn {
  font-family: var(--font-mono); font-size: 0.56rem; font-weight: 700; letter-spacing: 0.07em;
  text-transform: uppercase; border: 1px solid var(--line); padding: 0.05rem 0.35rem;
  box-shadow: none; cursor: pointer; line-height: 1.5;
  transition: transform var(--dur-fast) var(--ease-snap);
}
.chipbtn:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 2px 2px 0 0 var(--offset); }
.chipbtn:active:not(:disabled) { transform: translate(1px, 1px); box-shadow: none; }
.statrow.two { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.6rem 0.9rem; }
.statrow.two .stat .n { font-size: 1.7rem; }

/* M6: a bar that ADVANCES rather than teleports. scaleX, not width — width relayouts the
   panel, transform does not, and this repaints every four seconds. */
.gauge > i, .minibar > i {
  width: 100%; transform-origin: left center; transform: scaleX(0);
  transition: transform var(--dur-slow) var(--ease-snap);
}

/* ── ZONE 4 — obligations ──────────────────────────────────────────
   Owed was 1579px of single-column list. The same items, three across, are 168px. */
.owedgrid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(16.5rem, 1fr));
  gap: 0.5rem; margin: 0; padding: 0; align-items: start;
}
.owedgrid li { margin-bottom: 0; min-width: 0; }
.owedgrid.capped { max-height: var(--list-cap); overflow-y: auto; padding-right: 0.3rem; }
/* Two lines, then a title attribute, then the whole thing on click — the same escalation the
   feed's `.hint` already uses. One tile carrying a 180-character `affects` sentence made the
   grid 333px tall per row, which is the single-column list wearing a grid. */
.owedtitle {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; overflow-wrap: anywhere; line-height: 1.3;
}
.owedaffects { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 6rem; }
.acctgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 0.6rem; align-items: start; }
.acctgrid .acct { margin-bottom: 0; }

/* ── ZONE 5 — the status rail ──────────────────────────────────────
   These collapse VISUALLY, never conditionally: the content is always in the DOM, so a
   test that reads the rendered tree — and a founder using ctrl-F — still finds every row.
   grid-template-rows 0fr → 1fr is the only height transition that animates to `auto`. */
.disclose { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur-slow) var(--ease-snap); }
.disclose > div { overflow: hidden; min-height: 0; }
.disclose.open { grid-template-rows: 1fr; }

.striphead { display: flex; align-items: center; gap: 0.55rem; flex-wrap: wrap; min-width: 0; }
.stripone {
  font-family: var(--font-mono); font-size: 0.74rem; flex: 1 1 8rem; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.strip-dots { display: flex; gap: 4px; flex: 0 0 auto; }
.strip-dots i { display: block; width: 10px; height: 10px; border: 1px solid var(--line); background: var(--inert); }
.strip-dots i.ok   { background: var(--fill-solid); }
.strip-dots i.warm { background: var(--flame-soft); }
.strip-dots i.hot  { background: var(--shatta); animation: beat 1.4s var(--ease-hover) infinite; }
.strip-dots i.mute { background: var(--inert); }
.stripline { font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-soft); margin-top: 0.45rem; line-height: 1.35; }
.chev { display: inline-block; transition: transform var(--dur-base) var(--ease-snap); }
.chev.open { transform: rotate(90deg); }
.scrollcap { max-height: var(--list-cap); overflow-y: auto; padding-right: 0.3rem; }
.morebox > summary {
  font-family: var(--font-mono); font-size: 0.68rem; color: var(--hot);
  cursor: pointer; padding: 0.25rem 0; text-decoration: underline;
}

/* ── ZONE 6 — records ──────────────────────────────────────────────
   `td.note { white-space: normal; min-width: 16rem }` was the actual height killer: it let
   40 notes wrap to three lines each. The note is not deleted, it is clamped and expandable. */
.tickscroll { max-height: 30rem; overflow: auto; }
.tickscroll thead th { position: sticky; top: 0; z-index: 1; background: var(--surface); }
td.note { white-space: nowrap; max-width: 24rem; overflow: hidden; text-overflow: ellipsis; color: var(--text-soft); }
tr.detail td { white-space: normal; background: var(--surface-alt); font-size: 0.7rem; line-height: 1.5; }
tr.detail b { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }
.notebtn {
  background: none; border: 0; box-shadow: none; padding: 0; font: inherit; color: inherit;
  cursor: pointer; display: flex; gap: 0.35rem; align-items: baseline; min-width: 0; width: 100%; text-align: left;
}
.notebtn:hover:not(:disabled), .notebtn:active:not(:disabled) { transform: none; box-shadow: none; }
.notebtn .nt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 auto; }

/* progressive disclosure inside the live panel: the tail is already bounded by the pump, so
   a virtualizer here would be a lie about the cost. */
.quote.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.showall { margin-top: 0.45rem; font-family: var(--font-mono); font-size: 0.68rem; }

/* Directive 3 is linework and hard offsets — neither needs motion to read, and the founder
   watches this page for hours. Everything ambient stops; nothing moves or disappears. */
@media (prefers-reduced-motion: reduce) {
  .marquee-dot.on, .marquee-dot.off, .marquee-dot.on::after,
  .marquee-rule.idle::after, .strip-dots i.hot, .runbar.live > i { animation: none !important; }
  .marquee-dot.on::after { opacity: 0.35; }
  .marquee-rule.idle::after { opacity: 0.25; transform: translateX(0); }
  .runbar.live > i { background: repeating-linear-gradient(45deg, var(--flame-soft) 0 5px, transparent 5px 10px); }
  .marquee-state.swap { animation: none !important; }
  .disclose { transition: none; }
  .gauge > i, .minibar > i, .chev { transition: none; }
  * { will-change: auto !important; }
}

/* Directive 3 is linework and hard offsets — neither needs motion to read. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<div id="root"><div class="nojs"><strong>Loading the control room…</strong><br>If this persists, React could not be fetched. The terminal dashboard always works: <code>pnpm my-spec</code></div></div>

<!-- React is VENDORED, not fetched from a CDN. This page can start and kill processes
     through an unauthenticated local API, so a third-party script tag would be a
     supply-chain path straight into process control. Pinning an SRI hash would help; not
     loading remote code at all is better, and it works offline. -->
<meta name="loop-token" content="__LOOP_TOKEN__">
<script src="/react.production.min.js"></script>
<script src="/react-dom.production.min.js"></script>
<script>
const { useState, useEffect, useCallback, useRef, useMemo, createElement: h } = React;

// Per-server-start control token, injected into this HTML as it was served. A cross-origin
// page cannot read this document, so it cannot replay it — that is what makes the POST
// routes CSRF-resistant rather than merely loopback-bound.
const TOKEN = document.querySelector('meta[name="loop-token"]').content;

/* ── theme ─────────────────────────────────────────────────────────────
   Three modes: auto, light, dark. The resolved answer is written to
   data-theme on <html>, always explicitly, by the pre-paint script in
   <head> and then by this hook. The CSS carries no prefers-color-scheme
   block on purpose — one source of truth cannot disagree with itself.
   -------------------------------------------------------------------- */
/* ── management ────────────────────────────────────────────────────────
   Three roles, each a Claude Code session held open across turns. The loop had
   one overseer and nothing audited it, which is how 006 came to be marked built
   when it had never been started — so the manager exists to disagree with the
   supervisor, and the special agent exists for whatever you need that is neither.

   Replies stream. Each tool call a role makes arrives as it happens, so you watch
   it read the ledger rather than watching a spinner.
   -------------------------------------------------------------------- */

const roleAgo = (iso) => {
  if (!iso) return 'never';
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return Math.round(s) + 's ago';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
};

const money = (n) => '$' + (Number(n) || 0).toFixed(2);

const RoleCard = ({ role, live, selected, onOpen }) =>
  h('button', {
    className: 'role' + (role.busy || live?.length > 0 ? ' working' : ''),
    'aria-current': selected ? 'true' : 'false',
    onClick: () => onOpen(role.id),
  },
    h('div', { className: 'role-name' }, role.name),
    h('div', { className: 'role-tag' }, role.tagline),
    h('div', { className: 'role-chips' },
      (role.busy || live?.length > 0)
        ? h('span', { className: 'chip live' }, 'working now')
        : h('span', { className: 'chip ro' }, role.started ? 'idle' : 'not started yet'),
      // The permission mode is shown, not assumed. An auditor that could edit what it audits
      // would not be an auditor, and you should be able to see that rather than trust it.
      h('span', { className: 'chip ro' }, role.permissionMode === 'plan' ? 'read-only' : role.permissionMode),
      role.openTasks > 0 && h('span', { className: 'chip warn' }, role.openTasks + ' task' + (role.openTasks > 1 ? 's' : '')),
      role.id === 'special' && !role.hasMandate && h('span', { className: 'chip ro' }, 'no mandate yet')),
    role.lastSaid
      ? h('div', { className: 'role-said' }, role.lastSaid)
      : h('div', { className: 'role-said', style: { fontStyle: 'italic' } },
          'Nothing said yet. Open it and ask something — it reads the loop’s own state files to answer.'),
    live?.length > 0 && h('div', { className: 'role-doing' },
      live.slice(-2).map((st, i) => h('div', { key: i }, st.tool + '  ' + st.detail))),
    h('div', { className: 'role-foot' },
      h('span', null, role.turns + ' turn' + (role.turns === 1 ? '' : 's')),
      h('span', null, money(role.costUsd)),
      h('span', null, roleAgo(role.lastAt))));

const ChatSheet = ({ role, detail, liveSteps, partial, draft, onDraft, onSend, onClose, onTask, onMandate, busy }) => {
  if (!role) return null;
  const msgs = detail?.messages ?? [];
  const tasks = detail?.tasks ?? [];
  const working = role.busy || liveSteps.length > 0;

  return h('div', { className: 'sheet', role: 'dialog', 'aria-label': 'Chat with ' + role.name },
    h('div', { className: 'sheet-head' },
      h('i', { className: 'sdot ' + (working ? 'running' : 'completed') }),
      h('span', { className: 'display', style: { fontSize: '1.3rem', flex: 1, minWidth: 0 } }, role.name),
      h('button', { onClick: onClose }, 'Close')),

    h('div', { className: 'sheet-body chatwrap' },
      h('div', { className: 'prov', style: { marginBottom: '0.5rem' } },
        role.tagline + ' · ' + (role.permissionMode === 'plan' ? 'read-only: it can read this repo, not change it' : 'mode ' + role.permissionMode) +
        ' · ' + (detail?.session?.turns ?? 0) + ' turns, ' + money(detail?.session?.costUsd)),

      h('div', { className: 'chatlog' },
        msgs.length === 0 && !working && h('div', { className: 'mono', style: { fontSize: '0.72rem', color: 'var(--text-dim)' } },
          'No conversation yet. It reads QUEUE.json, LEDGER.jsonl, driver.log and the live tick to answer, and is told to say when it has not checked something rather than guess.'),

        msgs.map((m, i) => h('div', { key: i, className: 'turn ' + (m.from === 'founder' ? 'me' : 'them') + (m.error ? ' err' : '') },
          h('div', { className: 'who' }, m.from === 'founder' ? 'you' : role.name),
          h('div', { className: 'said' }, m.text),
          h('div', { className: 'meta' },
            roleAgo(m.at) + (m.costUsd ? ' · ' + money(m.costUsd) : '') + (m.error ? ' · ' + m.error : '')),
          m.activity?.length > 0 && h('details', null,
            h('summary', null, 'what it read (' + m.activity.length + ')'),
            h('ul', null, m.activity.map((a, j) => h('li', { key: j }, a.tool + '  ' + a.detail)))))),

        // While it works, the tool calls appear here as they happen. This is the difference
        // between "it is thinking" and knowing it just opened the wrong file.
        working && h('div', { className: 'thinking' },
          h('div', { className: 'lab' }, 'working'),
          partial && h('div', { className: 'said', style: { border: 0, background: 'transparent', padding: '0.2rem 0' } }, partial),
          h('ul', null, liveSteps.slice(-6).map((st, i) => h('li', { key: i }, st.tool + '  ' + st.detail))))),

      tasks.length > 0 && h('div', null,
        h('h5', { style: { fontFamily: 'var(--font-mono)', fontSize: '0.62rem', letterSpacing: '0.09em', textTransform: 'uppercase', color: 'var(--text-dim)', margin: '0.8rem 0 0' } }, 'tasks you gave it'),
        h('ul', { className: 'tasklist' }, tasks.slice(-8).reverse().map((t) => h('li', { key: t.id },
          h('span', { className: 't' }, t.text),
          h('span', { className: 'st' }, t.scheduledFor ? 'for ' + t.scheduledFor : t.status))))),

      role.id === 'special' && h('details', { style: { marginTop: '0.8rem' } },
        h('summary', { className: 'mono', style: { fontSize: '0.64rem', color: 'var(--text-dim)', cursor: 'pointer' } },
          detail?.mandate ? 'edit this agent’s mandate' : 'give this agent a mandate'),
        h('div', { className: 'notebox' },
          h('textarea', {
            defaultValue: detail?.mandate ?? '',
            placeholder: 'What is this agent for? Written to roles/special/mandate.md and read at the start of every session.',
            onBlur: (e) => onMandate(e.target.value),
            style: { minHeight: '6rem' },
          }))),

      h('div', { className: 'composer' },
        h('textarea', {
          value: draft, disabled: busy,
          placeholder: working
            ? 'It is still answering — a session cannot be resumed twice at once, so wait for the reply.'
            : 'Ask what it is doing, give it a task, or tell it to look at something. Enter sends; Shift+Enter for a new line.',
          onChange: (e) => onDraft(e.target.value),
          onKeyDown: (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSend(); }
          },
        }),
        h('div', { className: 'row' },
          h('button', { className: 'go', disabled: busy || working || !draft.trim(), onClick: onSend }, working ? 'Answering…' : 'Send'),
          h('button', { disabled: busy || !draft.trim(), onClick: () => onTask(draft) }, 'Queue as a task'),
          // Every message reloads the full toolset before it reads the question, so the first
          // turn of a session measured $0.42. Saying so is cheaper than a surprise.
          h('span', { className: 'hint' }, 'each message is a real session turn — roughly $0.20–$0.50 of quota')))));
};

/* ── the founder brief ─────────────────────────────────────────────────
   Everything on this sheet is read out of the repo by lib/founder-brief.mjs:
   the checks are the spec's own Given/When/Then acceptance scenarios, the
   setup steps are docs/dev-setup.md, the decisions are PARKED.md. Each one
   prints the file and line it came from, because a checklist a founder cannot
   audit is worth no more than the claim that the work is already done.
   -------------------------------------------------------------------- */

/** file:line, or a file plus a note when the source is a document without one. */
const provenance = (src) => {
  if (!src) return null;
  const base = String(src.file).replace(/\\/g, '/');
  return base + (src.line ? ':' + src.line : '') + (src.note ? ' (' + src.note + ')' : '');
};

const CheckRow = ({ check, sectionKey, isDone, isNext, note, onToggle, onNote, busy }) => {
  const [draft, setDraft] = useState(note ?? '');
  const [editing, setEditing] = useState(false);
  useEffect(() => { setDraft(note ?? ''); }, [note]);
  const gwt = check.given;
  const showNote = editing || Boolean(note) || isNext;

  return h('div', {
    className: 'check' + (isDone ? ' done' : '') + (isNext ? ' next' : ''),
    'data-next': isNext ? 'true' : undefined,
  },
    h('input', {
      type: 'checkbox', checked: isDone, disabled: busy,
      'aria-label': check.title + (isDone ? ' (done)' : ''),
      onChange: (e) => onToggle(check.key, e.target.checked),
    }),
    h('div', { className: 'body' },
      h('div', { className: 'ct' },
        h('span', null, check.title),
        isNext && h('span', { className: 'tag' }, 'do this next')),
      // A Given/When/Then reads as a test when it is laid out as one, and as a wall of
      // italics when it is not.
      gwt && (gwt.given || gwt.when || gwt.then)
        ? h('div', { className: 'gwt' },
            gwt.given && h('div', null, h('b', null, 'GIVEN'), h('span', null, gwt.given)),
            gwt.when && h('div', null, h('b', null, 'WHEN'), h('span', null, gwt.when)),
            gwt.then && h('div', null, h('b', null, 'THEN'), h('span', null, gwt.then)))
        : check.detail && h('div', { className: 'cd' }, check.detail),
      check.commands?.length > 0 && h('div', { className: 'cmds' },
        check.commands.map((cmd, i) => h('code', { key: i }, cmd))),
      provenance(check.source) && h('div', { className: 'prov' }, 'from ' + provenance(check.source)),
      showNote && h('div', { className: 'notebox' },
        h('textarea', {
          value: draft, placeholder: 'What did you actually see? (optional, saved with the sign-off)',
          onChange: (e) => { setDraft(e.target.value); setEditing(true); },
          onBlur: () => { if (draft !== (note ?? '')) onNote(check.key, draft); setEditing(false); },
        })),
      !showNote && h('button', { className: 'linkish', onClick: () => setEditing(true) }, 'add a note')));
};

const BriefSheet = ({ brief, busy, onToggle, onNote, onSignoff, onClose }) => {
  if (!brief) return null;
  if (brief.error) {
    return h('div', { className: 'sheet', role: 'dialog' },
      h('div', { className: 'sheet-head' },
        h('span', { className: 'display', style: { fontSize: '1.2rem', flex: 1 } }, 'Could not build the brief'),
        h('button', { onClick: onClose }, 'Close')),
      h('div', { className: 'sheet-body' }, h('pre', null, brief.error)));
  }

  const pg = brief.progress || { blockingDone: 0, blockingTotal: 0, checked: {}, notes: {} };
  const checked = pg.checked || {};
  const notes = pg.notes || {};

  // "One by one" is this line: the first unticked BLOCKING check is the only step marked, so
  // there is never a question about where to resume.
  let nextKey = null;
  for (const section of brief.sections) {
    if (NON_BLOCKING.has(section.key)) continue;
    for (const c of section.checks) { if (!checked[c.key] && !nextKey) nextKey = c.key; }
  }

  const frac = pg.blockingTotal ? pg.blockingDone / pg.blockingTotal : 0;
  const ready = pg.blockingTotal > 0 && pg.blockingDone === pg.blockingTotal;
  const signedOff = brief.signedOffInGit || Boolean(pg.signedOffAt);

  const jumpToNext = () => {
    const el = document.querySelector('.check[data-next="true"]');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  return h('div', { className: 'sheet', role: 'dialog', 'aria-label': 'Founder brief: ' + brief.title },
    h('div', { className: 'sheet-head' },
      h('span', { className: 'display', style: { fontSize: '1.25rem', flex: 1, minWidth: 0 } }, brief.title),
      h('button', { onClick: onClose }, 'Close')),

    h('div', { className: 'sheet-body' },
      h('div', { className: 'stepnav' },
        h('div', { className: 'row' },
          h('span', { className: 'count' }, pg.blockingDone + ' / ' + pg.blockingTotal),
          h('span', { style: { flex: 1, minWidth: '6rem' } },
            h('div', { className: 'bigbar' }, h('i', { className: ready ? 'full' : '', style: { width: Math.round(frac * 100) + '%' } }))),
          nextKey
            ? h('button', { onClick: jumpToNext }, 'Next step')
            : h('span', { className: 'mono', style: { fontSize: '0.68rem', color: 'var(--hot)', fontWeight: 700 } }, 'all checks walked'))),

      h('p', { style: { fontSize: '0.9rem', lineHeight: 1.5, marginTop: 0 } }, brief.headline),
      brief.why && h('p', { style: { fontSize: '0.84rem', lineHeight: 1.5, color: 'var(--text-soft)' } }, brief.why),
      brief.specDir && h('div', { className: 'prov' }, 'spec: ' + String(brief.specDir).replace(/\\/g, '/')),
      brief.affectsSpec && h('div', { className: 'prov' }, 'affects spec ' + brief.affectsSpec),

      brief.sections.map((section) => h('div', { className: 'sect', key: section.key },
        h('h5', null,
          section.title,
          section.priority && h('span', { className: 'pri' }, section.priority),
          NON_BLOCKING.has(section.key) &&
            h('span', { className: 'opt' }, 'does not gate sign-off')),
        section.note && h('p', { className: 'note' }, section.note),
        section.independentTest && h('p', { className: 'note' },
          h('b', null, 'How it is proved automatically: '), section.independentTest),

const resolveTheme = (mode) => mode === 'dark' || (mode === 'auto' && prefersDark());

/** The tab icon is part of the drawing: a cream stamp beside dark tabs reads as a mistake. */
function paintFavicon(dark) {
  const page = dark ? '%231A1A1A' : '%23EDE4CC';
  const line = dark ? '%23EDE4CC' : '%231A1A1A';
  const svg = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E" +
    "%3Crect width='32' height='32' fill='" + page + "'/%3E" +
    "%3Crect x='3' y='3' width='26' height='26' fill='none' stroke='" + line + "' stroke-width='3'/%3E" +
    "%3Ccircle cx='16' cy='16' r='6' fill='%23D62828'/%3E%3C/svg%3E";
  let el = document.querySelector('link[rel="icon"]');
  if (!el) { el = document.createElement('link'); el.rel = 'icon'; document.head.appendChild(el); }
  el.href = svg;
}

function useTheme() {
  const [mode, setMode] = useState(() => (window.__loopTheme && window.__loopTheme.mode) || 'auto');
  useEffect(() => {
    const apply = (dark) => {
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      paintFavicon(dark);
    };
    apply(resolveTheme(mode));
    try { localStorage.setItem(THEME_KEY, mode); } catch { /* private mode — the choice just will not survive a reload */ }
    if (mode !== 'auto') return undefined;
    // Only AUTO tracks the machine, and it tracks it LIVE — a system flip at dusk should
    // land on an open dashboard, which is the whole reason auto is a distinct position.
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => apply(mq.matches);
    mq.addEventListener('change', onChange);
    return () => mq.removeEventListener('change', onChange);
  }, [mode]);
  return [mode, setMode];
}

/* ── the live feed ─────────────────────────────────────────────────────
   One EventSource for the whole page. It carries four kinds of message:

     hello   the full agent tree as it stands, so arriving mid-tick shows the
             whole tick rather than only what happens after you looked
     agents  changed agents plus the activity lines appended since the last frame
     where   the derived narrative
     state   the same payload /api/state returns, pushed instead of polled

   EventSource reconnects by itself, which is most of why the transport is SSE.
   A slow poll stays as a backstop: if the stream dies in a way the browser does
   not notice, the page must go stale-and-visibly-so, never silently frozen.
   -------------------------------------------------------------------- */
function useLive() {
  const [agents, setAgents] = useState([]);
  const [counts, setCounts] = useState({});
  const [meta, setMeta] = useState(null);
  const [where, setWhere] = useState(null);
  const [state, setState] = useState(null);
  const [link, setLink] = useState('connecting');
  const [lastAt, setLastAt] = useState(null);
  const [roleEvent, setRoleEvent] = useState(null);
  // Activity is kept outside React state and mirrored through a counter: appending to a
  // per-agent log 150 lines at a time would otherwise re-render the whole grid each frame.
  const trace = useRef(new Map());
  const [traceTick, setTraceTick] = useState(0);

  useEffect(() => {
    const es = new EventSource('/api/live');
    const stamp = () => setLastAt(Date.now());

    es.onopen = () => { setLink('live'); stamp(); };
    es.onerror = () => setLink('reconnecting');

    es.addEventListener('hello', (e) => {
      const d = JSON.parse(e.data);
      setAgents(d.agents); setCounts(d.counts || {}); setMeta(d.meta); setWhere(d.where);
      setLink('live'); stamp();
    });

    es.addEventListener('tick', (e) => {
      // A new run STARTED IN ONE LANE. Only that lane's agents reset — clearing all three
      // lanes because one rotated made two healthy sessions vanish from the grid.
      const d = JSON.parse(e.data);
      const prefix = d.lane ? d.lane + '\u00b7' : null;
      if (prefix) {
        for (const k of [...trace.current.keys()]) if (String(k).startsWith(prefix)) trace.current.delete(k);
        setAgents((prev) => prev.filter((a) => !String(a.id).startsWith(prefix)));
      } else {
        trace.current = new Map();
        setAgents([]); setCounts({});
      }
      setMeta(d.meta); setTraceTick((n) => n + 1); stamp();
    });

    es.addEventListener('agents', (e) => {
      const d = JSON.parse(e.data);
      setCounts(d.counts || {});
      if (d.meta) setMeta(d.meta);
      setAgents((prev) => {
        const byId = new Map(prev.map((a) => [a.id, a]));
        for (const a of d.agents) byId.set(a.id, { ...(byId.get(a.id) || {}), ...a });
        // Spawn order, which is also the order the founder saw them appear.
        return [...byId.values()];
      });
      if (d.activity?.length) {
        for (const { id, entry } of d.activity) {
          const log = trace.current.get(id) || [];
          log.push(entry);
          if (log.length > 400) log.splice(0, log.length - 400);
          trace.current.set(id, log);
        }
        setTraceTick((n) => n + 1);
      }
      stamp();
    });

    // Sent when the tick's identity is resolved after the fact: the directory appears about
    // half a second before the driver logs which tick it is, so the first read can be missing
    // the spec, the stage and the start time.
    es.addEventListener('meta', (e) => { setMeta(JSON.parse(e.data).meta); stamp(); });
    // Role turns stream: every tool call as it happens, then the finished reply. The point is
    // being able to see it open the wrong file WHILE it happens, not afterwards.
    es.addEventListener('role', (e) => { setRoleEvent(JSON.parse(e.data)); stamp(); });
    es.addEventListener('where', (e) => { setWhere(JSON.parse(e.data)); stamp(); });
    es.addEventListener('state', (e) => { setState(JSON.parse(e.data)); stamp(); });

    return () => es.close();
  }, []);

  return { agents, counts, meta, where, state, link, lastAt, trace: trace.current, traceTick, roleEvent };
}

/** A command is not an agent and the worker is not a subagent; say so in the label. */
const agentLabel = (a) =>
  a.kind === 'session' ? a.name + ' (the worker)' : a.kind === 'local_bash' ? 'command' : a.name;

/**
 * A parked heading, as a founder-readable line.
 *
 * PARKED.md headings are not written to one format. Most are "2026-08-22 · reason", one is
 * "2026-08-22T03:58:14.061Z · reason", and one uses a hyphen — which the old single-separator
 * strip did not match, so that entry rendered with its date still attached while the others
 * did not. And one entry's whole reason is the placeholder "blocked item", which as a bullet
 * in a red panel tells the founder there is a blocker and nothing about it; keeping the date
 * at least lets them find it in PARKED.md.
 */
const parkedLabel = (raw) => {
  const m = String(raw).match(/^(\d{4}-\d{2}-\d{2}(?:T[\d:.]+Z)?)\s*[·\-—]\s*([\s\S]*)$/);
  const when = m ? m[1].slice(0, 10) : null;
  const text = (m ? m[2] : String(raw)).trim();
  if (when && /^(blocked item|blocked|parked)$/i.test(text)) {
    return text + ' — no reason was recorded (' + when + ', see PARKED.md)';
  }
  return text;
};

const AGENT_STAT = (a) => {

/* Supervisor status word → the tag class that colours it. Base tag is neutral (ok), warm is
   an amber caution (repaired / blocked), hot is the red the page reserves for a real break. */
const HEALTH_TAG = { ok: '', repaired: ' warm', failed: ' hot', blocked: ' warm', unknown: ' mute' };

/* ── pure helpers ──────────────────────────────────────────────────────
   Derivations with no hooks, no DOM and no closure over anything outside this
   block, so room-server.spec.ts can slice them out of this file and test them
   directly. A formatter that is only exercised through a screenshot is a
   formatter nobody has tested.
   -------------------------------------------------------------------- */

/**
 * A live elapsed clock: mm:ss under an hour, h:mm:ss over it.
 *
 * Seconds rather than the old whole-minute `fmtMin`, because the marquee's whole claim is
 * that the loop is moving RIGHT NOW — a figure that sits on "7m" for sixty seconds is
 * indistinguishable from a frozen page, which is the exact lie this room exists to stop.
 */
const laneElapsed = (startedAt, now) => {
  if (!startedAt) return '—';
  const total = Math.max(0, Math.floor((((now == null) ? Date.now() : now) - startedAt) / 1000));
  const hh = Math.floor(total / 3600);
  const mm = Math.floor((total % 3600) / 60);
  const ss = total % 60;
  const p2 = (n) => String(n).padStart(2, '0');
  return hh > 0 ? hh + ':' + p2(mm) + ':' + p2(ss) : p2(mm) + ':' + p2(ss);
};

/**
 * Owed items in the order a founder can actually clear them.
 *
 * Ready-to-sign-off first (one click finishes it), then most-progressed (the shortest walk
 * to the next sign-off), then oldest by the day it was recorded, and already-signed-off last
 * — those are receipts, not debts, and they are kept because a debt that vanishes the moment
 * it is paid gives the founder no way to check that it was. An item with no recorded date
 * sorts after ones that have one rather than pretending to be the oldest.
 */
const sortOwed = (items) => {
  const rank = (it) => (it && it.signedOff ? 3 : (it && it.progress && it.progress.complete) ? 0 : 1);
  const frac = (it) => (it && it.progress && it.progress.total ? it.progress.done / it.progress.total : 0);
  const when = (it) => String((it && it.recordedOn) || '￿');
  return (items || []).slice().sort((a, b) => {
    const r = rank(a) - rank(b);
    if (r !== 0) return r;
    const f = frac(b) - frac(a);
    if (f !== 0) return f;
    return when(a).localeCompare(when(b));
  });
};

/**
 * The one sentence the COLLAPSED self-healing strip shows.
 *
 * It has to be the worst thing on the roster, never a summary that averages a break away:
 * this panel exists because of the night the loop was dead for eight hours behind a header
 * that said RUNNING. "5 of 6 ok" is that header wearing a new font.
 */
const healthWorst = (rows) => {
  const list = rows || [];
  if (!list.length) return 'no checks on the roster';
  const failed = list.filter((r) => r.status === 'failed');
  if (failed.length) {
    return failed.length + ' check' + (failed.length > 1 ? 's' : '') + ' FAILING — ' +
      failed.map((r) => r.label).join(', ');
  }
  const warm = list.filter((r) => r.status === 'repaired' || r.status === 'blocked');
  if (warm.length) return warm.map((r) => r.label + ' ' + r.status).join(' · ');
  const quiet = list.filter((r) => r.status === 'unknown' || !r.reported);
  if (quiet.length === list.length) return 'nothing reported yet — ' + list.length + ' checks on the roster';
  if (quiet.length) return quiet.length + ' of ' + list.length + ' checks have never reported';
  return 'all ' + list.length + ' checks ok';
};
